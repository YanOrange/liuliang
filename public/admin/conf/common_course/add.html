<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>添加课程</title>
</head>
<body>

<form class="layui-form" lay-filter="layui-form">
    <div class="mainBox">
        <div class="main-container">
            <div class="main-container">
                <div class="layui-form-item">
                    <label class="layui-form-label">
                        <text title="必填项" style="color:red;">*</text>
                        商户</label>
                    <div class="layui-input-block">
                        <div class="xmSelect"
                             data-name="merchant_id"
                             data-sourceType="route"
                             data-source="/admin.common_api/getMerchantList"
                             data-radio="true"
                             data-textField="merchant_name"
                             data-valueField="id"
                             data-paging="true"
                             data-placeholder="商户"
                        ></div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">
                        <text title="必填项" style="color:red;">*</text>
                        关联应用</label>
                    <div class="layui-input-block" id="app-list11">
                        <div id="gather-app-list" class="demo-tree1"></div>
                        <input type="hidden" name="app_ids" id="app-list"/>
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">
                        <text title="必填项" style="color:red;">*</text>
                        关联渠道</label>
                    <div class="layui-input-block" id="app-list1">
                        <div id="gather-channel-list" class="demo-tree1"></div>
                        <input type="hidden" name="channel_ids" id="channel-list"/>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">
                        <text title="必填项" style="color:red;">*</text>
                        状态</label>
                    <div class="layui-input-block">
                        <input type="radio" name="status" value="1" title="上架">
                        <input type="radio" name="status" value="0" title="下架" checked>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">
                        <text title="必填项" style="color:red;">*</text>
                        标题</label>
                    <div class="layui-input-block">
                        <input type="text" name="title" lay-verify="required" autocomplete="off" placeholder="请输入标题"
                               class="layui-input">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">
                        <text title="必填项" style="color:red;">*</text>
                        视频封面图</label>
                    <div class="layui-input-block">
                        <div class="laytpUpload"
                             data-name="video_cover_image"
                             data-accept="image"
                             data-type="ali-oss-url"
                        ></div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">
                        <text title="必填项" style="color:red;">*</text>
                        视频</label>
                    <div class="layui-input-block">
                        <div class="laytpUpload"
                             data-name="video_url"
                             data-accept="video"
                             data-type="ali-oss-url"
                             data-viaServer="unVia"
                        ></div>
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">
                        <text title="必填项" style="color:red;">*</text>
                        落地页按钮图片</label>
                    <div class="layui-input-block">
                        <div class="laytpUpload"
                             data-name="landing_page_btn_image"
                             data-accept="image"
                             data-type="ali-oss-url"
                             data-layVerify="required"
                        ></div>
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">内容描述</label>
                    <div class="layui-input-block">
                        <textarea type="text" name="content" autocomplete="off" placeholder="请输入标题" class="layui-input"></textarea>
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">标签</label>
                    <div class="layui-input-block">
                        <input type="text" name="tag_names" autocomplete="off" placeholder="请输入标签,以','拼接，示例：标签1,标签2..."
                               class="layui-input">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">课程缩略图</label>
                    <div class="layui-input-block">
                        <div class="laytpUpload"
                             data-name="course_thumbnail_image"
                             data-accept="image"
                             data-type="ali-oss-url"
                        ></div>
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">
                        <text title="必填项" style="color:red;">*</text>
                        视频时长</label>
                    <div class="layui-input-block">
                        <input type="text" name="video_burning_time" lay-verify="required" autocomplete="off"
                               placeholder="请输入视频时长" class="layui-input">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">
                        <text title="必填项" style="color:red;">*</text>
                        报名费</label>
                    <div class="layui-input-block">
                        <input type="number" name="entry_fee" lay-verify="number" autocomplete="off"
                               placeholder="请输入报名费" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">
                        <text title="必填项" style="color:red;">*</text>
                        虚拟报名人数</label>
                    <div class="layui-input-block">
                        <input type="number" name="virtual_apply_nums" lay-verify="number" autocomplete="off"
                               placeholder="请输入虚拟报名人数" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">
                        <text title="必填项" style="color:red;">*</text>
                        按钮</label>
                    <div class="layui-input-block">
                        <input type="text" name="btn_desc" lay-verify="required" autocomplete="off" placeholder="请输入按钮"
                               class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">
                        <text title="必填项" style="color:red;">*</text>
                        二次确认报名按钮</label>
                    <div class="layui-input-block">
                        <input type="text" name="confirm_btn_desc" lay-verify="required" autocomplete="off"
                               placeholder="请输入确认报名按钮" class="layui-input" value="确认报名">
                    </div>
                </div>
                <div class="layui-form-item" >
                    <label class="layui-form-label" style="width: 180px;"><text title="必填项" style="color:red;">*</text>二次确认报名按钮背景颜色</label>
                    <div class="layui-input-block">
                        <div class="colorPicker"
                             data-id="confirm_btn_desc_background_color"
                             data-name="confirm_btn_desc_background_color"
                             data-color="#3ABFF9"
                             data-format="hex"
                             data-alpha="true"
                             data-predefine="true"
                             data-colors="['#ff4500','#1e90ff','rgba(255, 69, 0, 0.68)','rgb(255, 120, 0)']"
                        ></div>
                    </div>
                </div>
                <div class="layui-form-item"  >
                    <label class="layui-form-label" style="width: 180px;"><text title="必填项" style="color:red;">*</text>二次确认报名按钮字体颜色</label>
                    <div class="layui-input-block">
                        <div class="colorPicker"
                             data-id="confirm_btn_desc_font_color"
                             data-name="confirm_btn_desc_font_color"
                             data-color="#FFF"
                             data-format="hex"
                             data-alpha="true"
                             data-predefine="true"
                             data-colors="['#ff4500','#1e90ff','rgba(255, 69, 0, 0.68)','rgb(255, 120, 0)']"
                        ></div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label" style="width: 180px;">
                        <text title="必填项" style="color:red;">*</text>
                        报名成功加微按钮文案</label>
                    <div class="layui-input-block" >
                        <input type="text" name="apply_succeed_wx_btn" lay-verify="required" autocomplete="off"
                               placeholder="请输入报名成功加微按钮文案" class="layui-input" value="立即添加微信" style="width: 500px;">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">
                        <text title="必填项" style="color:red;">*</text>
                        排序</label>
                    <div class="layui-input-block">
                        <input type="number" name="sort" lay-verify="number" autocomplete="off" placeholder="请输入排序"
                               class="layui-input" value="0">
                    </div>
                </div>

            </div>
        </div>
    </div>
    <div class="bottom">
        <div class="button-container">
            <button type="submit" class="laytp-btn laytp-btn-primary laytp-btn-sm" lay-submit="" lay-filter="add">
                <i class="layui-icon layui-icon-ok"></i>
                提交
            </button>
            <button type="reset" class="laytp-btn laytp-btn-sm">
                <i class="layui-icon layui-icon-refresh"></i>
                重置
            </button>
        </div>
    </div>
</form>
<script>
    if (localStorage.getItem("staticDomain")) {
        document.write("<link rel='stylesheet' href='" + localStorage.getItem("staticDomain") + "/component/layui/css/layui.css?v=" + localStorage.getItem("version") + "'>");
        document.write("<script src='" + localStorage.getItem("staticDomain") + "/component/layui/layui.js?v=" + localStorage.getItem("version") + "'><\/script>");
        document.write("<script src='" + localStorage.getItem("staticDomain") + "/component/laytp/layuiConfig.js?v=" + localStorage.getItem("version") + "'><\/script>");
    } else {
        document.write("<link rel='stylesheet' href='/static/component/layui/css/layui.css?v=" + localStorage.getItem("version") + "'>");
        document.write("<script src='/static/component/layui/layui.js?v=" + localStorage.getItem("version") + "'><\/script>");
        document.write("<script src='/static/component/laytp/layuiConfig.js?v=" + localStorage.getItem("version") + "'><\/script>");
    }
</script>
<script>
    layui.use(['laytp'], function () {
        layui.form.on('submit(add)', function (data) {
            data = facade.setEditorField(data);
            facade.ajax({
                route: '/admin.course/add',
                data: data.field
            }).done(function (res) {
                if (res.code === 0) {
                    parent.layui.layer.close(parent.layui.layer.getFrameIndex(window.name));//关闭当前页
                    parent.layui.table.reload("laytp-table");
                }
            });
            return false;
        });
    });

    layui.use(['laytp'], function () {
        appTree();
        getTree();
    });

    // class - channel
    function getTree() {
        $("#channel-list").val('')
        let data11 = [];

        //获取数据，渲染到对应的节点上
        $.ajax({
            type: "post",
            url: "/admin.advertising/getChannelTree",
            data: {id: 0, table: 'course'},
            dataType: "json",
            success: function (res) {
                data11 = res.data;
                let tree11 = layui.tree
                    , layer = layui.layer
                    , util = layui.util
                    , list11 = []
                    , str11 = ""
                    , data22 = [];

                //基本演示
                tree11.render({
                    elem: '#gather-channel-list'
                    , data: data11
                    , showCheckbox: true            //是否显示复选框
                    , id: 'demoId22'
                    , isJump: true                  //是否允许点击节点时弹出新窗口跳转
                    , click: function (obj) {
                        var data11 = obj.data22;    //获取当前点击的节点数据
                        layer.msg('状态：' + obj.state + '<br>节点数据：' + JSON.stringify(data));
                    }
                });

                //filter并非必须
                layui.use(['form'], function () {
                    let form11 = layui.form;
                    form11.on('checkbox()', function (data) {

                        if (data.value.slice(data.value.length - 1) == "#") {   // 父级应用分类点击：全选
                            data11.forEach(element => {
                                if (data.value == element.id) {
                                    element.children.forEach(ele => {
                                        if ($(this).is(':checked')) {
                                            list11.push(ele.id)
                                        } else {
                                            list11 = list11.filter((x) => x !== ele.id)
                                        }
                                    })
                                }
                            });
                        } else {

                            data11.forEach(element => {
                                element.children.forEach(ele => {
                                    if (data.value == ele.id) {             // 应用点击
                                        if ($(this).is(':checked')) {
                                            list11.push(ele.id)
                                        } else {
                                            list11 = list11.filter((x) => x !== ele.id)
                                        }
                                    } else {
                                        ele.children.forEach(el => {        // 渠道点击
                                            if (data.value == el.id) {
                                                if ($(this).is(':checked')) {
                                                    list11.push(el.id)
                                                } else {
                                                    list11 = list11.filter((x) => x !== el.id)
                                                }
                                            }
                                        })
                                    }
                                })
                            });
                        }

                        str11 = ""
                        list11.forEach(ele => {
                            str11 += "," + ele
                        })
                        str11 = str11.slice(1)

                        $("#channel-list").val(str11);
                    })
                })

                //开启复选框
                tree11.render({
                    elem: '#gather-channel-list'
                    , data: data11
                    , showCheckbox: true
                });
            }
        })
    }

    function appTree() {
        // class - app：应用多选
        $("#app-list").val('')
        let data33 = [];

        $.ajax({
            type: "post",
            url: "/admin.app/getTree",
            data: {id: 0, tabName: 'course'},
            dataType: "json",
            success: function (res) {
                data33 = res.data;

                var _app = "";
                $(data33).each(function (index, val) {
                    _app += "<input type='checkbox' style='display: inline-block' onclick='sel(this)' value='" + val.id1 + "'> " + val.name + "<br>";
                    if (val.children.length > 0) {
                        $(val.children).each(function (ind, v) {
                            var cls = 'ind_' + val.id1;
                            _app += "&nbsp;&nbsp;&nbsp;&nbsp;<input type='checkbox' style='display: inline-block' class=" + cls + "  onclick='chk(this)' value='" + v.id1 + "'> " + v.name + "<br>";
                        });
                    }
                });

                $("#gather-app-list").html(_app)
            }
        })
    }

    // 类目
    function sel(obj)
    {
        var str11 = ""
        var appIds = $("#app-list").val();
        var list11 = appIds.length ? appIds.split(',') : [];
        var _this = $(obj);
        var id = _this.val();
        var cls = ".ind_" + id

        if (_this.is(':checked')) {
            $(cls).each(function (ind, val) {
                $(this).prop('checked', true)
                list11.push(val.value)
            })
        } else {
            $(cls).each(function (ind, val) {
                $(this).prop('checked', false)
                list11 = list11.filter((x) => x !== val.value)
            })
        }

        str11 = ""
        list11.forEach(ele => {
            str11 += "," + ele
        })
        str11 = str11.slice(1)

        $("#app-list").val(str11);
    }

    // 应用
    function chk(obj)
    {
        var str11 = ""
        var appIds = $("#app-list").val();
        var list11 = appIds.length ? appIds.split(',') : [];
        var _this = $(obj);

        if (_this.is(':checked')) {
            _this.prop('checked', true)
            list11.push(_this.val())
        } else {

            _this.prop('checked', false)
            list11 = list11.filter((x) => x !== _this.val())
        }

        str11 = ""
        list11.forEach(ele => {
            str11 += "," + ele
        })
        str11 = str11.slice(1)

        $("#app-list").val(str11);
    }

</script>
</body>
</html>
