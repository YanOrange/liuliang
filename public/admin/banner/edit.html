<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>编辑轮播图</title>
</head>
<body>
<script type="text/html" id="form">
    <input type="hidden" name="id" value="{{ d.id }}" />
    <div class="mainBox">
        <div class="main-container">
            <div class="main-container">
                <div class="layui-form-item">
                    <label class="layui-form-label">机构版本</label>
                    <div class="layui-input-block">
                        <input type="radio" name="is_many_organization" value="1" lay-filter="is_many_organization" title="单类目单机构" {{# if(d.is_many_organization===1){ }}checked="checked"{{# } }}>
                        <input type="radio" name="is_many_organization" value="2" lay-filter="is_many_organization" title="单类目多机构" {{# if(d.is_many_organization===2){ }}checked="checked"{{# } }}>
                        <input type="radio" name="is_many_organization" value="3" lay-filter="is_many_organization" title="多类目多机构" {{# if(d.is_many_organization===3){ }}checked="checked"{{# } }}>
                        <input type="radio" name="is_many_organization" value="4" lay-filter="is_many_organization" title="单机构2.0" {{# if(d.is_many_organization===4){ }}checked="checked"{{# } }}>
                        <input type="radio" name="is_many_organization" value="5" lay-filter="is_many_organization" title="单机构2.5" {{# if(d.is_many_organization===5){ }}checked="checked"{{# } }}>
                        <input type="radio" name="is_many_organization" value="6" lay-filter="is_many_organization" title="逾期版本1" {{# if(d.is_many_organization===6){ }}checked="checked"{{# } }}>
                        <input type="radio" name="is_many_organization" value="7" lay-filter="is_many_organization" title="逾期版本2" {{# if(d.is_many_organization===7){ }}checked="checked"{{# } }}>
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">商户</label>
                    <div class="layui-input-block">
                        <div class="xmSelect"
                             data-name="merchant_id"
                             data-sourceType="route"
                             data-source="/admin.common_api/getMerchantList"
                             data-radio="true"
                             data-textField="merchant_name"
                             data-valueField="id"
                             data-paging="true"
                             data-selected="{{=d.merchant_id}}"
                        ></div>
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">关联应用</label>
                    <div class="layui-input-block" id="app-list1">
                        <div id="gather-channel-list" class="demo-tree1"></div>
                        <input type="hidden" name="channel_ids" id="channel-list"/>
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label"><text title="必填项" style="color:red;">*</text>标题</label>
                    <div class="layui-input-block">
                        <input type="text" name="title"  value="{{ d.title }}" lay-verify="required" autocomplete="off" placeholder="请输入渠道名称" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label"><text title="必填项" style="color:red;">*</text>背景图</label>
                    <div class="layui-input-block">
                        <div class="laytpUpload"
                             data-name="image"
                             data-accept="image"
                             data-uploaded="{{ d.image }}"
                             data-uploadedId="{{ d.image }}"
                             data-type="ali-oss-url"
                        ></div>
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label"><text title="必填项" style="color:red;">*</text>排序</label>
                    <div class="layui-input-block">
                        <input type="number" name="sort"  lay-verify="number" autocomplete="off" placeholder="请输入排序" class="layui-input" value="{{ d.sort }}">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">跳转方式</label>
                    <div class="layui-input-block">
                        <input type="radio" name="jump_mode" value="0" lay-filter="jump_mode" title="不跳转" {{# if(d.jump_mode===0){ }}checked="checked"{{# } }}>
                        <input type="radio" name="jump_mode" value="1" lay-filter="jump_mode" title="站内跳转" {{# if(d.jump_mode===1){ }}checked="checked"{{# } }}>
<!--                        <input type="radio" name="jump_mode" value="2" lay-filter="jump_mode" title="站外跳转" {{# if(d.jump_mode===2){ }}checked="checked"{{# } }}>-->
                    </div>
                </div>

                <div class="layui-form-item">
                    <div class="layui-input-block">
                        <div id="jump_mode_0" {{# if(d.jump_mode!==0){ }}style="display:none;"{{# } }}>
                            <input type="text" value="点击banner后，没有跳转效果" disabled class="layui-input">
                        </div>
                        <div id="jump_mode_1" {{# if(d.jump_mode!==1){ }}style="display:none;"{{# } }}>
                            <div class="xmSelect"
                                 data-name="module_id"
                                 data-sourceType="route"
                                 data-source="/admin.app_module/index"
                                 data-radio="true"
                                 data-textField="module_name"
                                 data-valueField="id"
                                 data-paging="true"
                                 data-selected="{{=d.module_id}}"
                                 data-onChange="xmcb"
                                 style="width:48%;float:left;"></div>
                            <div id="course-list" class="xmSelect"
                                 data-name="course_id_1"
                                 data-sourceType="route"
                                 data-source="/admin.course/index"
                                 data-radio="true"
                                 data-textField="merchant_course_title"
                                 data-valueField="id"
                                 data-paging="true"
                                 data-selected="{{=d.course_id}}"
                                 {{# if(d.module_id ==0 || d.module_id ==1 || d.module_id ==3 || d.module_id ==4 || d.module_id ==5){ }}style="width:48%;float:left;"{{# }else{ }}style="width:48%;float:left;display:none;"{{# } }}></div>
                            <div id="article-list" class="xmSelect"
                                 data-name="article_id"
                                 data-sourceType="route"
                                 data-source="/admin.article/articleList"
                                 data-radio="true"
                                 data-textField="title"
                                 data-valueField="id"
                                 data-paging="true"
                                 data-selected="{{=d.course_id}}"
                                 {{# if(d.module_id ==2){ }}style="width:48%;float:left;"{{# }else{ }}style="width:48%;float:left;display:none;"{{# } }}></div>
                            <div id="single-course-list" class="xmSelect"
                                 data-name="course_id_2"
                                 data-sourceType="route"
                                 data-source="/admin.single.course/courseList"
                                 data-radio="true"
                                 data-textField="title"
                                 data-valueField="id"
                                 data-paging="true"
                                 data-selected="{{=d.course_id}}"
                                 {{# if(d.module_id ==6){ }}style="width:48%;float:left;"{{# }else{ }}style="width:48%;float:left;display:none;"{{# } }}></div>
                            <div id="single-resource-list" class="xmSelect"
                                 data-name="resource_id"
                                 data-sourceType="route"
                                 data-source="/admin.single.resource/resourceList"
                                 data-radio="true"
                                 data-textField="title"
                                 data-valueField="id"
                                 data-paging="true"
                                 data-selected="{{=d.course_id}}"
                                 {{# if(d.module_id ==7){ }}style="width:48%;float:left;"{{# }else{ }}style="width:48%;float:left;display:none;"{{# } }}></div>
                        </div>
                        <div id="jump_mode_2" {{# if(d.jump_mode!==2){ }}style="display: none;"{{# } }}>
                            <input type="text" name="jump_url" autocomplete="off" placeholder="请输入跳转链接" class="layui-input" value="{{ d.jump_url }}">
                        </div>
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">状态</label>
                    <div class="layui-input-block">
                        <input type="radio" name="status" value="1" title="开启" {{# if(d.status===1){ }}checked="checked"{{# } }} />
                        <input type="radio" name="status" value="0" title="关闭" {{# if(d.status===0){ }}checked="checked"{{# } }} />

                    </div>
                </div>

            </div>
        </div>
    </div>
    <div class="bottom">
        <div class="button-container">
            <button type="submit" class="laytp-btn laytp-btn-primary laytp-btn-sm" lay-submit="" lay-filter="laytp-form">
                <i class="layui-icon layui-icon-ok"></i>
                提交
            </button>
            <button type="reset" class="laytp-btn laytp-btn-sm">
                <i class="layui-icon layui-icon-refresh"></i>
                重置
            </button>
        </div>
    </div>
</script>
<form class="layui-form" lay-filter="layui-form"></form>
<script>
    if(localStorage.getItem("staticDomain")){
        document.write("<link rel='stylesheet' href='" + localStorage.getItem("staticDomain") + "/component/layui/css/layui.css?v=" + localStorage.getItem("version") + "'>");
        document.write("<script src='" + localStorage.getItem("staticDomain") + "/component/layui/layui.js?v="+localStorage.getItem("version")+"'><\/script>");
        document.write("<script src='" + localStorage.getItem("staticDomain") + "/component/laytp/layuiConfig.js?v="+localStorage.getItem("version")+"'><\/script>");
    }else{
        document.write("<link rel='stylesheet' href='/static/component/layui/css/layui.css?v=" + localStorage.getItem("version") + "'>");
        document.write("<script src='/static/component/layui/layui.js?v="+localStorage.getItem("version")+"'><\/script>");
        document.write("<script src='/static/component/laytp/layuiConfig.js?v="+localStorage.getItem("version")+"'><\/script>");
    }
</script>
<script>
    layui.use(['form', 'layer', 'jquery'], function () {
        $ = layui.jquery;
        var layer = layui.layer,
            form = layui.form;
        //监听多选框点击事件  主要是通过 lay-filter="sex"  来监听
        form.on('radio(is_many_organization)', function (data) {
            //console.log( data );　　//打印当前选择的信息
            var value = data.value;   //  当前选中的value值
            if (value == 3) {
                $("#advertising-app").show();
            } else {
                $("#advertising-app").hide();
            }
        });

        form.on('radio(jump_mode)', function (data) {
            var value = data.value;   //  当前选中的value值
            console.log(value);
            if (value == 0) {
                $("#jump_mode_0").show();
                $("#jump_mode_1").hide();
                $("#jump_mode_2").hide();
            }
            if (value == 1) {
                $("#jump_mode_0").hide();
                $("#jump_mode_1").show();
                $("#jump_mode_2").hide();
            }
            if(value == 2){
                $("#jump_mode_0").hide();
                $("#jump_mode_1").hide();
                $("#jump_mode_2").show();
            }

        });

        window.xmcb = function(params) {
            var moduleId;
            var arr = params.arr
            for (var a in arr) {
                moduleId = arr[a]['id']
            }
            if (moduleId == 2) {
                $("#article-list").show();
                $("#course-list").hide();
                $("#single-course-list").hide();
                $("#single-resource-list").hide();
            }
            if (moduleId == 1 || moduleId == 3 || moduleId == 4 || moduleId == 5) {
                $("#article-list").hide();
                $("#course-list").show();
                $("#single-course-list").hide();
                $("#single_resource-list").hide();
            }
            if (moduleId == 6) {
                $("#article-list").hide();
                $("#course-list").hide();
                $("#single-course-list").show();
                $("#single-resource-list").hide();
            }
            if (moduleId == 7) {
                $("#article-list").hide();
                $("#course-list").hide();
                $("#single-course-list").hide();
                $("#single-resource-list").show();
            }
        }
    });

    layui.use(['laytp'],function(){
        let form = layui.form;
        let $ = layui.jquery;
        //获取参数ID
        var id = facade.getUrlParam('id');
        if(!id){
            facade.error('参数ID不能为空');
            return false;
        }

        //获取数据，渲染到对应的节点上
        facade.ajax({
            route: "/admin.banner/info",
            data: {id: id},
            successAlert: false,
            showLoading: true
        }).done(function(res){
            if(res.code === 0){
                layui.laytpl($("#form").html()).render(res.data,function(string){
                    $("form").html(string);
                    layui.laytpForm.render();
                    form.render();
                    getTree()
                });
            }
        });

        form.on('submit(laytp-form)', function(data){
            facade.ajax({
                route:'/admin.banner/edit',
                data:data.field
            }).done(function(res){
                if(res.code === 0){
                    parent.layui.layer.close(parent.layui.layer.getFrameIndex(window.name));//关闭当前页
                    parent.layui.table.reload("laytp-table");
                }
            });
            return false;
        });
    })


    // class- channel
    function getTree()
    {
        $("#channel-list").val('')
        var id = facade.getUrlParam('id');
        let data11 = [];

        $.ajax({
            type: "post",
            url: "/admin.advertising/getChannelTree",
            data: {id: id, table: 'banner'},
            dataType: "json",
            success: function (res) {
                data11 = res.data;
                let tree11 = layui.tree
                    , layer = layui.layer
                    , util = layui.util
                    , list11 = []
                    , str11 = ""
                    , data22 = [];

                //基本演示
                tree11.render({
                    elem: '#gather-channel-list'
                    , data: data11
                    , showCheckbox: true            //是否显示复选框
                    , id: 'demoId22'
                    , isJump: true                  //是否允许点击节点时弹出新窗口跳转
                    , click: function (obj) {
                        var data11 = obj.data22;    //获取当前点击的节点数据
                        layer.msg('状态：' + obj.state + '<br>节点数据：' + JSON.stringify(data));
                    }
                });

                //filter并非必须
                layui.use(['form'], function () {
                    let form11 = layui.form;
                    form11.on('checkbox', function (data) {
                        if (data.value.slice(data.value.length - 1) == "#") {   // 父级应用分类点击：全选
                            data11.forEach(element => {
                                if (data.value == element.id) {
                                    element.children.forEach(ele => {
                                        if ($(this).is(':checked')) {
                                            list11.push(ele.id)
                                        } else {
                                            list11 = list11.filter((x) => x !== ele.id)
                                        }
                                    })
                                }
                            });
                        } else {

                            data11.forEach(element => {
                                element.children.forEach(ele => {
                                    if (data.value == ele.id) {             // 应用点击
                                        if ($(this).is(':checked')) {
                                            list11.push(ele.id)
                                        } else {
                                            list11 = list11.filter((x) => x !== ele.id)
                                        }
                                    } else {
                                        ele.children.forEach(el => {        // 渠道点击
                                            if (data.value == el.id) {
                                                if ($(this).is(':checked')) {
                                                    list11.push(el.id)
                                                } else {
                                                    list11 = list11.filter((x) => x !== el.id)
                                                }
                                            }
                                        })
                                    }
                                })
                            });
                        }

                        str11 = ""
                        list11.forEach(ele => {
                            str11 += "," + ele
                        })
                        str11 = str11.slice(1)

                        $("#channel-list").val(str11);
                    })
                })

                //开启复选框
                tree11.render({
                    elem: '#gather-channel-list'
                    , data: data11
                    , showCheckbox: true
                });
            }
        })
    }
</script>
</body>
</html>
