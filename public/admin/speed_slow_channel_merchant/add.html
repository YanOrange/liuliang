<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>添加</title>
</head>
<body>
<form class="layui-form" lay-filter="layui-form">
    <div class="mainBox">
        <div class="main-container">
            <div class="main-container">
                <div class="layui-form-item">
                    <label class="layui-form-label">商户</label>
                    <div class="layui-input-block">
                        <div class="xmSelect"
                             data-name="merchant_id"
                             data-sourceType="route"
                             data-source="/admin.common_api/getMerchantList"
                             data-radio="true"
                             data-textField="merchant_name"
                             data-valueField="id"
                             data-paging="true"
                        ></div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">渠道</label>
                    <div class="layui-input-block">
                        <div class="xmSelect"
                             data-name="channel_id"
                             data-sourceType="route"
                             data-source="/admin.common_api/getChannelList"
                             data-radio="true"
                             data-textField="channel_name"
                             data-valueField="id"
                             data-paging="true"
                             data-selected="{{d.id}}"
                        ></div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label"><text title="必填项" style="color:red;">*</text>加速周期数量</label>
                    <div class="layui-input-block">
                        <input type="number" name="channel_set_speed_feed_num"  lay-verify="number" autocomplete="off" placeholder="请输入加速周期数量" class="layui-input" value="0">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label"><text title="必填项" style="color:red;">*</text>减速周期数量</label>
                    <div class="layui-input-block">
                        <input type="number" name="channel_set_slow_num"  lay-verify="number" autocomplete="off" placeholder="请输入减速周期数量" class="layui-input" value="0">
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="bottom">
        <div class="button-container">
            <button type="submit" class="laytp-btn laytp-btn-primary laytp-btn-sm" lay-submit="" lay-filter="add">
                <i class="layui-icon layui-icon-ok"></i>
                提交
            </button>
            <button type="reset" class="laytp-btn laytp-btn-sm">
                <i class="layui-icon layui-icon-refresh"></i>
                重置
            </button>
        </div>
    </div>
</form>
<script type="text/javascript" src="/static/component/jquery_3.3.1.js"></script>
<script type="text/javascript">
</script>
<script>
    if(localStorage.getItem("staticDomain")){
        document.write("<link rel='stylesheet' href='" + localStorage.getItem("staticDomain") + "/component/layui/css/layui.css?v=" + localStorage.getItem("version") + "'>");
        document.write("<script src='" + localStorage.getItem("staticDomain") + "/component/layui/layui.js?v="+localStorage.getItem("version")+"'><\/script>");
        document.write("<script src='" + localStorage.getItem("staticDomain") + "/component/laytp/layuiConfig.js?v="+localStorage.getItem("version")+"'><\/script>");
    }else{
        document.write("<link rel='stylesheet' href='/static/component/layui/css/layui.css?v=" + localStorage.getItem("version") + "'>");
        document.write("<script src='/static/component/layui/layui.js?v="+localStorage.getItem("version")+"'><\/script>");
        document.write("<script src='/static/component/laytp/layuiConfig.js?v="+localStorage.getItem("version")+"'><\/script>");
    }

</script>
<script>

    layui.use(['laytp'],function(){
      /*  alert(facade)
        channelId = facade.getUrlParam('channel_id');
        alert(channelId);*/
        /*layui.laytpl($("#form").html()).render({id: channelId},function(string){
            $("form").html(string);
            layui.laytpForm.render();
        });*/
        layui.form.on('submit(add)', function(data){
            facade.ajax({
                route:'/admin.speed_slow_channel_merchant/add',
                data : data.field
            }).done(function(res){
                if(res.code === 0){
                    parent.layui.layer.close(parent.layui.layer.getFrameIndex(window.name));//关闭当前页
                    parent.layui.table.reload("laytp-table");
                }
            });
            return false;
        });
    })
</script>
</body>
</html>
