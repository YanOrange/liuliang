<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>添加应用分类</title>
</head>
<body>
<form class="layui-form" lay-filter="layui-form">
    <div class="mainBox">
        <div class="main-container">
            <div class="main-container">
                <div class="layui-form-item">
                    <label class="layui-form-label"><text title="必填项" style="color:red;">*</text>线索加价梯度(元)</label>
                    <div class="layui-input-block">
                        <input type="number" name="thread_raise_price_grads"  lay-verify="number" autocomplete="off" placeholder="请输入线索加价梯度(元)" class="layui-input" value="3">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label"><text title="必填项" style="color:red;">*</text>应用分类名称</label>
                    <div class="layui-input-block">
                        <input type="text" name="app_class_name"  autocomplete="off" placeholder="请输入应用分类名称" class="layui-input">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label"><text title="必填项" style="color:red;">*</text>关联小程序</label>
                    <div class="layui-input-block">
                        <div class="xmSelect"
                             data-name="wxmini_program_ids"
                             data-sourceType="route"
                             data-source="/admin.common_api/getWxMiniProgramList"
                             data-textField="wxmini_name"
                             data-valueField="id"
                             data-paging="true"
                             data-layVerify="required"
                        ></div>
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label"><text title="必填项" style="color:red;">*</text>微信授权提示文案</label>
                    <div class="layui-input-block">
                        <input type="text" name="wx_auth_desc"  autocomplete="off" placeholder="请输入微信授权提示文案" class="layui-input" value="点击授权,边学边赚钱!">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label"><text title="必填项" style="color:red;">*</text>预警数量(小于等于此数量自动发送企业微信机器人消息)</label>
                    <div class="layui-input-block">
                        <input type="number" name="warning_num" lay-verify="number" placeholder="预警数量(小于等于此数量自动发送企业微信机器人消息)" class="layui-input" value="">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">分配线索商户一对多</label>
                    <div class="layui-input-block" style="display: flex;">
                        <input type="number" name="assign_merchant_num" lay-verify="number" placeholder="分配线索商户数量" class="layui-input" value="3">
                    </div>
                </div>

            </div>
        </div>
    </div>
    <div class="bottom">
        <div class="button-container">
            <button type="submit" class="laytp-btn laytp-btn-primary laytp-btn-sm" lay-submit="" lay-filter="add">
                <i class="layui-icon layui-icon-ok"></i>
                提交
            </button>
            <button type="reset" class="laytp-btn laytp-btn-sm">
                <i class="layui-icon layui-icon-refresh"></i>
                重置
            </button>
        </div>
    </div>
</form>
<script>
    if(localStorage.getItem("staticDomain")){
        document.write("<link rel='stylesheet' href='" + localStorage.getItem("staticDomain") + "/component/layui/css/layui.css?v=" + localStorage.getItem("version") + "'>");
        document.write("<script src='" + localStorage.getItem("staticDomain") + "/component/layui/layui.js?v="+localStorage.getItem("version")+"'><\/script>");
        document.write("<script src='" + localStorage.getItem("staticDomain") + "/component/laytp/layuiConfig.js?v="+localStorage.getItem("version")+"'><\/script>");
    }else{
        document.write("<link rel='stylesheet' href='/static/component/layui/css/layui.css?v=" + localStorage.getItem("version") + "'>");
        document.write("<script src='/static/component/layui/layui.js?v="+localStorage.getItem("version")+"'><\/script>");
        document.write("<script src='/static/component/laytp/layuiConfig.js?v="+localStorage.getItem("version")+"'><\/script>");
    }
</script>
<script>
    layui.use(['laytp'],function(){
        layui.form.on('submit(add)', function(data){
            facade.ajax({
                route:'/admin.app_class/add',
                data : data.field
            }).done(function(res){
                if(res.code === 0){
                    parent.layui.layer.close(parent.layui.layer.getFrameIndex(window.name));//关闭当前页
                    parent.layui.table.reload("laytp-table");
                }
            });
            return false;
        });
    })
</script>
</body>
</html>
