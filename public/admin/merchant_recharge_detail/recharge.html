<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>充值</title>
</head>
<body>
<form class="layui-form" lay-filter="layui-form">
    <div class="mainBox">
        <div class="main-container">
            <div class="main-container">
                <div class="layui-form-item">
                    <label class="layui-form-label"><text title="必填项" style="color:red;">*</text>充值金额</label>
                    <div class="layui-input-block">
                        <input type="number" name="recharge_amount"  autocomplete="off" lay-verify="number" placeholder="请输入充值金额" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label"><text title="必填项" style="color:red;">*</text>请选择充值商户</label>
                    <div class="layui-input-block">
                        <div class="xmSelect"
                             data-name="merchant_id"
                             data-sourceType="route"
                             data-source="/admin.merchant/index"
                             data-radio="true"
                             data-textField="merchant_name"
                             data-valueField="id"
                             data-paging="true"
                        ></div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label"><text title="必填项" style="color:red;">*</text>请选择充值类型</label>
                    <div class="layui-input-block">
                        <select name="recharge_type"  lay-filter="ReportType" lay-verify="required">
                            <option value="0">请选择充值类型</option>
                            <option value="1">正常打款</option>
                            <option value="2">免测</option>
                            <option value="3">赠送</option>
                            <option value="4">补量</option>
                            <option value="5">技术充值</option>
                        </select>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">补量条数</label>
                    <div class="layui-input-block">
                        <input type="number" name="supplement_nums"  autocomplete="off" lay-verify="number"  class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">备注</label>
                    <div class="layui-input-block">
                        <input type="text" name="remark"  autocomplete="off"  class="layui-input">
                    </div>
                </div>

            </div>
        </div>
    </div>
    <div class="bottom">
        <div class="button-container">
            <button type="submit" class="laytp-btn laytp-btn-primary laytp-btn-sm" id="submitok" lay-submit="" lay-filter="recharge">
                <i class="layui-icon layui-icon-ok"></i>
                提交
            </button>
            <button type="reset" class="laytp-btn laytp-btn-sm">
                <i class="layui-icon layui-icon-refresh"></i>
                重置
            </button>
        </div>
    </div>
</form>
<script>
    if(localStorage.getItem("staticDomain")){
        document.write("<link rel='stylesheet' href='" + localStorage.getItem("staticDomain") + "/component/layui/css/layui.css?v=" + localStorage.getItem("version") + "'>");
        document.write("<script src='" + localStorage.getItem("staticDomain") + "/component/layui/layui.js?v="+localStorage.getItem("version")+"'><\/script>");
        document.write("<script src='" + localStorage.getItem("staticDomain") + "/component/laytp/layuiConfig.js?v="+localStorage.getItem("version")+"'><\/script>");
    }else{
        document.write("<link rel='stylesheet' href='/static/component/layui/css/layui.css?v=" + localStorage.getItem("version") + "'>");
        document.write("<script src='/static/component/layui/layui.js?v="+localStorage.getItem("version")+"'><\/script>");
        document.write("<script src='/static/component/laytp/layuiConfig.js?v="+localStorage.getItem("version")+"'><\/script>");
    }
</script>
<script>
    layui.use(['laytp'],function(){
        layui.form.on('submit(recharge)', function(data){
            $("#submitok").attr("disabled", true).addClass("layui-btn-disabled")
            isSubmit = true;
            facade.ajax({
                route:'/admin.merchant_recharge_detail/recharge',
                data : data.field
            }).done(function(res){
                if(res.code === 0){
                    parent.layui.layer.close(parent.layui.layer.getFrameIndex(window.name));//关闭当前页
                    parent.layui.table.reload("laytp-table");
                }
            });
            return false;
        });
    })
</script>
</body>
</html>
