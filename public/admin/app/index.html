<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>应用列表</title>
</head>
<body class="laytp-container">
<div class="layui-card" id="search-form" style="display:none;">
    <div class="layui-card-body">
        <form class="layui-form" lay-filter="layui-form">
            <div class="layui-form-item">
                <div class="layui-form-item layui-inline">
                    <label class="layui-form-label">应用名称</label>
                    <div class="layui-input-inline">
                        <input type="text" name="search_param[app_name][value]" class="layui-input" autocomplete="off" />
                        <input type="hidden" name="search_param[app_name][condition]" value="LIKE">
                    </div>
                </div>
                <div class="layui-form-item layui-inline">
                    <label class="layui-form-label">应用分类</label>
                    <div class="layui-input-inline">
                        <div class="xmSelect"
                             data-name="search_param[app_class_id][value]"
                             data-sourceType="route"
                             data-source="/admin.app_class/index"
                             data-radio="true"
                             data-textField="app_class_name"
                             data-valueField="id"
                             data-paging="true"
                             data-placeholder="请选择应用分类"
                        ></div>
                    </div>
                    <input type="hidden" name="search_param[app_class_id][condition]" value="=">
                </div>
                <div class="layui-form-item layui-inline">
                    <label class="layui-form-label">安卓包名</label>
                    <div class="layui-input-inline">
                        <input type="text" name="search_param[android_bundle_id][value]" class="layui-input" autocomplete="off" />
                        <input type="hidden" name="search_param[android_bundle_id][condition]" value="LIKE">
                    </div>
                </div>
                <div class="layui-form-item layui-inline">
                    <label class="layui-form-label">苹果包名</label>
                    <div class="layui-input-inline">
                        <input type="text" name="search_param[ios_bundle_id][value]" class="layui-input" autocomplete="off" />
                        <input type="hidden" name="search_param[ios_bundle_id][condition]" value="LIKE">
                    </div>
                </div>
                <div class="layui-form-item layui-inline">
                    <label class="layui-form-label">支付宝appid</label>
                    <div class="layui-input-inline">
                        <input type="text" name="search_param[alipay_app_id][value]" class="layui-input" autocomplete="off" />
                        <input type="hidden" name="search_param[alipay_app_id][condition]" value="=">
                    </div>
                </div>
                <div class="layui-form-item layui-inline">
                    <label class="layui-form-label">微信appid</label>
                    <div class="layui-input-inline">
                        <input type="text" name="search_param[wxpay_app_id][value]" class="layui-input" autocomplete="off" />
                        <input type="hidden" name="search_param[wxpay_app_id][condition]" value="=">
                    </div>
                </div>
                <div class="layui-form-item layui-inline">
                    <label class="layui-form-label">易盾业务id</label>
                    <div class="layui-input-inline">
                        <input type="text" name="search_param[yd_business_id][value]" class="layui-input" autocomplete="off" />
                        <input type="hidden" name="search_param[yd_business_id][condition]" value="=">
                    </div>
                </div>
                <div class="layui-form-item layui-inline">
                    <label class="layui-form-label" style="width: 200px;">启动app是否需要登录</label>
                    <div class="layui-input-inline">
                        <select name="search_param[is_login_show][value]" class="layui-select">
                            <option value="">全部</option>
                            <option value="0">关闭</option>
                            <option value="1">开启</option>
                        </select>
                        <input type="hidden" name="search_param[is_login_show][condition]" value="=">
                    </div>
                </div>
                <div class="layui-form-item layui-inline">
                    <label class="layui-form-label" style="width: 200px;">是否需要微信授权</label>
                    <div class="layui-input-inline">
                        <select name="search_param[is_wx_auth][value]" class="layui-select">
                            <option value="">全部</option>
                            <option value="1">是</option>
                            <option value="0">否</option>
                        </select>
                        <input type="hidden" name="search_param[is_wx_auth][condition]" value="=">
                    </div>
                </div>
                <div class="layui-form-item layui-inline">
                    <label class="layui-form-label" style="width: 200px;">是否开启落地页</label>
                    <div class="layui-input-inline">
                        <select name="search_param[is_landing_page][value]" class="layui-select">
                            <option value="">全部</option>
                            <option value="1">是</option>
                            <option value="0">否</option>
                        </select>
                        <input type="hidden" name="search_param[is_landing_page][condition]" value="=">
                    </div>
                </div>
                <div class="layui-form-item layui-inline">
                    <label class="layui-form-label" style="width: 200px;">机构版本</label>
                    <div class="layui-input-inline">
                        <select name="search_param[is_many_organization][value]" class="layui-select">
                            <option value="">全部</option>
                            <option value="1">单类目单机构</option>
                            <option value="2">单类目多机构</option>
                            <option value="3">多类目多机构</option>
                        </select>
                        <input type="hidden" name="search_param[is_many_organization][condition]" value="=">
                    </div>
                </div>
                <div class="layui-form-item layui-inline">
                    <label class="layui-form-label">创建时间</label>
                    <div class="layui-input-inline">
                        <input type="text" class="layui-input laydate"
                               id="create_time" name="search_param[create_time][value]"
                               data-type="datetime" data-isRange="true" placeholder="请选择创建时间" >
                        <input type="hidden" name="search_param[create_time][condition]" value="BETWEEN">
                    </div>
                </div>
                <div class="layui-form-item layui-inline">
                    <button class="laytp-btn laytp-btn-md laytp-btn-primary" lay-submit lay-filter="laytp-search-form">
                        <i class="layui-icon layui-icon-search"></i>
                        查询
                    </button>
                    <button type="reset" class="laytp-btn laytp-btn-md laytp-search-form-reset">
                        <i class="layui-icon layui-icon-refresh"></i>
                        重置
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>
<div class="layui-card">
    <div class="layui-card-body">
        <table id="laytp-table" lay-filter="laytp-table"></table>
    </div>
</div>

<script type="text/html" id="default-toolbar">
    <div class="dropdown-menu">
        <button class="laytp-btn laytp-btn-primary laytp-btn-md">
            <i class="layui-icon layui-icon-triangle-d"></i>
            批量操作
        </button>
        <ul class="dropdown-menu-nav layui-anim-upbit dropdown-bottom-left layui-anim">
            <div class="dropdown-anchor"></div>
            {{# if(facade.hasAuth("/admin.app/edit")){ }}
            <li><a lay-event="edit"><i class="layui-icon layui-icon-edit"></i>编辑</a></li>
            {{# } }}
            {{# if(facade.hasAuth("/admin.app/del")){ }}
            <li><a lay-event="del"><i class="layui-icon layui-icon-delete"></i>删除</a></li>
            {{# } }}
        </ul>
    </div>
    {{# if(facade.hasAuth("/admin.app/add")){ }}
    <button class="laytp-btn laytp-btn-danger laytp-btn-md" lay-event="add">
        <i class="layui-icon layui-icon-add-1"></i>
        新增
    </button>
    {{# } }}
    <button class="laytp-btn laytp-btn-warming laytp-btn-md" lay-event="search">
        <i class="layui-icon layui-icon-search"></i>
        搜索
    </button>
    {{# if(facade.hasAuth("/admin.app/recycle")){ }}
    <button class="laytp-btn laytp-btn-success laytp-btn-md" lay-event="recycle">
        <i class="layui-icon layui-icon-delete"></i>
        回收站
    </button>
    {{# } }}
</script>

<script type="text/html" id="default-bar">
    {{# if(facade.hasAuth("/admin.app/edit")){ }}
    <button class="laytp-btn laytp-btn-primary laytp-btn-xs" lay-event="edit"><i class="layui-icon layui-icon-edit"></i>编辑</button>
    {{# } }}
    {{# if(facade.hasAuth("/admin.app/del")){ }}
    <button class="laytp-btn laytp-btn-danger laytp-btn-xs" lay-event="del"><i class="layui-icon layui-icon-delete"></i>删除</button>
    {{# } }}
</script>

<script>
    if(localStorage.getItem("staticDomain")){
        document.write("<link rel='stylesheet' href='" + localStorage.getItem("staticDomain") + "/component/layui/css/layui.css?v=" + localStorage.getItem("version") + "'>");
        document.write("<script src='" + localStorage.getItem("staticDomain") + "/component/layui/layui.js?v="+localStorage.getItem("version")+"'><\/script>");
        document.write("<script src='" + localStorage.getItem("staticDomain") + "/component/laytp/layuiConfig.js?v="+localStorage.getItem("version")+"'><\/script>");
        document.write("<script src='" + localStorage.getItem("staticDomain") + "/admin/js/app.js?v="+localStorage.getItem("version")+"'><\/script>");
    }else{
        document.write("<link rel='stylesheet' href='/static/component/layui/css/layui.css?v=" + localStorage.getItem("version") + "'>");
        document.write("<script src='/static/component/layui/layui.js?v="+localStorage.getItem("version")+"'><\/script>");
        document.write("<script src='/static/component/laytp/layuiConfig.js?v="+localStorage.getItem("version")+"'><\/script>");
        document.write("<script src='/static/admin/js/app.js?v="+localStorage.getItem("version")+"'><\/script>");
    }
</script>
</body>
</html>
