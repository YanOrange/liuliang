<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>编辑渠道</title>
    <style>
        .img-src {
            display: inline-block;
            width: 100px;
            height: 140px;
            margin-top: 5px
        }

        .img-div {
            display: inline-block;
            margin-right: 30px;
            width: 100px;
            height: 180px;
        }
        .img-div .img-radio {
            display: inline-block !important;
            float: left;
            zoom: 1.5;
            margin-right: 1px;
            transform: scale(0.7);

        }
    </style>
</head>
<body>
<script type="text/html" id="form">
    <input type="hidden" name="id" value="{{ d.id }}" />
    <div class="mainBox">
        <div class="main-container">
            <div class="main-container">
                <div class="layui-form-item">
                    <label class="layui-form-label">来源</label>
                    <div class="layui-input-block">
                        <input type="radio" name="source" lay-filter="source" value="1" title="App渠道" {{# if(d.source===1){ }}checked="checked"{{# } }}>
                        <input type="radio" name="source" lay-filter="source" value="2" title="第三方渠道" {{# if(d.source===2){ }}checked="checked"{{# } }}>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label"><text title="必填项" style="color:red;">*</text>渠道名称</label>
                    <div class="layui-input-block">
                        <input type="text" name="channel_name"  value="{{ d.channel_name }}" lay-verify="required" autocomplete="off" placeholder="请输入渠道名称" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">渠道应用名称</label>
                    <div class="layui-input-block">
                        <input type="text" name="channel_app_name" value="{{ d.channel_app_name }}" autocomplete="off" placeholder="请输入渠道应用名称" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label"><text title="必填项" style="color:red;">*</text>负责人</label>
                    <div class="layui-input-block">
                        <div class="xmSelect"
                             data-name="admin_user_id"
                             data-sourceType="route"
                             data-source="/admin.user/index"
                             data-radio="true"
                             data-textField="nickname"
                             data-valueField="id"
                             data-paging="true"
                             data-layVerify="required"
                             data-selected="{{=d.admin_user_id}}"
                        ></div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">关联应用</label>
                    <div class="layui-input-block">
                        <div class="xmSelect"
                             data-name="app_id"
                             data-sourceType="route"
                             data-source="/admin.app/index"
                             data-radio="true"
                             data-textField="app_name"
                             data-valueField="id"
                             data-paging="true"
                             data-selected="{{=d.app_id}}"
                        ></div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">来源渠道</label>
                    <div class="layui-input-block">
                        <div class="xmSelect"
                             data-name="source_id"
                             data-sourceType="route"
                             data-source="/admin.source_channel/index"
                             data-radio="true"
                             data-textField="channel_name"
                             data-valueField="id"
                             data-paging="true"
                             data-selected="{{=d.source_id}}"
                        ></div>
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label"><text title="必填项" style="color:red;">*</text>投放方式</label>
                    <div class="layui-input-block">
                        <div class="xmSelect"
                             data-name="promotion_id"
                             data-sourceType="route"
                             data-source="/admin.channel/getPromotionMethod"
                             data-radio="true"
                             data-textField="name"
                             data-valueField="id"
                             data-paging="true"
                             data-layVerify="required"
                             data-selected="{{=d.promotion_id}}"
                        ></div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label"><text title="必填项" style="color:red;">*</text>投放平台</label>
                    <div class="layui-input-block">
                        <div class="xmSelect"
                             data-name="platform_id"
                             data-sourceType="route"
                             data-source="/admin.channel/getPromotionPlatform"
                             data-radio="true"
                             data-textField="name"
                             data-valueField="id"
                             data-paging="true"
                             data-layVerify="required"
                             data-selected="{{=d.platform_id}}"
                        ></div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label"><text title="必填项" style="color:red;">*</text>投放模式</label>
                    <div class="layui-input-block">
                        <div class="xmSelect"
                             data-name="delivery_mode_id"
                             data-sourceType="route"
                             data-source="/admin.delivery_mode/index"
                             data-sourceTree="true"
                             data-radio="true"
                             data-textField="name"
                             data-valueField="id"
                             data-layVerify="required"
                             data-selected="{{d.delivery_mode_id}}"
                        ></div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">新媒体账号</label>
                    <div class="layui-input-block">
                        <div class="xmSelect"
                             data-name="wx_official_id"
                             data-sourceType="route"
                             data-source="/admin.common_api/getNewMediaAccountList"
                             data-radio="true"
                             data-textField="account_name"
                             data-subTextField = "platform.platform_name"
                             data-valueField="id"
                             data-paging="true"
                             data-selected="{{=d.wx_official_id}}"
                        ></div>
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label"><text title="必填项" style="color:red;">*</text>用户信息按钮文案</label>
                    <div class="layui-input-block">
                        <input type="text" name="user_material_btn_desc" value="{{ d.user_material_btn_desc }}" lay-verify="required" autocomplete="off" placeholder="请输入按钮文案" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label"><text title="必填项" style="color:red;">*</text>微信授权按钮文案</label>
                    <div class="layui-input-block">
                        <input type="text" name="wx_btn_desc" value="{{ d.wx_btn_desc }}" lay-verify="required" autocomplete="off" placeholder="请输入微信授权按钮文案" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">启动app是否需要登录</label>
                    <div class="layui-input-block">
                        <input type="radio" name="is_login_show" value="1" title="开启" {{# if(d.is_login_show===1){ }}checked="checked"{{# } }} />
                        <input type="radio" name="is_login_show" value="0" title="关闭" {{# if(d.is_login_show===0){ }}checked="checked"{{# } }} />

                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">是否开启落地页</label>
                    <div class="layui-input-block">
                        <input type="radio" name="is_landing_page" value="1" title="开启" {{# if(d.is_landing_page===1){ }}checked="checked"{{# } }}>
                        <input type="radio" name="is_landing_page" value="0" title="关闭" {{# if(d.is_landing_page===0){ }}checked="checked"{{# } }}>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">是否需要微信授权</label>
                    <div class="layui-input-block">
                        <input type="radio" name="is_wx_auth" value="1" title="是" {{# if(d.is_wx_auth===1){ }}checked="checked"{{# } }}>
                        <input type="radio" name="is_wx_auth" value="0" title="否" {{# if(d.is_wx_auth===0){ }}checked="checked"{{# } }}>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">授权微信版本号</label>
                    <div class="layui-input-block">
                        <input type="text" name="auth_wx_version" value="{{=d.auth_wx_version}}" autocomplete="off" placeholder="请输入微信版本号" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">留资页位置</label>
                    <div class="layui-input-block">
                        <input type="radio" name="capital_page_position" value="1" title="登陆后" {{# if(d.capital_page_position===1){ }}checked="checked"{{# } }}>
                        <input type="radio" name="capital_page_position" value="2" title="落地页报名" {{# if(d.capital_page_position===2){ }}checked="checked"{{# } }}>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">未满十八岁是否可以报名</label>
                    <div class="layui-input-block">
                        <input type="radio" name="is_under_eighteen_apply" value="1" title="是" {{# if(d.is_under_eighteen_apply===1){ }}checked="checked"{{# } }}>
                        <input type="radio" name="is_under_eighteen_apply" value="0" title="否" {{# if(d.is_under_eighteen_apply===0){ }}checked="checked"{{# } }}>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">是否显示文章</label>
                    <div class="layui-input-block">
                        <input type="radio" name="is_article_show" value="1" title="是" {{# if(d.is_article_show===1){ }}checked="checked"{{# } }}>
                        <input type="radio" name="is_article_show" value="0" title="否" {{# if(d.is_article_show===0){ }}checked="checked"{{# } }}>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">关联收集信息</label>
                    <div class="layui-input-block">
                        <div id="gather-info-list-edit" class="demo-tree"></div>
                        <input type="hidden" name="gather_ids" value="{{=d.gather_ids}}" id="gather-list-edit"/>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label"><text title="必填项" style="color:red;">*</text>留资页文案</label>
                    <div class="layui-input-block">
                        <input type="text" name="retention_page_desc[]" value="{{=d.retention_page_desc[0]}}" lay-verify="required" autocomplete="off" placeholder="请输入留资页文案" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-input-block">
                        <input type="text" name="retention_page_desc[]" value="{{=d.retention_page_desc[1]}}" lay-verify="required" autocomplete="off" placeholder="请输入留资页文案" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">首页好课推荐标题</label>
                    <div class="layui-input-block">
                        <input type="text" name="show_course_title" value="{{=d.show_course_title}}"  autocomplete="off" class="layui-input" >
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">首页推荐阅读标题</label>
                    <div class="layui-input-block">
                        <input type="text" name="show_article_title" value="{{=d.show_article_title}}"  autocomplete="off"  class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label"><text title="必填项" style="color:red;">*</text>成本价</label>
                    <div class="layui-input-block">
                        <input type="number" name="cost_price" lay-verify="number" autocomplete="off" class="layui-input" value="{{=d.cost_price}}" lay-verify="required">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">启动图</label>
                    <div class="layui-input-block">
                        <div class="laytpUpload"
                             data-name="startup_page_image"
                             data-accept="image"
                             data-uploaded="{{ d.startup_page_image }}"
                             data-uploadedId="{{ d.startup_page_image }}"
                             data-type="ali-oss-url"
                        ></div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label"><text title="必填项" style="color:red;">*</text>登录首页文案</label>
                    <div class="layui-input-block">
                        <input type="text" name="app_home_desc[]" value="{{=d.app_home_desc[0]}}" lay-verify="required" autocomplete="off" placeholder="请输入登录首页文案" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-input-block">
                        <input type="text" name="app_home_desc[]" value="{{=d.app_home_desc[1]}}"  autocomplete="off" placeholder="请输入登录首页文案" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">逾期版本1首页主文案</label>
                    <div class="layui-input-block">
                        <input type="text" name="overdue_version_home_desc[]" value="{{=d.overdue_version_home_desc[0]}}" autocomplete="off" placeholder="请输入首页主文案" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">逾期版本1首页主副文案</label>
                    <div class="layui-input-block">
                        <input type="text" name="overdue_version_home_desc[]" value="{{=d.overdue_version_home_desc[1]}}" autocomplete="off" placeholder="请输入首页副文案" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">逾期版本2首页图片</label>
                    <div class="layui-input-block">
                        <div class="laytpUpload"
                             data-name="overdue_version_home_image1"
                             data-accept="image"
                             data-uploaded="{{ d.overdue_version_home_image[0] }}"
                             data-uploadedId="{{ d.overdue_version_home_image[0] }}"
                             data-type="ali-oss-url"
                        ></div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">逾期版本2首页图片</label>
                    <div class="layui-input-block">
                        <div class="laytpUpload"
                             data-name="overdue_version_home_image2"
                             data-accept="image"
                             data-uploaded="{{ d.overdue_version_home_image[1] }}"
                             data-uploadedId="{{ d.overdue_version_home_image[1] }}"
                             data-type="ali-oss-url"
                        ></div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">是否显示昵称</label>
                    <div class="layui-input-block">
                        <input type="radio" name="is_show_nickname" value="1" title="是" {{# if(d.is_show_nickname===1){ }}checked="checked"{{# } }}>
                        <input type="radio" name="is_show_nickname" value="0" title="否" {{# if(d.is_show_nickname===0){ }}checked="checked"{{# } }}>
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">是否跳转微信小程序</label>
                    <div class="layui-input-block">
                        <input type="radio" name="is_jump_miniprogram" value="1" title="是" {{# if(d.is_jump_miniprogram===1){ }}checked="checked"{{# } }}>
                        <input type="radio" name="is_jump_miniprogram" value="0" title="否" {{# if(d.is_jump_miniprogram===0){ }}checked="checked"{{# } }}>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">跳转微信小程序版本号</label>
                    <div class="layui-input-block">
                        <input type="text" name="jump_wechat_version" value="{{ d.jump_wechat_version }}" autocomplete="off" placeholder="跳转微信小程序版本号" class="layui-input">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">是否马甲包</label>
                    <div class="layui-input-block">
                        <input type="radio" name="is_vest_bag" value="1" title="是" {{# if(d.is_vest_bag===1){ }}checked="checked"{{# } }}>
                        <input type="radio" name="is_vest_bag" value="0" title="否" {{# if(d.is_vest_bag===0){ }}checked="checked"{{# } }}>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">马甲包版本号</label>
                    <div class="layui-input-block">
                        <input type="text" name="app_version" value="{{ d.app_version}}"  autocomplete="off" placeholder="请输入应用版本号" class="layui-input">
                        <text title="必填项" style="color:red;">多个版本号用“,”拼接，示例：1.0.1,1.0.2</text>
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">0元留资落地页二次确认页面</label>
                    <div class="layui-input-block">
                        <input type="radio" name="free_landing_page_affirm" value="1" title="开启" {{# if(d.free_landing_page_affirm===1){ }}checked="checked"{{# } }}>
                        <input type="radio" name="free_landing_page_affirm" value="0" title="关闭" {{# if(d.free_landing_page_affirm===0){ }}checked="checked"{{# } }}>
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">一分留资落地页二次确认页面</label>
                    <div class="layui-input-block">
                        <input type="radio" name="pay_landing_page_affirm" value="1" title="开启" {{# if(d.pay_landing_page_affirm===1){ }}checked="checked"{{# } }}>
                        <input type="radio" name="pay_landing_page_affirm" value="0" title="关闭" {{# if(d.pay_landing_page_affirm===0){ }}checked="checked"{{# } }}>
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">0元课程落地页二次确认页面</label>
                    <div class="layui-input-block">
                        <input type="radio" name="course_free_landing_page_affirm" value="1" title="开启" {{# if(d.course_free_landing_page_affirm===1){ }}checked="checked"{{# } }}>
                        <input type="radio" name="course_free_landing_page_affirm" value="0" title="关闭" {{# if(d.course_free_landing_page_affirm===0){ }}checked="checked"{{# } }}>
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">一分课程落地页二次确认页面</label>
                    <div class="layui-input-block">
                        <input type="radio" name="course_pay_landing_page_affirm" value="1" title="开启" {{# if(d.course_pay_landing_page_affirm===1){ }}checked="checked"{{# } }}>
                        <input type="radio" name="course_pay_landing_page_affirm" value="0" title="关闭" {{# if(d.course_pay_landing_page_affirm===0){ }}checked="checked"{{# } }}>
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">莓茶h5地址</label>
                    <div class="layui-input-block">
                        <input type="text" name="mc_h5_url"  autocomplete="off" placeholder="请输入莓茶h5地址" class="layui-input" value="{{ d.mc_h5_url }}">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">首页加微跳转在线客服</label>
                    <div class="layui-input-block">
                        <input type="radio" name="is_jump_online_service" value="1" title="是" {{# if(d.is_jump_online_service===1){ }}checked="checked"{{# } }}>
                        <input type="radio" name="is_jump_online_service" value="0" title="否" {{# if(d.is_jump_online_service===0){ }}checked="checked"{{# } }}>
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">应用页面展示类型</label>
                    <div class="layui-input-block">
                        <input type="radio" name="is_part_job_menu_show" value="1" title="兼职包页面" {{# if(d.is_part_job_menu_show===1){ }}checked="checked"{{# } }}>
                        <input type="radio" name="is_part_job_menu_show" value="0" title="垂直包页面" {{# if(d.is_part_job_menu_show===0){ }}checked="checked"{{# } }}>
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">是否展示培训模块</label>
                    <div class="layui-input-block">
                        <input type="radio" name="is_cultivate_menu_show" value="1" title="是" {{# if(d.is_cultivate_menu_show===1){ }}checked="checked"{{# } }}>
                        <input type="radio" name="is_cultivate_menu_show" value="0" title="否" {{# if(d.is_cultivate_menu_show===0){ }}checked="checked"{{# } }}>
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">是否展示个人信息声明</label>
                    <div class="layui-input-block">
                        <input type="radio" name="is_show_personal_statement" value="1" title="是" {{# if(d.is_show_personal_statement===1){ }}checked="checked"{{# } }}>
                        <input type="radio" name="is_show_personal_statement" value="0" title="否" {{# if(d.is_show_personal_statement===0){ }}checked="checked"{{# } }}>
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">兼职包版本号</label>
                    <div class="layui-input-block">
                        <input type="text" name="part_version" value="{{ d.part_version }}" autocomplete="off" placeholder="请输入兼职包版本号" class="layui-input">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">登录按钮文案</label>
                    <div class="layui-input-block">
                        <input type="text" name="app_login_btn_desc" value="{{ d.app_login_btn_desc }}" autocomplete="off" placeholder="请输入登录按钮文案" class="layui-input">
                    </div>
                </div>

                <div class="layui-form-item" id="app_login_btn_color">

            $("#path_ids").val();
        }

        //开启复选框
        tree.render({
            elem: '#gather-info-list-edit'
            , data: data_all
