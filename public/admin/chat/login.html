<html>
<head>
    <meta charset="utf-8">
    <title>登录中心</title>
    <link href="static/assets/index/chat/css/style.css" rel="stylesheet" type="text/css">
    <script src="static/assets/index/chat/js/jquery.js"></script>
    <script src="static/assets/index/chat/js/login.js"></script>
    <script src="static/assets/index/chat/js/superslide.2.1.js"></script>
    <script src="static/assets/index/chat/js/nicescroll.js"></script>
</head>

<body>
<div class="qq-exe"><img src="static/assets/index/chat/images/QQ-ICON.png"><input type="text" value="腾讯QQ" placeholder="腾讯QQ"></div>

<div class="win-bg"><img src="static/assets/index/chat/images/win-bg.png"></div>

<div class="qq-login">
    <div class="login-menu">
        <span></span><span></span><span class="login-close"></span>
    </div>
    <div class="login-ner">
        <div class="login-left">
            <div class="login-head"><img src="static/assets/index/chat/images/login/head.jpg"></div>
        </div>
        <div class="login-on">
            <div class="login-txt"><input type="text" name="username" placeholder="QQ号码/手机/邮箱"><input type="password" name="password" placeholder="密码"></div>
            <div class="login-xuan"><span class="fl"><input type="checkbox"><i>记住密码</i></span><span class="fr"><input type="checkbox"><i>自动登录</i></span></div>
            <input type="hidden" name="login_url" value="{:url('login')}">
            <input type="hidden" name="index_url" value="{:url('index')}">
<!--            登录并且注册，没有对账号进行限制-->
            <div class="login-but">安全登录</div>
        </div>
        <div class="login-right">
            <a href="http://zc.qq.com/chs/index.html" target="_blank">注册账号</a><a href="https://aq.qq.com/cn2/findpsw/pc/pc_find_pwd_input_account?pw_type=0&aquin=" target="_blank">找回密码</a>
        </div>
    </div>
</div>

</body>
</html>
