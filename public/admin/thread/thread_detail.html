<script>
    window.changeType = function (params) {
        getThreadLogList($('#thread_id').val(), params.arr[0].value)
    }

    function getThreadLogList(id, operation_type = 0, page = 1, pagesize = 10) {
        let data = {
            id: id,
            page: page,
            pagesize: pagesize
        };
        if (operation_type) {
            data.operation_type = operation_type;
        }
        //获取数据，渲染到对应的节点上
        facade.ajax({
            route: "/admin.thread.thread_log/getThreadLogList",
            data: data,
            successAlert: false,
            showLoading: true
        }).done(function (res) {
            if (res.code === 0) {
                let list = res.data.data;
                let thread_log = '';
                if (list.length > 0) {
                    for (let i = 0; i < list.length; i++) {
                        thread_log += '';
                        thread_log += '<ul>';
                        thread_log += '<li>';
                        thread_log += '<div class="operation_user">' + list[i].admin_username + '</div>';
                        thread_log += '<div class="operation_time">' + list[i].update_time + '</div>';
                        thread_log += '<div class="operation_type">' + list[i].operation_type_text + '</div>';
                        thread_log += '</li>';
                        thread_log += '<li>';
                        thread_log += '<div class="operation_content_title">操作内容：</div>';
                        thread_log += '<div class="operation_content">';
                        let operation_content = list[i].operation_content;
                        if (operation_content.length > 0) {
                            for (let j = 0; j < operation_content.length; j++) {
                                thread_log += operation_content[j] + '<br/>';
                            }
                        }
                        thread_log += '</div>';
                        thread_log += '</li>';
                        thread_log += '<li>';
                        thread_log += '<div class="operation_remark_title">' + list[i].operation_remark_text + '：</div>';
                        thread_log += '<div class="operation_remark">' + ((list[i].operation_remark === null) ? '-' : list[i].operation_remark) + '</div>';
                        thread_log += '</li>';
                        thread_log += '</ul>';
                    }
                }
                $('.thread_log').html(thread_log);

                var laypage = layui.laypage;
                //执行一个laypage实例
                laypage.render({
                    elem: 'operation_page' //注意，这里的 test1 是 ID，不用加 # 号
                    , count: res.data.total //数据总数，从服务端得到
                    , layout: ['count', 'prev', 'page', 'next']
                    , curr: res.data.current_page
                    , jump: function (obj, first) {
                        //obj包含了当前分页的所有参数，比如：
                        //首次不执行
                        if (!first) {
                            getThreadLogList(id, operation_type, obj.curr, obj.limit);
                        }
                    }
                });
            }
        });
    }

    function getThreadUserStatus(id) {
        let data = {
            id: id,
            source_id: $('#source_id').val()
        };
        //获取数据，渲染到对应的节点上
        facade.ajax({
            route: "/admin.thread.thread_user_status/getThreadUserStatus",
            data: data,
            successAlert: false,
            showLoading: true
        }).done(function (res) {
            if (res.code === 0) {
                let list = res.data;
                let thread_log = '';
                if (list.length > 0) {
                    for (let i = 0; i < list.length; i++) {
                        thread_log += '';
                        thread_log += '<div class="layui-col-xs12 layui-col-md12 user-status-info">';
                        thread_log += '<div class="layui-col-xs5  user-status-info-title">' + list[i].title + '：</div>';
                        let children = list[i].children;
                        if (children.length > 0) {
                            let select_text = ' - ';
                            for (let j = 0; j < children.length; j++) {
                                if (children[j]['is_select']) {
                                    select_text = children[j]['title'];
                                    break;
                                }
                            }
                            thread_log += '<div class="">' + select_text + '</div>';
                        } else {
                            thread_log += '<div class=""> - </div>';
                        }
                        thread_log += '</div>';
                    }
                }
                $('.user-status').html(thread_log);
            }
        });
    }

                let list = res.data;
                let thread_log = '';
                if (list.length > 0) {
                    for (let i = 0; i < list.length; i++) {
                        thread_log += '';
                        thread_log += '<div class="layui-col-xs12 layui-col-md12">';
                        thread_log += '<div class="layui-col-xs12 layui-col-md12 user-tags-title">' + list[i].title + '：</div>';
                        let children = list[i].children;
                        if (children.length > 0) {
                            thread_log += '<div class="layui-col-xs12 layui-col-md12 ">'
                            for (let j = 0; j < children.length; j++) {
                                if (children[j]['is_selected']) {
                                    thread_log += '<div class="layui-col-xs12 layui-col-md12 user-tags-text">' + children[j]['title'] + '</div>';
                                }
                            }
                            thread_log += '</div>';
                        } else {
                            thread_log += '<div class="layui-col-xs12 layui-col-md12 user-tags-text"> - </div>';
                        }
                        thread_log += '</div>';
                    }
                }
                $('.user-tags').html(thread_log);
            }
        });
    }


    layui.use(['laytp', 'laypage', 'element'], function () {
        let form = layui.form;
        let $ = layui.jquery;
        //获取参数ID
        var id = facade.getUrlParam('id');
        if (!id) {
            facade.error('参数ID不能为空');
            return false;
        }
        $('#thread_id').val(id);
        //获取数据，渲染到对应的节点上
        facade.ajax({
            route: "/admin.thread/getThreadUserInfo",
            data: {id: id},
            successAlert: false,
            showLoading: true
        }).done(function (res) {
            if (res.code === 0) {
                $('#avatar').attr('src', res.data.base_info.avatar);
                $('#nickname').html(res.data.base_info.nickname);
                $('#age_range_desc').html(res.data.base_info.age_range);
                $('#identity_desc').html(res.data.base_info.identity);
                $('#education_desc').html(res.data.base_info.education);
                $('#is_discern_qrcode').html(res.data.base_info.is_discern_qrcode);
                $('#source_title').html(res.data.base_info.source_title);
                $('#thraed_create_time').html(res.data.base_info.thread_create_time);
                $('#phone').html(res.data.base_info.phone);
                $('#wx_nickname').html(res.data.base_info.wx_nickname);
                $('#area').html(res.data.base_info.province + res.data.base_info.city);
                if (res.data.new_info != null) {
                    $('#new_nickname').html(res.data.new_info.nickname);
                    $('#new_age').html(res.data.new_info.age);
                    $('#new_phone').html(res.data.new_info.phone);
                    $('#new_education').html(res.data.new_info.education);
                    $('#new_identity').html(res.data.new_info.identity);
                    $('#new_area').html(res.data.new_info.province + res.data.new_info.city);
                }

                if (res.data.base_info.thread_status == 2) {
                    $('#giveup').hide()
                    $('#not_giveup').show()
                    $('#following_line').removeClass('status').addClass('active-line');
                    $('#transform').removeClass('layui-icon-circle').addClass('active').addClass('layui-icon-circle-dot');
                } else if (res.data.base_info.thread_status == 3) {
                    $('#giveup').hide()
                    $('#not_giveup').show()
                    $('#following_line').removeClass('status').addClass('active-line');
                    $('#transform').removeClass('layui-icon-circle').addClass('active').addClass('layui-icon-circle-dot');
                    $('#transform_line').removeClass('status').addClass('active-line');
                    $('#success').removeClass('layui-icon-circle').addClass('active').addClass('layui-icon-circle-dot');
                } else if (res.data.base_info.thread_status == 99) {
                    $('#giveup').show()
                    $('#not_giveup').hide()
                } else {
                    $('#giveup').hide()
                    $('#not_giveup').show()
                }
                $('#source_id').val(res.data.base_info.thread_source_id);
            }
        });

        getThreadLogList(id);
        getThreadUserStatus(id);
        getThreadTagList(id);

        let element = layui.element;
        element.on('tab', function (elem) {
            if (elem.index == 1) {
                getThreadTransactListening(id);
            } else if (elem.index == 2) {
                getThreadTransactApplyfee(id)
            } else {
                getThreadLogList(id);
            }
        });

    })
</script>
</body>
</html>
