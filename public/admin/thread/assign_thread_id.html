<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>分配线索</title>
</head>
<body class="laytp-container">
<div class="layui-card" id="search-form">
    <div class="layui-card-body">
        <form class="layui-form" lay-filter="layui-form">
            <div class="layui-form-item">

                <div class="layui-form-item layui-inline">
                    <label class="layui-form-label">应用分类</label>
                    <div class="layui-input-inline">
                        <div class="xmSelect"
                             data-name="app_class_id"
                             data-sourceType="route"
                             data-source="/admin.app_class/index"
                             data-radio="true"
                             data-textField="app_class_name"
                             data-valueField="id"
                             data-paging="true"
                             data-placeholder="请选择应用分类"
                        ></div>
                    </div>
                </div>

                <div class="layui-form-item layui-inline">
                    <label class="layui-form-label">线索类型</label>
                    <div class="layui-input-inline">
                        <select name="thread_type" class="layui-select">
                            <option value="">全部</option>
                            <option value="1">0元线索</option>
                            <option value="2">1分线索</option>
                        </select>
                    </div>
                </div>

                <div class="layui-form-item layui-inline">
                    <label class="layui-form-label">创建时间</label>
                    <div class="layui-input-inline">
                        <input type="text" class="layui-input laydate"
                               id="create_time" name="create_time"
                               data-type="datetime" data-isRange="true" placeholder="请选择创建时间" >
                    </div>
                </div>
                <div class="layui-form-item layui-inline">
                    <button class="laytp-btn laytp-btn-md laytp-btn-primary" lay-submit lay-filter="laytp-search-form">
                        <i class="layui-icon layui-icon-search"></i>
                        查询
                    </button>
                    <button type="reset" class="laytp-btn laytp-btn-md laytp-search-form-reset">
                        <i class="layui-icon layui-icon-refresh"></i>
                        重置
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>

<div class="layui-card">
    <div class="layui-card-body">
        <table id="laytp-table" lay-filter="laytp-table"></table>
    </div>
</div>

<form class="layui-form" lay-filter="layui-form">
    <div class="main-container" >


        <div class="layui-form-item layui-inline">
            <label class="layui-form-label">应用分类</label>
            <div class="layui-input-inline">
                <div class="xmSelect"
                     data-name="app_class_id"
                     data-sourceType="route"
                     data-source="/admin.app_class/index"
                     data-radio="true"
                     data-textField="app_class_name"
                     data-valueField="id"
                     data-paging="true"
                     data-placeholder="请选择应用分类"
                ></div>
            </div>
        </div>

        <div class="layui-form-item layui-inline">
            <label class="layui-form-label">线索类型</label>
            <div class="layui-input-inline">
                <select name="thread_type" class="layui-select">
                    <option value="">全部</option>
                    <option value="1">0元线索</option>
                    <option value="2">1分线索</option>
                </select>
            </div>
        </div>

        <div class="layui-form-item layui-inline">
            <label class="layui-form-label">创建时间</label>
            <div class="layui-input-inline">
                <input type="text" class="layui-input laydate"
                       id="create_time" name="create_time"
                       data-type="datetime" data-isRange="true" placeholder="请选择创建时间" >
            </div>
        </div>

            <div class="layui-form-item">
                <label class="layui-form-label">分配目标商户</label>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label"><text title="必填项" style="color:red;">*</text>商户</label>
                <div class="layui-input-block">
                    <div class="xmSelect"
                         data-name="target_merchant_id"
                         data-sourceType="route"
                         data-source="/admin.merchant/index"
                         data-radio="true"
                         data-textField="merchant_name"
                         data-valueField="id"
                         data-paging="true"
                         data-placeholder="商户"
                    ></div>
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label"><text title="必填项" style="color:red;">*</text>线索数量</label>
                <div class="layui-input-block">
                    <input type="number" name="num" placeholder="请输入线索数量" class="layui-input">
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">分配时间</label>
                <div class="layui-input-inline" style="width: 290px;">
                    <input type="text" class="layui-input laydate"
                           id="target_create_time" name="target_create_time"
                           data-type="datetime" data-isRange="true" placeholder="请选择创建时间" >
                </div>
            </div>

        </div>


<div class="bottom">
    <div class="button-container">
        <button type="submit" class="laytp-btn laytp-btn-primary laytp-btn-sm" lay-submit="assign" lay-filter="assign">
            <i class="layui-icon layui-icon-ok"></i>
            提交
        </button>
        <button type="reset" class="laytp-btn laytp-btn-sm">
            <i class="layui-icon layui-icon-refresh"></i>
            重置
        </button>
    </div>
</div>
</form>

<script>
    if(localStorage.getItem("staticDomain")){
        document.write("<link rel='stylesheet' href='" + localStorage.getItem("staticDomain") + "/component/layui/css/layui.css?v=" + localStorage.getItem("version") + "'>");
        document.write("<script src='" + localStorage.getItem("staticDomain") + "/component/layui/layui.js?v="+localStorage.getItem("version")+"'><\/script>");
        document.write("<script src='" + localStorage.getItem("staticDomain") + "/component/laytp/layuiConfig.js?v="+localStorage.getItem("version")+"'><\/script>");
        document.write("<script src='" + localStorage.getItem("staticDomain") + "/admin/js/assignThreadId.js?v="+localStorage.getItem("version")+"'><\/script>");
    }else{
        document.write("<link rel='stylesheet' href='/static/component/layui/css/layui.css?v=" + localStorage.getItem("version") + "'>");
        document.write("<script src='/static/component/layui/layui.js?v="+localStorage.getItem("version")+"'><\/script>");
        document.write("<script src='/static/component/laytp/layuiConfig.js?v="+localStorage.getItem("version")+"'><\/script>");
        document.write("<script src='/static/admin/js/assignThreadId.js?v="+localStorage.getItem("version")+"'><\/script>");
    }
</script>
<script>
    layui.use(['laytp'],function(){
        layui.form.on('submit(assign)', function(data){
            data = facade.setEditorField(data);
            facade.ajax({
                route:'/admin.thread/assignThreadId',
                data : data.field
            }).done(function(res){
                if(res.code === 0){
                    parent.layui.layer.msg(res.msg);
                    parent.layui.layer.close(parent.layui.layer.getFrameIndex(window.name));//关闭当前页
                    parent.layui.table.reload("laytp-table");
                }
            });
            return false;
        });
    })
</script>
</body>
