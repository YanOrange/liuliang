<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>补量设置</title>
</head>
<body>
<script type="text/html" id="form">
    <input type="hidden" name="id" value="{{ d.id }}" />
    <div class="mainBox">
        <div class="main-container">
            <div class="main-container">

                <div class="layui-form-item">
                    <label class="layui-form-label"><text title="必填项" style="color:red;">*</text>当日客服补量</label>
                    <div class="layui-input-block">
                        <input type="number" name="customer_supplement" value="{{ d.customer_supplement }}" autocomplete="off" placeholder="请输入客服补量" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label"><text title="必填项" style="color:red;">*</text>预设明日客服补量</label>
                    <div class="layui-input-block">
                        <input type="number" name="tomorrow_customer_supplement" value="{{ d.tomorrow_customer_supplement }}" autocomplete="off" placeholder="请输入预设明日客服补量" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label"><text title="必填项" style="color:red;">*</text>自然补量</label>
                    <div class="layui-input-block">
                        <input type="text" name="natural_supplement" value="{{ d.natural_supplement }}" autocomplete="off" placeholder="自然补量" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label"><text title="必填项" style="color:red;">*</text>当天注册补量</label>
                    <div class="layui-input-block">
                        <input type="text" name="register_supplement" value="{{ d.register_supplement }}" autocomplete="off" placeholder="自然补量" class="layui-input">
                    </div>
                </div>
                
                <div class="layui-form-item">
                    <label class="layui-form-label">客服表单分配数</label>
                    <div class="layui-input-block">
                        <input type="number" name="service_form_assign_nums" lay-verify="number" autocomplete="off" placeholder="客服表单分配数" class="layui-input" value="{{ d.service_form_assign_nums }}">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">客服表单加微率</label>
                    <div class="layui-input-block" style="display: flex;">
                        <input type="number" name="service_form_assign_rate" lay-verify="number" autocomplete="off" placeholder="客服表单分配率" class="layui-input" style="width:98%;" value="{{ d.service_form_assign_rate }}">
                        <span>%</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="bottom">
        <div class="button-container">
            <button type="submit" class="laytp-btn laytp-btn-primary laytp-btn-sm" lay-submit="" lay-filter="laytp-form">
                <i class="layui-icon layui-icon-ok"></i>
                提交
            </button>
            <button type="reset" class="laytp-btn laytp-btn-sm">
                <i class="layui-icon layui-icon-refresh"></i>
                重置
            </button>
        </div>
    </div>
</script>
<form class="layui-form" lay-filter="layui-form"></form>
<script>
    if(localStorage.getItem("staticDomain")){
        document.write("<link rel='stylesheet' href='" + localStorage.getItem("staticDomain") + "/component/layui/css/layui.css?v=" + localStorage.getItem("version") + "'>");
        document.write("<script src='" + localStorage.getItem("staticDomain") + "/component/layui/layui.js?v="+localStorage.getItem("version")+"'><\/script>");
        document.write("<script src='" + localStorage.getItem("staticDomain") + "/component/laytp/layuiConfig.js?v="+localStorage.getItem("version")+"'><\/script>");
    }else{
        document.write("<link rel='stylesheet' href='/static/component/layui/css/layui.css?v=" + localStorage.getItem("version") + "'>");
        document.write("<script src='/static/component/layui/layui.js?v="+localStorage.getItem("version")+"'><\/script>");
        document.write("<script src='/static/component/laytp/layuiConfig.js?v="+localStorage.getItem("version")+"'><\/script>");
    }
</script>
<script>
    layui.use(['laytp'],function(){
        let form = layui.form;
        let $ = layui.jquery;
        //获取参数ID
        var id = facade.getUrlParam('id');
        if(!id){
            facade.error('参数ID不能为空');
            return false;
        }

        //获取数据，渲染到对应的节点上
        facade.ajax({
            route: "/admin.merchant/info",
            data: {id: id},
            successAlert: false,
            showLoading: true
        }).done(function(res){
            if(res.code === 0){
                layui.laytpl($("#form").html()).render(res.data,function(string){
                    $("form").html(string);
                    layui.laytpForm.render();
                    form.render();
                });
            }
        });

        form.on('submit(laytp-form)', function(data){
            facade.ajax({
                route:'/admin.merchant/setSupplement',
                data:data.field
            }).done(function(res){
                if(res. code=== 0){
                    parent.layui.layer.close(parent.layui.layer.getFrameIndex(window.name));//关闭当前页
                    parent.layui.table.reload("laytp-table");
                }
            });
            return false;
        });
    })
</script>
</body>
</html>
