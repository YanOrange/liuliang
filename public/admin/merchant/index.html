<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>商户列表</title>
</head>
<body class="laytp-container">
<div class="layui-card" id="search-form" style="display:none;">
    <div class="layui-card-body">
        <form class="layui-form" lay-filter="layui-form">
            <div class="layui-form-item">
                <div class="layui-form-item layui-inline">
                    <label class="layui-form-label">ID</label>
                    <div class="layui-input-inline">
                        <input type="text" name="search_param[id][value]" class="layui-input" autocomplete="off" />
                        <input type="hidden" name="search_param[id][condition]" value="=">
                    </div>
                </div>
                <div class="layui-form-item layui-inline">
                    <label class="layui-form-label">登录账号</label>
                    <div class="layui-input-inline">
                        <input type="text" name="search_param[account_name][value]" class="layui-input" autocomplete="off" />
                        <input type="hidden" name="search_param[account_name][condition]" value="LIKE">
                    </div>
                </div>
                <div class="layui-form-item layui-inline">
                    <label class="layui-form-label">商户名称</label>
                    <div class="layui-input-inline">
                        <input type="text" name="search_param[merchant_name][value]" class="layui-input" autocomplete="off" />
                        <input type="hidden" name="search_param[merchant_name][condition]" value="LIKE">
                    </div>
                </div>
                <div class="layui-form-item layui-inline">
                    <label class="layui-form-label">类目</label>
                    <div class="layui-input-inline">
                        <div class="xmSelect"
                             data-name="search_param[app_class_id][value]"
                             data-sourceType="route"
                             data-source="/admin.app_class/index"
                             data-radio="true"
                             data-textField="app_class_name"
                             data-valueField="id"
                             data-paging="true"
                             data-placeholder="请选择类目"
                        ></div>
                    </div>
                    <input type="hidden" name="search_param[app_class_id][condition]" value="=">
                </div>
                <div class="layui-form-item layui-inline">
                    <label class="layui-form-label">商户来源</label>
                    <div class="layui-input-inline">
                        <select name="search_param[is_source][value]" class="layui-select">
                            <option value="">全部</option>
                            <option value="1">站内</option>
                            <option value="2">站外</option>
                        </select>
                        <input type="hidden" name="search_param[is_source][condition]" value="=">
                    </div>
                </div>
                <div class="layui-form-item layui-inline">
                    <label class="layui-form-label">进量状态</label>
                    <div class="layui-input-inline">
                        <select name="search_param[is_switch][value]" class="layui-select">
                            <option value="">全部</option>
                            <option value="0">关闭</option>
                            <option value="1">开启</option>
                        </select>
                        <input type="hidden" name="search_param[is_switch][condition]" value="=">
                    </div>
                </div>
                <div class="layui-form-item layui-inline">
                    <label class="layui-form-label">纯表单</label>
                    <div class="layui-input-inline">
                        <select name="search_param[is_form][value]" class="layui-select">
                            <option value="">全部</option>
                            <option value="1">是</option>
                            <option value="0">否</option>
                        </select>
                        <input type="hidden" name="search_param[is_form][condition]" value="=">
                    </div>
                </div>
                <div class="layui-form-item layui-inline">
                    <label class="layui-form-label">是否跳转小程序</label>
                    <div class="layui-input-inline">
                        <select name="search_param[is_jump_miniprogram][value]" class="layui-select">
                            <option value="">全部</option>
                            <option value="1">是</option>
                            <option value="0">否</option>
                        </select>
                        <input type="hidden" name="search_param[is_jump_miniprogram][condition]" value="=">
                    </div>
                </div>

                <div class="layui-form-item layui-inline">
                    <label class="layui-form-label">账号状态</label>
                    <div class="layui-input-inline">
                        <select name="search_param[status][value]" class="layui-select">
                            <option value="">全部</option>
                            <option value="0">禁用</option>
                            <option value="1">启用</option>
                        </select>
                        <input type="hidden" name="search_param[status][condition]" value="=">
                    </div>
                </div>
                <div class="layui-form-item layui-inline">
                    <label class="layui-form-label">创建时间</label>
                    <div class="layui-input-inline">
                        <input type="text" class="layui-input laydate"
                               id="create_time" name="search_param[create_time][value]"
                               data-type="datetime" data-isRange="true" placeholder="请选择创建时间">
                        <input type="hidden" name="search_param[create_time][condition]" value="BETWEEN">
                    </div>
                </div>
                <div class="layui-form-item layui-inline">
                    <button class="laytp-btn laytp-btn-md laytp-btn-primary" lay-submit lay-filter="laytp-search-form">
                        <i class="layui-icon layui-icon-search"></i>
                        查询
                    </button>
                    <button type="reset" class="laytp-btn laytp-btn-md laytp-search-form-reset">
                        <i class="layui-icon layui-icon-refresh"></i>
                        重置
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>
<div class="layui-card">
    <div class="layui-card-body">
        <table id="laytp-table" lay-filter="laytp-table"></table>
    </div>
</div>

<script type="text/html" id="default-toolbar">
    <div class="dropdown-menu">
        <button class="laytp-btn laytp-btn-primary laytp-btn-md">
            <i class="layui-icon layui-icon-triangle-d"></i>
            批量操作
        </button>
        <ul class="dropdown-menu-nav layui-anim-upbit dropdown-bottom-left layui-anim">
            <div class="dropdown-anchor"></div>
            {{# if(facade.hasAuth("/admin.merchant/edit")){ }}
            <li><a lay-event="edit"><i class="layui-icon layui-icon-edit"></i>编辑</a></li>
            {{# } }}
            {{# if(facade.hasAuth("/admin.merchant/del")){ }}
            <li><a lay-event="del"><i class="layui-icon layui-icon-delete"></i>删除</a></li>
            {{# } }}
        </ul>
    </div>
    {{# if(facade.hasAuth("/admin.merchant/add")){ }}
    <button class="laytp-btn laytp-btn-danger laytp-btn-md" lay-event="add">
        <i class="layui-icon layui-icon-add-1"></i>
        新增
    </button>
    {{# } }}
    <button class="laytp-btn laytp-btn-warming laytp-btn-md" lay-event="search">
        <i class="layui-icon layui-icon-search"></i>
        搜索
    </button>
    {{# if(facade.hasAuth("/admin.merchant/recycle")){ }}
    <button class="laytp-btn laytp-btn-success laytp-btn-md" lay-event="recycle">
        <i class="layui-icon layui-icon-delete"></i>
        回收站
    </button>
    {{# } }}
</script>

<script type="text/html" id="default-bar">
    {{# if(facade.hasAuth("/admin.customer/index")){ }}
    <button class="laytp-btn laytp-btn-primary laytp-btn-xs" lay-event="customer-list"><i class="layui-icon layui-icon-customer-list"></i>客服</button>
    {{# } }}
    {{# if(facade.hasAuth("/admin.merchant/setIsSwitchInput")){ }}
    <button class="laytp-btn laytp-btn-primary laytp-btn-xs" lay-event="setIsSwitchInput"><i class="layui-icon layui-icon-setIsSwitchInput"></i>进量</button>
    {{# } }}
    {{# if(facade.hasAuth("/admin.merchant/setSupplement")){ }}
    <button class="laytp-btn laytp-btn-primary laytp-btn-xs" lay-event="setSupplement"><i class="layui-icon layui-icon-setIsSwitchInput"></i>补量</button>
    {{# } }}
    {{# if(facade.hasAuth("/admin.merchant_thread_record/index")){ }}
    <button class="laytp-btn laytp-btn-primary laytp-btn-xs" lay-event="thread-list"><i class="layui-icon layui-icon-setIsSwitchInput"></i>线索</button>
    {{# } }}
    {{# if(facade.hasAuth("/admin.merchant/edit")){ }}
    <button class="laytp-btn laytp-btn-primary laytp-btn-xs" lay-event="edit"><i class="layui-icon layui-icon-edit"></i>编辑</button>
    {{# } }}
    {{# if(facade.hasAuth("/admin.merchant/del")){ }}
    <button class="laytp-btn laytp-btn-danger laytp-btn-xs" lay-event="del"><i class="layui-icon layui-icon-delete"></i>删除</button>
    {{# } }}
</script>

<script>
    if(localStorage.getItem("staticDomain")){
        document.write("<link rel='stylesheet' href='" + localStorage.getItem("staticDomain") + "/component/layui/css/layui.css?v=" + localStorage.getItem("version") + "'>");
        document.write("<script src='" + localStorage.getItem("staticDomain") + "/component/layui/layui.js?v="+localStorage.getItem("version")+"'><\/script>");
        document.write("<script src='" + localStorage.getItem("staticDomain") + "/component/laytp/layuiConfig.js?v="+localStorage.getItem("version")+"'><\/script>");
        document.write("<script src='" + localStorage.getItem("staticDomain") + "/admin/js/merchant.js?v="+localStorage.getItem("version")+"'><\/script>");
    }else{
        document.write("<link rel='stylesheet' href='/static/component/layui/css/layui.css?v=" + localStorage.getItem("version") + "'>");
        document.write("<script src='/static/component/layui/layui.js?v="+localStorage.getItem("version")+"'><\/script>");
        document.write("<script src='/static/component/laytp/layuiConfig.js?v="+localStorage.getItem("version")+"'><\/script>");
        document.write("<script src='/static/admin/js/merchant.js?v1="+localStorage.getItem("version")+"'><\/script>");
    }
</script>
</body>
</html>
