</script>

<script>
    layui.use(['form', 'layer', 'jquery'], function () {
        $ = layui.jquery;
        var layer = layui.layer,
            form = layui.form;
        //监听多选框点击事件  主要是通过 lay-filter="sex"  来监听
        form.on('radio(is_many_organization)', function (data) {
            //console.log( data );　　//打印当前选择的信息
            var value = data.value;   //  当前选中的value值
            if (value == 3) {
                $("#advertising-app").show();
            } else {
                $("#advertising-app").hide();
            }
        });

        form.on('radio(jump_mode)', function (data) {
            var value = data.value;   //  当前选中的value值
            if (value == 0) {
                $("#jump_mode_0").show();
                $("#jump_mode_1").hide();
                $("#jump_mode_2").hide();
            }
            if (value == 1) {
                $("#jump_mode_0").hide();
                $("#jump_mode_1").show();
                $("#jump_mode_2").hide();
            }
            if(value == 2){
                $("#jump_mode_0").hide();
                $("#jump_mode_1").hide();
                $("#jump_mode_2").show();
            }

        });

        window.xmcb = function(params) {
            var moduleId;
            var arr = params.arr
            for (var a in arr) {
                moduleId = arr[a]['id']
            }
            if (moduleId == 2) {
                $("#article-list").show();
                $("#course-list").hide();
            } else {
                $("#article-list").hide();
                $("#course-list").show();
            }
        }
    });

    // class - channel
    layui.use(['laytp', 'tree', 'util'], function () {
        $("#channel-list").val('')
        let data11 = [];

        //获取数据，渲染到对应的节点上
        $.ajax({
            type: "post",
            url: "/admin.advertising/getChannelTree",
            data: {id: 0, table: 'advertising'},
            dataType: "json",
            success: function (res) {
                data11 = res.data;
                let tree11 = layui.tree
                    , layer = layui.layer
                    , util = layui.util
                    , list11 = []
                    , str11 = ""
                    , data22 = [];

                //基本演示
                tree11.render({
                    elem: '#gather-channel-list'
                    , data: data11
                    , showCheckbox: true            //是否显示复选框
                    , id: 'demoId22'
                    , isJump: true                  //是否允许点击节点时弹出新窗口跳转
                    , click: function (obj) {
                        var data11 = obj.data22;    //获取当前点击的节点数据
                        layer.msg('状态：' + obj.state + '<br>节点数据：' + JSON.stringify(data));
                    }
                });

                //filter并非必须
                layui.use(['form'], function () {
                    let form11 = layui.form;
                    form11.on('checkbox', function (data) {
                        if (data.value.slice(data.value.length - 1) == "#") {   // 父级应用分类点击：全选
                            data11.forEach(element => {
                                if (data.value == element.id) {
                                    element.children.forEach(ele => {
                                        if ($(this).is(':checked')) {
                                            list11.push(ele.id)
                                        } else {
                                            list11 = list11.filter((x) => x !== ele.id)
                                        }
                                    })
                                }
                            });
                        } else {

                            data11.forEach(element => {
                                element.children.forEach(ele => {
                                    if (data.value == ele.id) {             // 应用点击
                                        if ($(this).is(':checked')) {
                                            list11.push(ele.id)
                                        } else {
                                            list11 = list11.filter((x) => x !== ele.id)
                                        }
                                    } else {
                                        ele.children.forEach(el => {        // 渠道点击
                                            if (data.value == el.id) {
                                                if ($(this).is(':checked')) {
                                                    list11.push(el.id)
                                                } else {
                                                    list11 = list11.filter((x) => x !== el.id)
                                                }
                                            }
                                        })
                                    }
                                })
                            });
                        }

                        str11 = ""
                        list11.forEach(ele => {
                            str11 += "," + ele
                        })
                        str11 = str11.slice(1)

                        $("#channel-list").val(str11);
                    })
                })

                //开启复选框
                tree11.render({
                    elem: '#gather-channel-list'
                    , data: data11
                    , showCheckbox: true
                });
            }
        })
    });


    layui.use(['laytp'],function(){
        layui.form.on('submit(add)', function(data){
            facade.ajax({
                route:'/admin.advertising/add',
                data : data.field
            }).done(function(res){
                if(res.code === 0){
                    parent.layui.layer.close(parent.layui.layer.getFrameIndex(window.name));//关闭当前页
                    parent.layui.table.reload("laytp-table");
                }
            });
            return false;
        });
    })
</script>
