<!DOCTYPE html>
<html>
<style>
    .ant-modal-content {
        position: relative;
        background-color: #fff;
        background-clip: padding-box;
        border: 0;
        border-radius: 0;
        box-shadow: 0 4px 12px rgb(0 0 0 / 15%);
        pointer-events: auto;
    }

    .ant-modal-close {
        position: absolute;
        top: 0;
        right: 0;
        z-index: 10;
        padding: 0;
        color: rgba(0,0,0,.45);
        font-weight: 700;
        line-height: 1;
        text-decoration: none;
        background: transparent;
        border: 0;
        outline: 0;
        cursor: pointer;
        transition: color .3s;
    }

    .ant-modal-close-x {
        display: block;
        width: 56px;
        height: 56px;
        font-size: 14px;
        font-style: normal;
        line-height: 56px;
        text-align: center;
        text-transform: none;
        text-rendering: auto;
    }

    .ant-modal-header {
        padding: 16px 24px;
        color: rgba(0,0,0,.65);
        background: #fff;
        border-bottom: 1px solid #e8e8e8;
        border-radius: 0 0 0 0;
    }

    .ant-modal-body {
        padding: 24px;
        font-size: 12px;
        line-height: 1.5;
        word-wrap: break-word;
    }

    .manage-import-modal .import-content .login-form-item .left {
        display: inline-block;
        width: 30%;
        padding-right: 10px;
        text-align: right;
    }

    .download {
        color: #2153d4;
        cursor: pointer;
    }

    .ant-upload.ant-upload-drag {
        position: relative;
        width: 100%;
        height: 100%;
        text-align: center;
        background: #fafafa;
        border: 1px dashed #d9d9d9;
        border-radius: 0;
        cursor: pointer;
        transition: border-color .3s;
    }

    .ant-upload {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        color: rgba(0,0,0,.65);
        font-size: 12px;
        font-variant: tabular-nums;
        line-height: 1.5;
        list-style: none;
        font-feature-settings: "tnum";
        outline: 0;
    }

    .ant-modal-footer {
        padding: 10px 16px;
        text-align: center;
        background: transparent;
        border-top: 1px solid #e8e8e8;
        border-radius: 0 0 0 0;
    }
</style>
<head>
    <meta charset="utf-8">
    <title>应用分类列表</title>
</head>
<body class="laytp-container">
<div class="layui-card" id="search-form" style="display:none;">
    <div class="layui-card-body">
        <form class="layui-form" lay-filter="layui-form">
            <div class="layui-form-item">
                <div class="layui-form-item layui-inline">
                    <label class="layui-form-label">应用分类名称</label>
                    <div class="layui-input-inline">
                        <input type="text" name="search_param[channel][value]" class="layui-input" autocomplete="off" />
                        <input type="hidden" name="search_param[channel][condition]" value="LIKE">
                    </div>
                </div>
                <div class="layui-form-item layui-inline">
                    <label class="layui-form-label">创建时间</label>
                    <div class="layui-input-inline">
                        <input type="text" class="layui-input laydate"
                               id="create_time" name="search_param[create_time][value]"
                               data-type="datetime" data-isRange="true" placeholder="请选择创建时间" >
                        <input type="hidden" name="search_param[create_time][condition]" value="BETWEEN">
                    </div>
                </div>
                <div class="layui-form-item layui-inline">
                    <button class="laytp-btn laytp-btn-md laytp-btn-primary" lay-submit lay-filter="laytp-search-form">
                        <i class="layui-icon layui-icon-search"></i>
                        查询
                    </button>
                    <button type="reset" class="laytp-btn laytp-btn-md laytp-search-form-reset">
                        <i class="layui-icon layui-icon-refresh"></i>
                        重置
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>
<div class="layui-card">
    <div class="layui-card-body">
        <table id="laytp-table" lay-filter="laytp-table"></table>

</div>

<script>
    layui.use(["form","layer", "upload","jquery"], function() {
        $ = layui.jquery;
        var form = layui.form;
        // 选择渠道获取类目
        var upload = layui.upload;
        upload.render({
            elem: '#uploadExcel'
            ,url: '/admin.PlanConsumeCheck/upload'
            ,size: '800'
            ,accept: "file"
            ,exts: 'xls|xlsx'
            ,before: function () {
                console.log(1)
                layer.load();
            }
            ,done: function (result) {
                $("#tankuang").hide();
                console.log(2)
                if (result.code === 0) {
                    layer.msg(result.msg, {icon: 1, time: 25000}, function () {
                        var index = parent.layer.getFrameIndex(window.name);
                        parent.layer.close(index);
                        parent.$('.layui-laypage-btn').click();
                    });
                    parent.layui.table.reload("laytp-table");
                } else if (result.code === 1) {
                    layer.msg(result.msg, {icon: 5, time: 10000}, function () {
                        var index = parent.layer.getFrameIndex(window.name);
                        parent.layer.close(index);
                        parent.$('.layui-laypage-btn').click();
                    });
                }
                layer.closeAll('loading');
                console.log(3)
            }
            ,error: function(error) {
                console.log("error" + error)
            }
        });
    });

    function tankuang()
    {
        $("#tankuang").show();
    }

    function close1()
    {
        $("#tankuang").hide();
    }
</script>

                    </path>
                </svg>
            </i>
        </span>
    </button>
    <div class="ant-modal-header">
        <div class="ant-modal-title" id="rcDialogTitle0" data-spm-anchor-id="0.0.0.i16.65174666bJxUat">批量导入数据</div>
    </div>
    <div class="ant-modal-body" style="min-height: 200px; padding-bottom: 0px;">
        <div class="import-content" style="font-size:14px;">
            <div class="login-form-item" data-spm-anchor-id="0.0.0.i36.65174666bJxUat">
                <label class="left name" data-spm-anchor-id="0.0.0.i30.65174666bJxUat">上传文件要求：</label>
                <div>
                    <div data-spm-anchor-id="0.0.0.i31.65174666bJxUat">1. 表头不能为空，不能存在合并的单元格</div>
                    <!--<div data-spm-anchor-id="0.0.0.i32.65174666bJxUat">2. 请使用chrome浏览器上传文件</div>-->

        </div>
    </div>
    <div class="ant-modal-footer">
        <button onClick="close1()" type="button" style="width:60px;height:30px;float: left;" class="ant-btn">
            <span>取 消</span>
        </button>
        <button type="button" class="ant-btn" style="width:60px;height:30px;" id="uploadExcel">
            <span>导入</span>
        </button>
    </div>
</div>
