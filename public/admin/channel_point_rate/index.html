<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>渠道列表</title>
</head>
<style>
    .ant-modal-content {
        position: relative;
        background-color: #fff;
        background-clip: padding-box;
        border: 0;
        border-radius: 0;
        box-shadow: 0 4px 12px rgb(0 0 0 / 15%);
        pointer-events: auto;
    }

    .ant-modal-close {
        position: absolute;
        top: 0;
        right: 0;
        z-index: 10;
        padding: 0;
        color: rgba(0,0,0,.45);
        font-weight: 700;
        line-height: 1;
        text-decoration: none;
        background: transparent;
        border: 0;
        outline: 0;
        cursor: pointer;
        transition: color .3s;
    }

    .ant-modal-close-x {
        display: block;
        width: 56px;
        height: 56px;
        font-size: 14px;
        font-style: normal;
        line-height: 56px;
        text-align: center;
        text-transform: none;
        text-rendering: auto;
    }

    .ant-modal-header {
        padding: 16px 24px;
        color: rgba(0,0,0,.65);
        background: #fff;
        border-bottom: 1px solid #e8e8e8;
        border-radius: 0 0 0 0;
    }

    .ant-modal-body {
        padding: 24px;
        font-size: 12px;
        line-height: 1.5;
        word-wrap: break-word;
    }

    .manage-import-modal .import-content .login-form-item .left {
        display: inline-block;
        width: 30%;
        padding-right: 10px;
        text-align: right;
    }

    .download {
        color: #2153d4;
        cursor: pointer;
    }

    .ant-upload.ant-upload-drag {
        position: relative;
        width: 100%;
        height: 100%;
        text-align: center;
        background: #fafafa;
        border: 1px dashed #d9d9d9;
        border-radius: 0;
        cursor: pointer;
        transition: border-color .3s;
    }

    .ant-upload {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        color: rgba(0,0,0,.65);
        font-size: 12px;
        font-variant: tabular-nums;
        line-height: 1.5;
        list-style: none;
        font-feature-settings: "tnum";
        outline: 0;
    }

    .ant-modal-footer {
        padding: 10px 16px;
        text-align: center;
        background: transparent;
        border-top: 1px solid #e8e8e8;
        border-radius: 0 0 0 0;
    }
</style>
<body class="laytp-container">
<div class="layui-card" id="search-form" style="display:none;">
    <div class="layui-card-body">
        <form class="layui-form" lay-filter="layui-form">
            <div class="layui-form-item">
                <div class="layui-form-item layui-inline">
                    <label class="layui-form-label">日期</label>
                    <div class="layui-input-inline">
                        <input type="text" class="layui-input laydate"
                               id="point_date" name="search_param[point_date]"
                               data-type="date" data-isRange="true" placeholder="请选择日期" >
                    </div>
                </div>

                <div class="layui-form-item layui-inline">
                    <label class="layui-form-label">应用分类</label>
                    <div class="layui-input-inline">
                        <div class="xmSelect"
                             data-name="search_param[app_class_id]"
                             data-sourceType="route"
                             data-source="/admin.app_class/index"
                             data-radio="true"
                             data-textField="app_class_name"
                             data-valueField="id"
                             data-paging="true"
                             data-placeholder="请选择应用分类"
                        ></div>
                    </div>
                </div>

                <div class="layui-form-item layui-inline">
                    <label class="layui-form-label">渠道名称</label>
                    <div class="layui-input-inline">
                        <div class="xmSelect"
                             data-name="search_param[channel_id]"
                             data-sourceType="route"
                             data-source="/admin.common_api/getChannelList"
                             data-radio="true"
                             data-textField="channel_name"
                             data-valueField="id"
                             data-paging="true"
                             data-placeholder="请选择渠道"
                        ></div>
                    </div>
                </div>

                <div class="layui-form-item layui-inline">
                    <label class="layui-form-label">提交人</label>
                    <div class="layui-input-inline">
                        <div class="xmSelect"
                             data-name="search_param[admin_id]"
                             data-sourceType="route"
                             data-source="/admin.channel_point_rate/adminNameList"
                             data-radio="true"
                             data-textField="nickname"
                             data-valueField="id"
                             data-paging="true"
                             data-placeholder="请选择提交人"
                        ></div>
                    </div>
                </div>

                <div class="layui-form-item layui-inline">
                    <label class="layui-form-label">创建时间</label>
                    <div class="layui-input-inline">
                        <input type="text" class="layui-input laydate"
                               id="create_time" name="search_param[create_time]"
                               data-type="datetime" data-isRange="true" placeholder="请选择创建时间" >
                    </div>
                </div>
                <div class="layui-form-item layui-inline">
                    <label class="layui-form-label">&nbsp;</label>
                    <button class="laytp-btn laytp-btn-md laytp-btn-primary" lay-submit lay-filter="laytp-search-form">
                        <i class="layui-icon layui-icon-search"></i>
                        查询
                    </button>
                    <button type="reset" class="laytp-btn laytp-btn-md laytp-search-form-reset">
                        <i class="layui-icon layui-icon-refresh"></i>
                        重置
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>
<div class="layui-card">
    <div class="layui-card-body">
        <table id="laytp-table" lay-filter="laytp-table"></table>
    </div>
</div>

<script type="text/html" id="default-toolbar">
    <div class="dropdown-menu">
        <button class="laytp-btn laytp-btn-primary laytp-btn-md">
            <i class="layui-icon layui-icon-triangle-d"></i>
            批量操作
        </button>
        <ul class="dropdown-menu-nav layui-anim-upbit dropdown-bottom-left layui-anim">
            <div class="dropdown-anchor"></div>
            {{# if(facade.hasAuth("/admin.channel_point_rate/editAll")){ }}
            <li><a lay-event="edit-all-channel"><i class="layui-icon layui-icon-edit"></i>批量更新渠道</a></li>
            <li><a lay-event="edit-all-point"><i class="layui-icon layui-icon-edit"></i>批量更新返点</a></li>
            {{# } }}
            {{# if(facade.hasAuth("/admin.channel_point_rate/del")){ }}
            <li><a lay-event="del"><i class="layui-icon layui-icon-delete"></i>删除</a></li>
            {{# } }}
        </ul>
    </div>
    {{# if(facade.hasAuth("/admin.channel_point_rate/add")){ }}
    <button class="laytp-btn laytp-btn-danger laytp-btn-md" lay-event="add">
        <i class="layui-icon layui-icon-add-1"></i>
        新增
    </button>
    {{# } }}
    <button class="laytp-btn laytp-btn-warming laytp-btn-md" lay-event="search">
        <i class="layui-icon layui-icon-search"></i>
        搜索
    </button>
    <button onClick="tankuang()" id="uploadExcelBtn" class="laytp-btn laytp-btn-normal laytp-btn-md">
        <i class="layui-icon layui-icon-upload-drag"></i>
        批量导入
    </button>
</script>

<script type="text/html" id="default-bar">
    {{# if(facade.hasAuth("/admin.channel_point_rate/edit")){ }}
    <button class="laytp-btn laytp-btn-primary laytp-btn-xs" lay-event="edit"><i class="layui-icon layui-icon-edit"></i>编辑</button>
    {{# } }}
    {{# if(facade.hasAuth("/admin.channel_point_rate/del")){ }}
    <button class="laytp-btn laytp-btn-danger laytp-btn-xs" lay-event="del"><i class="layui-icon layui-icon-delete"></i>删除</button>
    {{# } }}
</script>

<script>
    if(localStorage.getItem("staticDomain")){
        document.write("<link rel='stylesheet' href='" + localStorage.getItem("staticDomain") + "/component/layui/css/layui.css?v=" + localStorage.getItem("version") + "'>");
        document.write("<script src='" + localStorage.getItem("staticDomain") + "/component/layui/layui.js?v="+localStorage.getItem("version")+"'><\/script>");
        document.write("<script src='" + localStorage.getItem("staticDomain") + "/component/laytp/layuiConfig.js?v="+localStorage.getItem("version")+"'><\/script>");
        document.write("<script src='" + localStorage.getItem("staticDomain") + "/admin/js/channelPointRate.js?v="+localStorage.getItem("version")+"'><\/script>");
    }else{
        document.write("<link rel='stylesheet' href='/static/component/layui/css/layui.css?v=" + localStorage.getItem("version") + "'>");
        document.write("<script src='/static/component/layui/layui.js?v="+localStorage.getItem("version")+"'><\/script>");
        document.write("<script src='/static/component/laytp/layuiConfig.js?v="+localStorage.getItem("version")+"'><\/script>");
        document.write("<script src='/static/admin/js/channelPointRate.js?v="+localStorage.getItem("version")+"'><\/script>");
    }
</script>

<script>
    layui.use(["layer", "upload"], function() {
        var upload = layui.upload;
        upload.render({
            elem: '#uploadExcel'
            ,url: '/admin.channel_point_rate/upload'
            ,size: '800'
            ,accept: "file"
            ,exts: 'xls|xlsx'
            ,before: function () {
                console.log(1)
                layer.load();
            }
            ,done: function (result) {
                $("#tankuang").hide();
                console.log(2)
                if (result.code === 0) {
                    layer.msg(result.msg, {icon: 1, time: 25000}, function () {
                        var index = parent.layer.getFrameIndex(window.name);
                        parent.layer.close(index);
                        parent.$('.layui-laypage-btn').click();
                    });
                } else if (result.code === 1) {
                    layer.msg(result.msg, {icon: 5, time: 10000}, function () {
                        var index = parent.layer.getFrameIndex(window.name);
                        parent.layer.close(index);
                        parent.$('.layui-laypage-btn').click();
                    });
                }
                layer.closeAll('loading');
                console.log(3)
            }
            ,error: function(error) {
                console.log("error" + error)
            }
        });
    });

    function tankuang()
    {
        $("#tankuang").show();
    }

    function close1()
    {
        $("#tankuang").hide();
    }
</script>

        <button type="button" class="ant-btn" style="width:60px;height:30px;" id="uploadExcel">

</body>
</html>
