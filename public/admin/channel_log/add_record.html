<html>

<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
    <script src="https://unpkg.com/vue@next"></script>
    <!-- import CSS -->
    <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">
    <!-- import JavaScript -->
    <script src="https://unpkg.com/element-plus"></script>
    <title>Element Plus demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #eee;
        }

        #app {
            height: 100%;
            background-color: #fff;
            border: 1px solid #fff;
            font-size: 14px;
        }

        #app .pop {
            position: fixed;
            left: 0;
            top: 0;
            width: 100vw;
            height: 100vh;
            z-index: 100;
            background-color: rgba(0, 0, 0, 0.6);
        }

        #app .pop .content {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: #fff;
            overflow-y: auto;
        }

        #app .pop .content .select {
            width: 98%;
            height: 340px;
            margin: 40px auto;
            display: flex;
        }

        #app .pop .content .select .left {
            width: 200px;
            height: 340px;
        }

        #app .pop .content .select .right {
            flex: 1;
            margin-left: 20px;
            padding-left: 20px;
            height: 340px;
            background-color: #eee;
            position: relative;
        }

        #app .pop .content .select .right .delete {
            position: absolute;
            right: 10px;
            top: 10px;
            width: 30px;
            text-align: center;
            height: 30px;
            line-height: 30px;
            font-size: 30px;
            cursor: pointer;
        }

        #app .pop .content .select .right .title {
            width: 100%;
            height: 40px;
            margin-top: 20px;
        }

        #app .pop .content .select .right .text {
            width: 90%;
            height: 40px;
        }

        #app .pop .content .select .right .desc {
            width: 100%;
            height: 60px;
            color: #9A9A9A;
            cursor: pointer;
        }

        #app .pop .content .select .right .desc span {
            line-height: 60px;
        }

        #app .pop .content .select .right .desc .showimg {
            width: 60px;
            height: 60px;
            float: left;
            margin-right: 5px;
            position: relative;
        }

        #app .pop .content .select .right .desc .showimg img {
            width: 60px;
            height: 60px;
        }

        #app .pop .content .select .right .desc .showimg .delimg {
            position: absolute;
            top: 0;
            right: 0;
            width: 15px;
            text-align: center;
            height: 15px;
            line-height: 15px;
            font-size: 20px;
            color: red;
        }

        #app .pop .content .bottom {
            position: sticky;
            width: 100%;
            height: 180px;
            left: 0;
            bottom: 0;
            background-color: #fff;
            z-index: 100;
        }

        #app .pop .content .bottom .addvalue {
            width: 90%;
            height: 38px;
            margin: 0 auto;
            border: 1px solid #000;
            text-align: center;
            line-height: 38px;
            background-color: #fff;
            cursor: pointer;
        }

        #app .pop .content .bottom .timer {
            width: 90%;
            height: 40px;
            margin: 20px auto;
        }

        #app .pop .content .bottom .timer-title {
            line-height: 40px;
            display: inline;
        }

        #app .pop .content .bottom .timer-list {
            margin-left: 20px;
            display: inline;
        }

        #app .pop .content .bottom .channel {
            width: 90%;
            height: 40px;
            margin: 20px auto;
        }

        #app .pop .content .bottom .channel-title {
            line-height: 40px;
            display: inline;
        }

        #app .pop .content .bottom .channel-list {
            margin-left: 40px;
            display: inline;
        }

        #app .pop .content .bottom .btn {
            width: 90%;
            height: 40px;
            margin: 0 auto;
        }

        #app .pop .content .bottom .btn p:nth-child(1) {
            float: right;
            margin-left: 20px;
        }

        #app .pop .content .bottom .btn p:nth-child(2) {
            float: right;
        }

    </style>
</head>

<body>
<div id="app">
    <!-- 添加弹窗 -->
    <div class="pop" v-if="showAddWinStatus">
        <!-- 主体 -->
        <div class="content">
            <!-- 下拉主体 -->
            <div class="select" v-for="(m,n) in dataList" :key="n">
                <!-- 左边 -->
                <div class="left">
                    <el-select style="width: 100%" clearable="true" v-model="m.type" placeholder="请选择"
                               size="large">
                        <el-option v-for="item in m.selectList" :key="item.id" :label="item.name" :value="item.id"/>
                    </el-select>
                </div>

                <!-- 右边 -->
                <div class="right">
                    <p class="delete" @click="del(m)">
                        ×
                    </p>
                    <div class="title">当前内容</div>
                    <div class="text">
                        <el-input clearable="true" v-model="m.current_content" placeholder="请输入文字"/>
                    </div>
                    <div class="desc">
                        <!-- 删除图片 -->
                        <template v-for="(item,index) in m.current_img" ::key="index">
                                <span class="showimg">
                                    <img :src="item" alt="" @click="showImg(item)">
                                    <b @click="delCurrentImg(m,item,index)" class="delimg">
                                        ×
                                    </b>
                                </span>
                        </template>
                        <el-upload action="/admin.common/upload" :headers="tokens" name="laytpUploadFile"
                                   accept="image/*" :show-file-list="false" :file-list="productImgs"
                                   :multiple="isMultiple" :on-preview="handlePictureCardPreview"
                                   :on-remove="handleRemove"
                                   :on-success="handleAvatarSuccess" :before-upload="beforeAvatarUpload"
                                   :on-exceed="handleExceed" :on-error="imgUploadError">
                            <!-- 添加图片 -->
                            <span @click="addCurrentImg(m)">添加图片</span>
                        </el-upload>
                    </div>
                    <div class="title">之前内容</div>
                    <div class="text">
                        <el-input clearable="true" v-model="m.last_content" placeholder="请输入文字"/>
                    </div>
                    <div class="desc">
                        <!-- 删除图片 -->
                        <template v-for="(item,index) in m.last_img" ::key="index">
                                <span class="showimg">
                                    <img :src="item" alt="" @click="showImg(item)">
                                    <b @click="delLastImg(m,item,index)" class="delimg">
                                        ×
                                    </b>
                                </span>
                        </template>
                        <el-upload action="/admin.common/upload" :headers="tokens" name="laytpUploadFile"
                                   accept="image/*"  :show-file-list="false" :file-list="productImgs"
                                   :multiple="isMultiple" :on-preview="handlePictureCardPreview"
                                   :on-remove="handleRemove"
                                   :on-success="handleAvatarSuccess1" :before-upload="beforeAvatarUpload1"
                                   :on-exceed="handleExceed" :on-error="imgUploadError">
                            <!-- 添加图片 -->
                            <span @click="addLastImg(m)">添加图片</span>
                        </el-upload>
                    </div>
                </div>

            </div>

            <!-- 底部 -->
            <div class="bottom">
                <!-- 添加更新内容 -->
                <div class="channel">
                    <el-button @click="addOption()" type="primary">添加更新内容</el-button>
                </div>
                <!-- 选择时间 -->
                <div class="timer">
                    <div class="timer-title">选择更新时间 :</div>
                    <div class="timer-list">
                        <el-date-picker v-model="add_last_update_time" type="datetime"
                                        placeholder="请选择更新时间"/>
                    </div>
                </div>
                <!-- 按钮 -->
                <div class="btn">
                    <p>
                        <el-button @click="hideAddWin()" type="info">取消</el-button>
                    </p>
                    <p>
                        <el-button type="primary" @click="add()">确定</el-button>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    if (localStorage.getItem("staticDomain")) {
        //document.write("<link rel='stylesheet' href='" + localStorage.getItem("staticDomain") + "/component/layui/css/layui.css?v=" + localStorage.getItem("version") + "'>");
        document.write("<script src='" + localStorage.getItem("staticDomain") + "/component/jquery_3.3.1.js?v=" + localStorage.getItem("version") + "'><\/script>");
        document.write("<script src='" + localStorage.getItem("staticDomain") + "/component/layui/layui.js?v=" + localStorage.getItem("version") + "'><\/script>");
        document.write("<script src='" + localStorage.getItem("staticDomain") + "/component/laytp/layuiConfig.js?v=" + localStorage.getItem("version") + "'><\/script>");
    } else {
        //document.write("<link rel='stylesheet' href='/static/component/layui/css/layui.css?v=" + localStorage.getItem("version") + "'>");
        document.write("<script src='/static/component/jquery_3.3.1.js?v=" + localStorage.getItem("version") + "'><\/script>");
        document.write("<script src='/static/component/layui/layui.js?v=" + localStorage.getItem("version") + "'><\/script>");
        document.write("<script src='/static/component/laytp/layuiConfig.js?v=" + localStorage.getItem("version") + "'><\/script>");
    }


</script>
<script src="//unpkg.com/element-plus/dist/locale/zh-cn"></script>
<script>
    const App = {
            data() {
                return {
                    tokens: {
                        'LayTp-Admin-Token': ''
                    },
                    dataList: [],
                    addChannelId: '',
                    piclimit: 10,
                    //搜索
                    last_update_time: '',
                    updateType: [],
                    selectType: '',

                    //添加弹框
                    showAddWinStatus: 1,
                    add_last_update_time: '',
                };
            },
            methods: {
                // 添加新增
                addOption() {
                    this.newNum = this.dataList.length + 1
                    this.dataList.push(
                        {
                            id: this.newNum,
                            type: "",
                            current_content: "",
                            current_img: [],
                            last_content: "",
                            last_img: [],
                            selectList: this.updateType,
                        }
                    )
                },
                // 删除新增
                del(m) {
                    this.dataList.forEach((ele, index) => {
                        if (ele.id == m.id) {
                            this.dataList.splice(index, 1)
                        }
                    })
                },
                // 删除新增
                del1(m) {
                    this.editList.forEach((ele, index) => {
                        if (ele.id == m.id) {
                            this.editList.splice(index, 1)
                        }
                    })
                },
                // 添加图片
                addCurrentImg(m) {
                    this.m = m;
                },
                addLastImg(m) {
                    this.m = m;
                },
                // 添加图片后删除
                delCurrentImg(m, item, index) {
                    m.current_img.splice(index, 1)
                },
                delLastImg(m, item, index) {
                    m.last_img.splice(index, 1)
                },
                //图片上传成功
                handleAvatarSuccess(res, file) {
                    this.m.current_img.push(res.data.path)
                },
                handleAvatarSuccess1(res, file) {
                    this.m.last_img.push(res.data.path)
                },
                beforeAvatarUpload() {
                    if ((this.m.current_img.length + 1) > this.piclimit) {
                        this.$message.error('最多上传' + this.piclimit + '张图片');
                        return false;
                    }
                },
                beforeAvatarUpload1() {
                    if ((this.m.last_img.length + 1) > this.piclimit) {
                        this.$message.error('最多上传' + this.piclimit + '张图片');
                        return false;
                    }
                },
                add() {
                    let self = this;
                    if (!self.channel_id) {
                        self.$message.error('请选择关联的渠道');
                        return ;
                    }
                    let last_update_time;
                    if (this.add_last_update_time == '' || this.add_last_update_time == 'undefined') {
                        self.$message.error('请选择更新时间');
                        return ;
                    }
                    if (this.add_last_update_time) {
                        last_update_time = this.GMTToStr(this.add_last_update_time);
                    }
                    if (last_update_time == '' || last_update_time == 'undefined') {
                        self.$message.error('请选择更新时间');
                        return ;
                    }
                    let postDataList = self.dataList;
                    if(postDataList == null || postDataList == ''){
                        self.$message.error('请选择更新内容');
                        return;
                    }
                    let hasType = 1;
                    for (let i = 0; i <postDataList.length; i++) {
                        if(postDataList[i].type == '' || postDataList[i].type == null){
                            hasType = 0;
                            break;
                        }
                    }
                    if(!hasType){
                        self.$message.error('请选择更新类型');
                        return;
                    }
                    $.ajax({
                        url: "/admin.channel_log/add",
                        type: 'post',
                        data: {
                            channel_id: self.channel_id,
                            content: self.dataList,
                            last_update_time: last_update_time
                        },
                        success: function (res) {
                            if (res.code === 0) {
                                self.$message.success(res.msg);
                                self.showAddWinStatus = 0;
                                layui.use(['laytp'],function(){
                                    parent.layui.layer.close(parent.layui.layer.getFrameIndex(window.name));//关闭当前页
                                    parent.layui.table.reload("laytp-table");
                                });
                            } else {
                                self.$message.error(res.msg);
                            }
                        }
                    });
                },
                showImg(url) {
                    window.open(url);
                },
                handleSizeChange(val) {
                    this.pageSize = val;
                    this.getList();
                },
                handleCurrentChange(val) {
                    this.page = val;
                    this.getList();
                },
                resetForm() {
                    this.last_update_time = '';
                    this.search_last_update_time = '';
                    this.create_time = '';
                    this.search_create_time = '';
                    this.selectType = '';
                    this.getList();
                },
                getType() {
                    let self = this;
                    $.ajax({
                        url: "/admin.channel_log/getType",
                        type: 'post',
                        success: function (res) {
                            if (res.code === 0) {
                                self.updateType = res.data;
                            }
                        }
                    });
                },
                GMTToStr(time) {
                    let date = new Date(time)
                    let Str = date.getFullYear() + '-' +
                        (date.getMonth() + 1) + '-' +
                        date.getDate() + ' ' +
                        date.getHours() + ':' +
                        date.getMinutes() + ':' +
                        date.getSeconds();
                    return Str
                },
                getToken() {
                    let cookieArr = document.cookie.split('; ');
                    if (cookieArr != null) {
                        for (let i = 0; i < cookieArr.length; i++) {
                            var c = cookieArr[i];
                            while (c.charAt(0) == ' ') c = c.substring(1);
                            if (c.indexOf('laytpAdminToken') != -1) {
                                this.tokens = {
                                    'LayTp-Admin-Token': c.substring('laytpAdminToken'.length + 1, c.length)
                                };
                            }
                        }
                    }
                },
                getUrlParam(name) {
                    var reg = new RegExp("(^|&)" + name + "=([^&]*)(&|$)"); //构造一个含有目标参数的正则表达式对象
                    var r = window.location.search.substr(1).match(reg);  //匹配目标参数
                    if (r != null) return unescape(r[2]);
                    return null; //返回参数值
                }
            },
            mounted: function () {
                this.channel_id = this.getUrlParam('channel_id');
                this.getToken();
                this.getType();
            }
        }
    ;


    const app = Vue.createApp(App);
    app.use(ElementPlus, {
        locale: ElementPlusLocaleZhCn,
    });
    app.mount("#app");


</script>
</body>

</html>
