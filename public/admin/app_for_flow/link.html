<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>生成链接</title>
</head>
<body>
<script type="text/html" id="form">
    <input type="hidden" name="id" value="{{ d.id }}" />
    <div class="mainBox">
        <div class="main-container">
            <div class="main-container">
                <div class="layui-form-item">
                    <label class="layui-form-label"><text title="必填项" style="color:red;">*</text>生成链接</label>
                    <div class="layui-input-block">
                        <table class="layui-table"  lay-skin="line">
                            <thead>
                            <tr>
                                <th>渠道</th>
                                <th>链接</th>
                            </tr>
                            </thead>
                            <tbody >
                            {{# if(d.h5_link_json){ }}
                            {{# var key; for(key in d.h5_link_json){ }}
                            <tr>
                                <td style="padding: 4px 15px;"><input class="layui-input" type="text" name="h5_link_json[channel][]" value="{{=d.h5_link_json[key]['channel']}}" /></td>
                                <td style="padding: 4px 15px;"><input class="layui-input" type="text" name="h5_link_json[link][]" value="{{=d.h5_link_json[key]['link']}}" disabled/></td>
                                <td style="padding: 4px 15px;">
                                    <a href="javascript:void(0);" class="layui-btn layui-btn-primary layui-btn-sm layui-icon layui-icon-delete delArrayItem" layer-tips="删除" title="删除"></a>
                                </td>
                            </tr>
                            {{# } }}
                            {{# }else{ }}
                            <tr>
                                <td style="padding: 4px 15px;"><input class="layui-input" type="text" name="h5_link_json[channel][]"  value="" /></td>
                                <td style="padding: 4px 15px;"><input class="layui-input" type="text" name="h5_link_json[link][]"  value="{{ d.link }}?flow_id={{=d.id}}" disabled/></td>
                                <td style="padding: 4px 15px;">
                                    <a href="javascript:void(0);" class="layui-btn layui-btn-primary layui-btn-sm layui-icon layui-icon-delete delArrayItem" layer-tips="删除" title="删除"></a>
                                </td>
                            </tr>

                            {{# } }}
                            <tr class='nodrop nodrag'>
                                <td colspan="3" style="padding: 4px 15px;">
                                    <a href="javascript:void(0);" class="layui-btn layui-btn-primary layui-btn-sm layui-icon layui-icon-add-1 addArrayItem" title="追加">追加</a>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </div>
    </div>
    <div class="bottom">
        <div class="button-container">
            <button type="submit" class="laytp-btn laytp-btn-primary laytp-btn-sm" lay-submit="" lay-filter="laytp-form">
                <i class="layui-icon layui-icon-ok"></i>
                提交
            </button>
            <button type="reset" class="laytp-btn laytp-btn-sm">
                <i class="layui-icon layui-icon-refresh"></i>
                重置
            </button>
        </div>
    </div>
</script>
<form class="layui-form" lay-filter="layui-form"></form>
<script>
    if(localStorage.getItem("staticDomain")){
        document.write("<link rel='stylesheet' href='" + localStorage.getItem("staticDomain") + "/component/layui/css/layui.css?v=" + localStorage.getItem("version") + "'>");
        document.write("<script src='" + localStorage.getItem("staticDomain") + "/component/layui/layui.js?v="+localStorage.getItem("version")+"'><\/script>");
        document.write("<script src='" + localStorage.getItem("staticDomain") + "/component/laytp/layuiConfig.js?v="+localStorage.getItem("version")+"'><\/script>");
    }else{
        document.write("<link rel='stylesheet' href='/static/component/layui/css/layui.css?v=" + localStorage.getItem("version") + "'>");
        document.write("<script src='/static/component/layui/layui.js?v="+localStorage.getItem("version")+"'><\/script>");
        document.write("<script src='/static/component/laytp/layuiConfig.js?v="+localStorage.getItem("version")+"'><\/script>");
    }
</script>
<script>
    layui.use(['laytp'],function(){
        let form = layui.form;
        let $ = layui.jquery;
        //获取参数ID
        var id = facade.getUrlParam('id');
        if(!id){
            facade.error('参数ID不能为空');
            return false;
        }

        //获取数据，渲染到对应的节点上
        facade.ajax({
            route: "/admin.for_flow/info",
            data: {id: id},
            successAlert: false,
            showLoading: true
        }).done(function(res){
            if(res.code === 0){
                layui.laytpl($("#form").html()).render(res.data,function(string){
                    $("form").html(string);
                    layui.laytpForm.render();
                    form.render();
                });
            }
        });

        form.on('submit(laytp-form)', function(data){
            facade.ajax({
                route:'/admin.for_flow/editLink',
                data:data.field
            }).done(function(res){
                if(res.code === 0){
                    parent.layui.layer.close(parent.layui.layer.getFrameIndex(window.name));//关闭当前页
                    parent.layui.table.reload("laytp-table");
                }
            });
            return false;
        });
    })
</script>
</body>
</html>
