<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>编辑h5信息流</title>
</head>
<body>
<script type="text/html" id="form">
    <input type="hidden" name="id" value="{{ d.id }}"/>
    <div class="mainBox">
        <div class="main-container">
            <div class="main-container">
                <div class="layui-form-item">
                    <label class="layui-form-label">
                        <text title="必填项" style="color:red;">*</text>
                        投流名称</label>
                    <div class="layui-input-block">
                        <input type="text" name="for_flow_title" autocomplete="off" placeholder="请输入投流名称"
                               class="layui-input" lay-verify="required" value="{{ d.for_flow_title }}">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">
                        <text title="必填项" style="color:red;">*</text>
                        选择类目</label>
                    <div class="layui-input-block">
                        <div class="xmSelect"
                             data-name="app_class_id"
                             data-sourceType="route"
                             data-source="/admin.app_class/index"
                             data-textField="app_class_name"
                             data-valueField="id"
                             data-paging="true"
                             data-placeholder="选择类目"
                             data-layVerify="required"
                             data-radio="true"
                             data-onChange="changeAppClass"
                             data-selected="{{=d.app_class_id}}"
                        ></div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">
                        <text title="必填项" style="color:red;">*</text>
                        选择商户</label>
                    <div class="layui-input-inline">
                        <div id="merchant_ids"></div>
                    </div>
                    <div class="layui-form-mid layui-word-aux">选择商户时，需要选择一个内部商户</div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">
                        <text title="必填项" style="color:red;">*</text>
                        专题页名称</label>
                    <div class="layui-input-block">
                        <input type="text" name="show_page_title" autocomplete="off" placeholder="请输入专题页名称"
                               class="layui-input" lay-verify="required" value="{{ d.show_page_title }}">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label"><text title="必填项" style="color:red;">*</text>设置价格</label>
                    <div class="layui-input-inline">
                        <input type="number" name="price"  lay-verify="required|price" autocomplete="off" placeholder="请输入价格" class="layui-input" value="{{ d.price }}">
                    </div>
                    <div class="layui-form-mid layui-word-aux">默认为0元，0元代表“免费”</div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">
                        <text title="必填项" style="color:red;">*</text>
                        专题主图</label>
                    <div class="layui-input-block">
                        <div class="laytpUpload"
                             data-name="show_page_image"
                             data-accept="image"
                             data-type="ali-oss-url"
                             data-layVerify="required"
                             data-uploaded="{{ d.show_page_image }}"
                             data-uploadedId="{{ d.show_page_image }}"
                        ></div>
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">招呼语</label>
                    <div class="layui-input-block">
                        <input type="text" name="greeting" value="{{ d.greeting }}" autocomplete="off" placeholder="请输入招呼语" class="layui-input">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">报名数据设置</label>
                    <div class="layui-input-block">
                        <input type="radio" name="is_data" value="1" title="有数据报名" {{# if(d.is_data==1){
                               }}checked="is_data" {{# } }}>
                        <input type="radio" name="is_data" value="0" title="无数据报名" {{# if(d.is_data==0){
                               }}checked="checked" {{# } }}>
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">进入H5投流页直接跳转到小程序加微页面</label>
                    <div class="layui-input-block">
                        <input type="radio" name="is_no_data_jump_miniprogram" value="1" title="开启" {{# if(d.is_no_data_jump_miniprogram==1){
                               }}checked="checked" {{# } }}>
                        <input type="radio" name="is_no_data_jump_miniprogram" value="0" title="关闭" {{# if(d.is_no_data_jump_miniprogram==0){
                               }}checked="checked" {{# } }}>
                    </div>
                </div>


                <div class="layui-form-item">
                    <label class="layui-form-label">是否显示昵称</label>
                    <div class="layui-input-block">
                        <input type="radio" name="is_nickname" value="1" title="显示" {{# if(d.is_nickname==1){
                               }}checked="checked" {{# } }}>
                        <input type="radio" name="is_nickname" value="0" title="不显示" {{# if(d.is_nickname==0){
                               }}checked="checked" {{# } }}>
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">是否跳转微信小程序</label>
                    <div class="layui-input-block">
                        <input type="radio" name="is_jump_wx" value="1" title="是" {{# if(d.is_jump_wx==1){
                               }}checked="checked" {{# } }}>
                        <input type="radio" name="is_jump_wx" value="0" title="否" {{# if(d.is_jump_wx==0){
                               }}checked="checked" {{# } }}>
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label" style="width: 230px;">不跳转微信小程序报名成功提示图片</label>
                    <div class="layui-input-block">
                        <div class="laytpUpload"
                             data-name="not_jump_wx_image"
                             data-accept="image"
                             data-type="ali-oss-url"
                             data-uploaded="{{ d.not_jump_wx_image }}"
                             data-uploadedId="{{ d.not_jump_wx_image }}"
                        ></div>
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">同一浏览器报名间隔时间(单位/分)</label>
                    <div class="layui-input-block">
                        <input type="text" name="apply_interval_time" value="{{ d.apply_interval_time }}" autocomplete="off" placeholder="报名间隔时间" class="layui-input">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">H5使用场景</label>
                    <div class="layui-input-block">
                        <div class="xmSelect"
                             data-name="use_scene"
                             data-sourceType="route"
                             data-source="/admin.common_api/getNewMediaPlatformList"
                             data-textField="platform_name"
                             data-valueField="id"
                             data-paging="true"
                             data-placeholder="选择场景"
                             data-radio="true"
                             data-selected="{{=d.use_scene}}"
                        ></div>
                    </div>
                </div>

                <div class="layui-form-item" id="h5-gzh">
                    <label class="layui-form-label">微信公众号入口</label>
                    <div class="layui-input-block">
                        <input type="radio" name="wxgzh_enter" value="1" title="私信入口" {{# if(d.wxgzh_enter==1){ }}checked="checked" {{# } }}>
                        <input type="radio" name="wxgzh_enter" value="2" title="菜单栏" {{# if(d.wxgzh_enter==2){ }}checked="checked" {{# } }}>
                        <input type="radio" name="wxgzh_enter" value="3" title="阅读全文" {{# if(d.wxgzh_enter==3){ }}checked="checked" {{# } }}>
                        <input type="radio" name="wxgzh_enter" value="4" title="文章图片" {{# if(d.wxgzh_enter==4){ }}checked="checked" {{# } }}>
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">页面展示方式</label>
                    <div class="layui-input-block">
                        <input type="radio" name="page_type" value="1" lay-filter="page_type" title="图片类型" {{# if(d.page_type==1){
                               }}checked="checked" {{# } }}>
                        <input type="radio" name="page_type" value="2" lay-filter="page_type" title="文章类型" {{# if(d.page_type==2){
                               }}checked="checked" {{# } }}>
                        <input type="radio" name="page_type" value="3" lay-filter="page_type" title="其他类型" {{# if(d.page_type==3){
                               }}checked="checked" {{# } }}>
                        <input type="radio" name="page_type" value="4" lay-filter="page_type" title="新+v类型" {{# if(d.page_type==4){
                               }}checked="checked" {{# } }}>
                        <input type="radio" name="page_type" value="5" lay-filter="page_type" title="咨询类型" {{# if(d.page_type==5){
                               }}checked="checked" {{# } }}>
                        <input type="radio" name="page_type" value="6" lay-filter="page_type" title="(新)咨询类型" {{# if(d.page_type==6){
                               }}checked="checked" {{# } }}>
                        <input type="radio" name="page_type" value="7" lay-filter="page_type" title="(新含终止)咨询类型" {{# if(d.page_type==7){
                               }}checked="checked" {{# } }}>
                    </div>
                </div>
                <div class="layui-form-item" id="h5-article" {{# if(d.page_type==1){ }}style="display:none;"{{# } }}>
                    <label class="layui-form-label">文章内容</label>
                    <div class="layui-input-block">
                        <span style="color:red;">多段文章列表“@@@@@@@@”符号分割</span>
                        <iframe src="/admin/ueditor.html?id=ueditor" class="editor" data-type="ueditor" data-id="content" style="width:100%;height:530px;border: 0"></iframe>
                        <textarea class="editorContent" data-id="ueditor" style="display:none;">{{=d.content}}</textarea>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">文章中间按钮图</label>
                    <div class="layui-input-block">
                        <div class="laytpUpload"
                             data-name="article_center_btn_image"
                             data-accept="image"
                             data-type="ali-oss-url"
                             data-uploaded="{{ d.article_center_btn_image }}"
                             data-uploadedId="{{ d.article_center_btn_image }}"
                        ></div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">文章底部图</label>
                    <div class="layui-input-block">
                        <div class="laytpUpload"
                             data-name="h5_bottom_image"
                             data-accept="image"
                             data-type="ali-oss-url"
                             data-uploaded="{{ d.h5_bottom_image }}"
                             data-uploadedId="{{ d.h5_bottom_image }}"
                        ></div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">弹窗按钮名称</label>
                    <div class="layui-input-block">
                        <input type="text" name="popup_flow_btn" autocomplete="off" value="{{ d.popup_flow_btn }}" placeholder="弹窗按钮名称" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">弹窗标题名称</label>
                    <div class="layui-input-block">
                        <input type="text" name="popup_flow_title" autocomplete="off" value="{{ d.popup_flow_title }}" placeholder="弹窗标题名称" class="layui-input">
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">
                    <text title="必填项" style="color:red;">*</text>
                    其他信息设置</label>
                <div style="margin-left: 110px;">
                    <div class="layui-form-item">
                        <label class="layui-form-label">
                            <text title="必填项" style="color:red;">*</text>
                            跑马灯报名信息</label>
                        <div class="layui-input-block">
                            <!-- 隐藏域设置开关未选中时需要传递的参数值 -->
                            <input type="hidden" name="other_info_set_json[0][is_horse_race_lamp]" value="0"/>
                            <input type="checkbox" name="other_info_set_json[0][is_horse_race_lamp]" lay-skin="switch"
                                   lay-text="是|否" value="1"
                                   {{# if(d.other_info_set_json[0].is_horse_race_lamp==1){}}checked="checked"{{#}}}/>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">标题名称</label>
                        <div class="layui-input-block" style="width: 200px;">
                            <input type="text" name="other_info_set_json[0][title]" placeholder="请输入标题名称"
                                   class="layui-input" autocomplete="off" value="{{d.other_info_set_json[0].title}}">
                        </div>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">专题详情图</label>
                <div class="layui-input-block">
                    <div class="laytpUpload"
                         data-name="show_page_detail_images"
                         data-accept="image"
                         data-type="ali-oss-url"
                         data-multi="true"
                         data-uploaded="{{ d.show_page_detail_images_blank }}"
                         data-uploadedId="{{ d.show_page_detail_images }}"
                         data-uploadedFilename="{{d.show_page_detail_images_blank}}"
                    ></div>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">专题视频</label>
                <div class="layui-input-block">
                    <div class="laytpUpload"
                         data-name="show_page_video_url"
                         data-accept="video"
                         data-type="ali-oss-url"
                         data-viaServer="unVia"
                         data-uploaded="{{ d.show_page_video_url }}"
                         data-uploadedId="{{ d.show_page_video_url }}"
                    ></div>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">
                    <text title="必填项" style="color:red;">*</text>
                    按钮名称</label>
                <div class="layui-input-block">
                    <input type="text" name="btn_desc" autocomplete="off" placeholder="请输入按钮名称" class="layui-input"
                           lay-verify="required" value="{{d.btn_desc}}">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">主背景图</label>
                <div class="layui-input-block">
                    <div class="laytpUpload"
                         data-name="back_image"
                         data-accept="image"
                         data-type="ali-oss-url"
                         data-uploaded="{{ d.back_image }}"
                         data-uploadedId="{{ d.back_image }}"
                    ></div>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">按钮背景图</label>
                <div class="layui-input-block">
                    <div class="laytpUpload"
                         data-name="btn_back_image"
                         data-accept="image"
                         data-type="ali-oss-url"
                         data-uploaded="{{ d.btn_back_image }}"
                         data-uploadedId="{{ d.btn_back_image }}"
                    ></div>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">验证码背景图</label>
                <div class="layui-input-block">
                    <div class="laytpUpload"
                         data-name="captcha_back_image"
                         data-accept="image"
                         data-type="ali-oss-url"
                         data-uploaded="{{ d.captcha_back_image }}"
                         data-uploadedId="{{ d.captcha_back_image }}"
                    ></div>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">
                    <text title="必填项" style="color:red;">*</text>是否需要手机号</label>
                <div class="layui-input-block">
                    <input type="radio" name="is_need_phone" value="1" title="是" {{# if(d.is_need_phone==1){ }}checked="checked" {{# } }}>
                    <input type="radio" name="is_need_phone" value="0" title="否" {{# if(d.is_need_phone==0){ }}checked="checked" {{# } }}>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">
                    <text title="必填项" style="color:red;">*</text>是否需要验证码</label>
                <div class="layui-input-block">
                    <input type="radio" name="is_need_captcha" value="1" title="是" {{# if(d.is_need_captcha==1){ }}checked="checked" {{# } }}>
                    <input type="radio" name="is_need_captcha" value="0" title="否" {{# if(d.is_need_captcha==0){ }}checked="checked" {{# } }}>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">是否隐藏提交按钮</label>

                    <input type="radio" name="is_hide_submit_btn" value="0" title="否" {{# if(d.is_hide_submit_btn==0){ }}checked="checked" {{# } }}>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">
                    <text title="必填项" style="color:red;">*</text>
                    状态</label>
                <div class="layui-input-block">
                    <input type="radio" name="status" value="1" title="启用" {{# if(d.status==1){ }}checked="checked" {{#
                           } }}>
                    <input type="radio" name="status" value="0" title="禁用" {{# if(d.status==0){ }}checked="checked" {{#
                           } }}>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">
                    <text title="必填项" style="color:red;">*</text>页面领取方式</label>
                <div class="layui-input-block">
                    <input type="radio" name="page_show_type" value="1" title="首页+留资" {{# if(d.page_show_type==1){ }}checked="checked" {{# } }}>
                    <input type="radio" name="page_show_type" value="2" title="首页+弹窗留资" {{# if(d.page_show_type==2){ }}checked="checked" {{# } }}>
                    <input type="radio" name="page_show_type" value="3" title="首页无留资" {{# if(d.page_show_type==3){ }}checked="checked" {{# } }}>

                    <input type="radio" name="special_appoint" value="3" title="辉之光企微销售" {{# if(d.special_appoint==3){ }}checked="checked" {{# } }}>

    </div>
    </div>
    <div class="bottom">

            <button type="submit" class="laytp-btn laytp-btn-primary laytp-btn-sm" lay-submit=""

                提交

                <i class="layui-icon layui-icon-refresh"></i>

<script>

</script>
<script>

    layui.use(['form', 'layer', 'jquery'], function () {
        $ = layui.jquery;
        var layer = layui.layer,
            form = layui.form;
        //监听多选框点击事件  主要是通过 lay-filter="sex"  来监听
        form.on('radio(page_type)', function (data) {
            //console.log( data );　　//打印当前选择的信息
            var value = data.value;   //  当前选中的value值
            if (value == 2) {
                $("#h5-article").show();
            } else {
                $("#h5-article").hide();
            }
        });
    })

    layui.use(['form', 'layer', 'jquery'], function () {
        $ = layui.jquery;
        var layer = layui.layer,
            form = layui.form;
        //监听多选框点击事件  主要是通过 lay-filter="sex"  来监听
        form.on('radio(is_wx_gzh)', function (data) {
            //console.log( data );　　//打印当前选择的信息
            var value = data.value;   //  当前选中的value值
            if (value == 1) {
                $("#h5-gzh").show();
            } else {
                $("#h5-gzh").hide();
            }
        });
    })

    window.changeAppClass = function (params) {
        getChangeAppClassInfo(params.arr[0].id, null);
    }

    function getChangeAppClassInfo(app_class_id, merchant_ids_arr) {
        facade.ajax({
            route: '/admin.merchant/getListByAppClassId',
            data: {
                all_data: 1,
                app_class_id: app_class_id
            }
        }).done(function (res) {
            if (res.code === 0) {
                if (res.data != null) {
                    let list = res.data;
                    if (merchant_ids_arr != null) {
                        let val = [];
                        for (var i = 0; i < list.length; i++) { //循环所有选项
                            if (merchant_ids_arr.indexOf(list[i].value + '') != -1) { //判断是否需要默认选中
                                var con = {name: list[i].name, value: list[i].value, selected: true, disabled: false};
                            } else {
                                var con = {name: list[i].name, value: list[i].value, selected: false, disabled: false};
                            }
                            val.push(con);
                        }
                        list = val;
                    }
                    layui.xmSelect.render({
                        el: '#merchant_ids',
                        tips: '请选择商户',
                        empty: '暂无数据',
                        filterable: true,    //是否开启搜索
                        searchTips: '请在此搜索商户名称',
                        paging: true,    //是否开启自定义分页
                        pageSize: 10,    //分页条数
                        radio: false, //是否开启单选模式,默认false
                        repeat: false,    //是否开启重复性模式,默认false
                        clickClose: false,    //是否点击选项后自动关闭下拉框,默认false
                        max: 0,  //设置多选选中上限  0-不限制
                        name: 'merchant_ids',
                        data: list,
                        textValue: 'name',
                        on: function (data) {
                            // //arr:  当前多选已选中的数据
                            // var arr = data.arr;
                            // //change, 此次选择变化的数据,数组
                            // var change = data.change;
                            // //isAdd, 此次操作是新增还是删除  true/false
                            // var isAdd = data.isAdd;
                        },
                    });
                }
            }
        });
    }


    layui.use(['laytp'], function () {
        let form = layui.form;
        let $ = layui.jquery;
        //获取参数ID
        var id = facade.getUrlParam('id');
        if (!id) {
            facade.error('参数ID不能为空');
            return false;
        }

        let gather_user_info = [];

        //获取数据，渲染到对应的节点上
        facade.ajax({
            route: "/admin.for_flow/info",
            data: {id: id},
            successAlert: false,
            showLoading: true,
            sync: false,
            async: false,
        }).done(function (res) {
            if (res.code === 0) {
                layui.laytpl($("#form").html()).render(res.data, function (string) {
                    $("form").html(string);
                    let merchant_ids_arr = res.data.merchant_ids.split(',');
                    getChangeAppClassInfo(res.data.app_class_id, merchant_ids_arr)
                    layui.laytpForm.render();
                    form.render();
                });
            }
        });


        form.on('submit(laytp-form)', function (data) {
            data = facade.setEditorField(data);
            facade.ajax({
                route: '/admin.for_flow/edit',
                data: data.field
            }).done(function (res) {
                if (res.code === 0) {
                    parent.layui.layer.close(parent.layui.layer.getFrameIndex(window.name));//关闭当前页
                    parent.layui.table.reload("laytp-table");
                }
            });
            return false;
        });
    })
</script>
</body>
