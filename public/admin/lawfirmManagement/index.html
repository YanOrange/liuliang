<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>线索列表</title>
</head>

<body class="laytp-container">
    <div class="layui-card" id="search-form" style="display:none;">
        <div class="layui-card-body">
            <form class="layui-form" lay-filter="layui-form">
                <div class="layui-form-item">
                    <div class="layui-form-item layui-inline">
                    <label class="layui-form-label">渠道</label>
                    <div class="layui-input-inline">
                        <div class="xmSelect" data-name="search_param[channel_id]" data-sourceType="route"
                            data-source="/admin.common_api/getChannelList" data-textField="channel_name"
                            data-valueField="id" data-paging="true" data-placeholder="请选择渠道"></div>
                    </div>
                </div>
                <div class="layui-form-item layui-inline">
                    <label class="layui-form-label">跟进状态</label>
                    <div class="layui-input-inline">
                        <select name="search_param[status]" class="layui-select">
                            <option value="">全部</option>
                            <option value="99">已放弃</option>
                            <option value="1">待跟进</option>
                            <option value="2">跟进中</option>
                            <option value="3">已完成</option>
                        </select>
                    </div>
                </div>
                <div class="layui-form-item layui-inline">
                    <label class="layui-form-label">跟进情况</label>
                    <div class="layui-input-inline">
                        <select name="search_param[situation]" class="layui-select">
                            <option value="">全部</option>
                            <option value="0">正常</option>
                            <option value="1">拒绝</option>
                            <option value="2">无法接通</option>
                            <option value="4">无意向客户</option>
                            <option value="5">潜在客户</option>
                            <option value="6">强意向客户</option>
                        </select>
                    </div>
                </div>
                <div class="layui-form-item layui-inline">
                    <label class="layui-form-label">渠道来源</label>
                    <div class="layui-input-inline">
                        <select name="search_param[source_id]" class="layui-select">
                            <option value="">全部</option>
                            <option value="1">百度</option>
                            <option value="2">高德</option>
                            <option value="3">美团</option>
                            <option value="4">法临</option>
                            <option value="5">律图</option>
                            <option value="6">律临</option>
                            <option value="7">法律快车</option>
                        </select>
                    </div>
                </div>
                <div class="layui-form-item layui-inline">
                    <label class="layui-form-label">手机号</label>
                    <div class="layui-input-inline">
                        <input type="text" name="search_param[phone]" class="layui-input" autocomplete="off" />
                    </div>
                </div>
                <div class="layui-form-item layui-inline">
                    <label class="layui-form-label">创建时间</label>
                    <div class="layui-input-inline" style="width: 290px;">
                        <input type="text" class="layui-input laydate" id="create_time" name="search_param[create_time]"
                            data-type="datetime" data-isRange="true" placeholder="请选择创建时间">
                    </div>
                </div>
                <div class="layui-form-item layui-inline">
                    <button class="laytp-btn laytp-btn-md laytp-btn-primary" lay-submit lay-filter="laytp-search-form">
                        <i class="layui-icon layui-icon-search"></i>
                        查询
                    </button>
                    <button type="reset" class="laytp-btn laytp-btn-md laytp-search-form-reset">
                        <i class="layui-icon layui-icon-refresh"></i>
                        重置
                    </button>
                </div>
        </div>
        </form>
    </div>
    </div>
    <div class="layui-card">
        <div class="layui-card-body">
            <table id="laytp-table" lay-filter="laytp-table"></table>
        </div>
    </div>

    <script type="text/html" id="default-toolbar">
    <button class="laytp-btn laytp-btn-warming laytp-btn-md" lay-event="search">
        <i class="layui-icon layui-icon-search"></i>
        搜索
    </button>
    {{# if(facade.hasAuth("/admin.thread_lawyer/exportThread")){ }}
    <button class="laytp-btn laytp-btn-danger laytp-btn-md" lay-event="exportThread">
        <i class="layui-icon exportThread"></i>
        导出
    </button>
    {{# } }}
</script>

    <script type="text/html" id="default-bar">
    {{# if(facade.hasAuth("/admin.thread_lawyer/showDetail")){ }}
    <button class="laytp-btn laytp-btn-primary laytp-btn-xs" lay-event="showDetail"><i class="layui-icon layui-icon-edit"></i>查看</button>
    {{# } }}
</script>

    <script>
        if (localStorage.getItem("staticDomain")) {
            document.write("<link rel='stylesheet' href='" + localStorage.getItem("staticDomain") + "/component/layui/css/layui.css?v=" + localStorage.getItem("version") + "'>");
            document.write("<script src='" + localStorage.getItem("staticDomain") + "/component/layui/layui.js?v=" + localStorage.getItem("version") + "'><\/script>");
            document.write("<script src='" + localStorage.getItem("staticDomain") + "/component/laytp/layuiConfig.js?v=" + localStorage.getItem("version") + "'><\/script>");
            document.write("<script src='" + localStorage.getItem("staticDomain") + "/admin/js/lawfirmManagement.js?v=" + localStorage.getItem("version") + "'><\/script>");
        } else {
            document.write("<link rel='stylesheet' href='/static/component/layui/css/layui.css?v=" + localStorage.getItem("version") + "'>");
            document.write("<script src='/static/component/layui/layui.js?v=" + localStorage.getItem("version") + "'><\/script>");
            document.write("<script src='/static/component/laytp/layuiConfig.js?v=" + localStorage.getItem("version") + "'><\/script>");
            document.write("<script src='/static/admin/js/lawfirmManagement.js?v=" + localStorage.getItem("version") + "'><\/script>");
        }
    </script>
</body>

</html>
