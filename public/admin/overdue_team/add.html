<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>添加团队</title>
</head>
<body>
<form class="layui-form" lay-filter="layui-form">
    <div class="mainBox">
        <div class="main-container">
            <div class="main-container">

                <div class="layui-form-item">
                    <label class="layui-form-label"><text title="必填项" style="color:red;">*</text>昵称</label>
                    <div class="layui-input-block">
                        <input type="text" name="nickname"  lay-verify="required" autocomplete="off" placeholder="请输入昵称" class="layui-input">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label"><text title="必填项" style="color:red;">*</text>头像</label>
                    <div class="layui-input-block">
                        <div class="laytpUpload"
                             data-name="avator"
                             data-accept="image"
                             data-multi="true"
                             data-type="ali-oss-url"
                        ></div>
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label"><text title="必填项" style="color:red;">*</text>职务</label>
                    <div class="layui-input-block">
                        <input type="text" name="appointment"  lay-verify="required" autocomplete="off" placeholder="请输入职务" class="layui-input" value="">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label"><text title="必填项" style="color:red;">*</text>工作年限</label>
                    <div class="layui-input-block">
                        <input type="number" name="work_year"  lay-verify="required" autocomplete="off" placeholder="请输入工作年限(范围1-30)" class="layui-input" value="">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label"><text title="必填项" style="color:red;">*</text>工作年限</label>
                    <div class="layui-input-block">
                        <input type="number" name="work_year"  lay-verify="required" autocomplete="off" placeholder="请输入工作年限(范围1-30)" class="layui-input" value="">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label"><text title="必填项" style="color:red;">*</text>工作年限</label>
                    <div class="layui-input-block">
                        <input type="number" name="work_year"  lay-verify="required" autocomplete="off" placeholder="请输入工作年限(范围1-30)" class="layui-input" value="">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label"><text title="必填项" style="color:red;">*</text>简介</label>
                    <div class="layui-input-block">
                        <input type="text" name="introduce"  lay-verify="required" autocomplete="off" placeholder="请输入简介" class="layui-input" value="">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label"><text title="必填项" style="color:red;">*</text>状态</label>
                    <div class="layui-input-block">
                        <input type="radio" name="status" value="1" title="上架" >
                        <input type="radio" name="status" value="0" title="下架" checked>
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label"><text title="必填项" style="color:red;">*</text>关联文章</label>
                    <div class="layui-input-block">
                        <div class="xmSelect"
                             data-name="article_ids"
                             data-sourceType="route"
                             data-source="/admin.overdue_team/articleList"
                             data-textField="title"
                             data-valueField="id"
                             data-paging="true"
                             data-placeholder="文章"
                        ></div>
                    </div>
                </div>

            </div>
        </div>
    </div>
    <div class="bottom">
        <div class="button-container">
            <button type="submit" class="laytp-btn laytp-btn-primary laytp-btn-sm" lay-submit="" lay-filter="add">
                <i class="layui-icon layui-icon-ok"></i>
                提交
            </button>
            <button type="reset" class="laytp-btn laytp-btn-sm">
                <i class="layui-icon layui-icon-refresh"></i>
                重置
            </button>
        </div>
    </div>
</form>
<script>
    if(localStorage.getItem("staticDomain")){
        document.write("<link rel='stylesheet' href='" + localStorage.getItem("staticDomain") + "/component/layui/css/layui.css?v=" + localStorage.getItem("version") + "'>");
        document.write("<script src='" + localStorage.getItem("staticDomain") + "/component/layui/layui.js?v="+localStorage.getItem("version")+"'><\/script>");
        document.write("<script src='" + localStorage.getItem("staticDomain") + "/component/laytp/layuiConfig.js?v="+localStorage.getItem("version")+"'><\/script>");
    }else{
        document.write("<link rel='stylesheet' href='/static/component/layui/css/layui.css?v=" + localStorage.getItem("version") + "'>");
        document.write("<script src='/static/component/layui/layui.js?v="+localStorage.getItem("version")+"'><\/script>");
        document.write("<script src='/static/component/laytp/layuiConfig.js?v="+localStorage.getItem("version")+"'><\/script>");
    }
</script>
<script>
    layui.use(['laytp'],function(){
        layui.form.on('submit(add)', function(data){
            data = facade.setEditorField(data);
            facade.ajax({
                route:'/admin.overdue_team/add',
                data : data.field
            }).done(function(res){
                if(res.code === 0){
                    parent.layui.layer.close(parent.layui.layer.getFrameIndex(window.name));//关闭当前页
                    parent.layui.table.reload("laytp-table");
                }
            });
            return false;
        });
    })
</script>
</body>
</html>
