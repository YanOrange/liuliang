<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>添加客服</title>
</head>
<body>
<script>
</script>
<script type="text/html" id="form">

<form class="layui-form" lay-filter="layui-form" id="form">
    <div class="mainBox">
        <div class="main-container">
            <div class="main-container">
                <div class="layui-form-item" id="selectMerchant">
                    <label class="layui-form-label"><text title="必填项" style="color:red;">*</text>商户</label>
                    <div class="layui-input-block">
                        <div class="xmSelect"
                             id="customerXmSelect"
                             data-name="merchant_id"
                             data-sourceType="route"
                             data-source="/admin.merchant/index"
                             data-radio="true"
                             data-textField="merchant_name"
                             data-valueField="id"
                             data-paging="true"
                             data-selected="{{d.id}}"
                        ></div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label"><text title="必填项" style="color:red;">*</text>登陆账号</label>
                    <div class="layui-input-block">
                        <input type="text" name="account_name"  autocomplete="off" placeholder="请输入登陆账号" class="layui-input">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label"><text title="必填项" style="color:red;">*</text>登陆手机</label>
                    <div class="layui-input-block">
                        <input type="text" name="login_mobiles" lay-verify="required" autocomplete="off" placeholder="请输入手机号" class="layui-input">
                        <text title="必填项" style="color:red;">多个手机号英文用“,”隔开</text>
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label"><text title="必填项" style="color:red;">*</text>登陆密码</label>
                    <div class="layui-input-block">
                        <input type="password" name="pwd" lay-verify="required" autocomplete="off" placeholder="请输入登陆密码" class="layui-input">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label"><text title="必填项" style="color:red;">*</text>昵称</label>
                    <div class="layui-input-block">
                        <input type="text" name="nickname" lay-verify="required" autocomplete="off" placeholder="请输入昵称" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item" id="avatar">
                    <label class="layui-form-label">头像</label>
                    <div class="layui-input-block">
                        <div class="laytpUpload"
                             data-name="avatar"
                             data-accept="image"
                             data-type="ali-oss-url"
                        ></div>
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">微信号</label>
                    <div class="layui-input-block">
                        <input type="text" name="wechat_number" autocomplete="off" placeholder="请输入微信号" class="layui-input">
                    </div>
                </div>
                 <div class="layui-form-item">
                    <label class="layui-form-label">企业微信获客链接</label>
                    <div class="layui-input-block">
                        <input type="text" name="customer_link" autocomplete="off" placeholder="请输入企业微信获客链接" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">手机号</label>
                    <div class="layui-input-block">
                        <input type="text" name="phone"  autocomplete="off" placeholder="请输入手机号" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">二维码</label>
                    <div class="layui-input-block">
                        <div class="laytpUpload"
                             data-name="qr_code"
                             data-accept="image"
                             data-type="ali-oss-url"
                        ></div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label"><text title="必填项" style="color:red;">*</text>当日线索分配数量</label>
                    <div class="layui-input-block">
                        <input type="number" name="daily_intake_limit_nums" lay-verify="required" autocomplete="off" placeholder="请输入当日线索分配数量" class="layui-input">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label"><text title="必填项" style="color:red;">*</text>权重(1-5区间)</label>
                    <div class="layui-input-block">
                        <input type="number" name="weight" lay-verify="required" autocomplete="off" placeholder="请输入权重" class="layui-input">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label"><text title="必填项" style="color:red;">*</text>是否需要未满18岁线索</label>
                    <div class="layui-input-block">
                        <input type="radio" name="is_under_eighteen_thread" value="1" title="是" >
                        <input type="radio" name="is_under_eighteen_thread" value="0" title="否" checked>
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label"><text title="必填项" style="color:red;">*</text>线索状态</label>
                    <div class="layui-input-block">
                        <input type="radio" name="thread_status" value="1" title="开启" checked>
                        <input type="radio" name="thread_status" value="0" title="关闭" >
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">排版类型</label>
                    <div class="layui-input-block">
                        <input type="radio" name="day_night_shift" value="0" title="全天" checked>
                        <input type="radio" name="day_night_shift" value="1" title="早班" >
                        <input type="radio" name="day_night_shift" value="2" title="晚班" >
                    </div>
                </div>

                <div class="layui-form-item layui-inline">
                    <label class="layui-form-label">工作时间</label>
                    <div class="layui-input-inline">
                        <input type="text" class="layui-input laydate"
                               id="daily_intake_time_period" name="daily_intake_time_period"
                               data-type="time" data-isRange="true" placeholder="请选择工作时间">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">客服分配线索数量</label>
                    <div class="layui-input-block">
                        <input type="number" name="assign_intake_limit_nums" autocomplete="off" placeholder="请输入客服分配线索数量" class="layui-input">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label"><text title="必填项" style="color:red;">*</text>账号状态</label>
                    <div class="layui-input-block">
                        <input type="radio" name="status" value="1" title="正常" checked>
                        <input type="radio" name="status" value="0" title="禁用">
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="bottom">
        <div class="button-container">
            <button type="submit" class="laytp-btn laytp-btn-primary laytp-btn-sm" lay-submit="" lay-filter="add">
                <i class="layui-icon layui-icon-ok"></i>
                提交
            </button>
            <button type="reset" class="laytp-btn laytp-btn-sm">
                <i class="layui-icon layui-icon-refresh"></i>
                重置
            </button>
        </div>
    </div>
</script>
<form class="layui-form" lay-filter="layui-form"></form>

<script>
    if(localStorage.getItem("staticDomain")){
        document.write("<link rel='stylesheet' href='" + localStorage.getItem("staticDomain") + "/component/layui/css/layui.css?v=" + localStorage.getItem("version") + "'>");
        document.write("<script src='" + localStorage.getItem("staticDomain") + "/component/layui/layui.js?v="+localStorage.getItem("version")+"'><\/script>");
        document.write("<script src='" + localStorage.getItem("staticDomain") + "/component/laytp/layuiConfig.js?v="+localStorage.getItem("version")+"'><\/script>");
    }else{
        document.write("<link rel='stylesheet' href='/static/component/layui/css/layui.css?v=" + localStorage.getItem("version") + "'>");
        document.write("<script src='/static/component/layui/layui.js?v="+localStorage.getItem("version")+"'><\/script>");
        document.write("<script src='/static/component/laytp/layuiConfig.js?v="+localStorage.getItem("version")+"'><\/script>");
    }
</script>
<script>
    layui.use(['laytp'],function(){
        merchantId = facade.getUrlParam('merchant_id');
        layui.laytpl($("#form").html()).render({id: merchantId},function(string){
            $("form").html(string);
            layui.laytpForm.render();

        });
        layui.form.on('submit(add)', function(data){
            facade.ajax({
                route:'/admin.customer/add',
                data : data.field
            }).done(function(res){
                if(res.code === 0){
                    parent.layui.layer.close(parent.layui.layer.getFrameIndex(window.name));//关闭当前页
                    parent.layui.table.reload("laytp-table");
                }
            });
            return false;
        });
    })
</script>
</body>
</html>
