<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>编辑资源评价</title>
</head>
<body>
<script type="text/html" id="form">
    <input type="hidden" name="id" value="{{ d.id }}"/>
    <input type="hidden" name="score" value="0"/>
    <div class="mainBox">
        <div class="main-container">
            <div class="main-container">
                <div class="layui-form-item">
                    <label class="layui-form-label">
                        <text title="必填项" style="color:red;">*</text>
                        评价资源</label>
                    <div class="layui-input-block">
                        <div class="xmSelect"
                             data-name="be_evaluated_id"
                             data-sourceType="route"
                             data-source="/admin.single.resource/index"
                             data-textField="title"
                             data-valueField="id"
                             data-radio="true"
                             data-paging="true"
                             data-placeholder="请选择评价资源"
                             data-selected="{{=d.be_evaluated_id}}"
                        ></div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">
                        <text title="必填项" style="color:red;">*</text>
                        用户昵称</label>
                    <div class="layui-input-block">
                        <input type="text" name="nickname" lay-verify="required" autocomplete="off"
                               placeholder="请输入用户昵称" class="layui-input" value="{{ d.nickname }}">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">
                        <text title="必填项" style="color:red;">*</text>
                        手机号</label>
                    <div class="layui-input-block">
                        <input type="text" name="phone" lay-verify="required" autocomplete="off" placeholder="请输入手机号"
                               class="layui-input" value="{{ d.phone }}">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">
                        <text title="必填项" style="color:red;">*</text>
                        用户头像</label>
                    <div class="layui-input-block">
                        <div class="laytpUpload"
                             data-name="avatar"
                             data-accept="image"
                             data-type="ali-oss-url"
                             data-uploaded="{{ d.avatar }}"
                             data-uploadedId="{{ d.avatar }}"
                        ></div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">
                        <text title="必填项" style="color:red;">*</text>
                        评价内容</label>
                    <div class="layui-input-block">
                        <textarea type="textarea" name="content" lay-verify="required"
                                  class="layui-textarea">{{=d.content}}</textarea>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">
                        <text title="必填项" style="color:red;">*</text>
                        排序</label>
                    <div class="layui-input-block">
                        <input type="text" name="sort" lay-verify="required" autocomplete="off" placeholder="请设置排序"
                               class="layui-input" value="{{=d.sort}}">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">
                        <text title="必填项" style="color:red;">*</text>
                        设置评论时间</label>
                    <div class="layui-input-block">
                        <input type="text" class="layui-input laydate" name="evaluate_time"
                               data-type="datetime" data-isRange="false" placeholder="请选择评论时间"
                               value="{{=d.evaluate_time}}">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">
                        <text title="必填项" style="color:red;">*</text>
                        状态</label>
                    <div class="layui-input-block">
                        <input type="radio" name="status" value="1" title="显示" {{# if(d.status===1){ }}checked="checked"
                               {{# } }}>
                        <input type="radio" name="status" value="0" title="隐藏" {{# if(d.status===0){ }}checked="checked"
                               {{# } }}>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="bottom">
        <div class="button-container">
            <button type="submit" class="laytp-btn laytp-btn-primary laytp-btn-sm" lay-submit=""
                    lay-filter="laytp-form">
                <i class="layui-icon layui-icon-ok"></i>
                提交
            </button>
            <button type="reset" class="laytp-btn laytp-btn-sm">
                <i class="layui-icon layui-icon-refresh"></i>
                重置
            </button>
        </div>
    </div>

</script>
<form class="layui-form" lay-filter="layui-form"></form>
<script>
    if (localStorage.getItem("staticDomain")) {
        document.write("<link rel='stylesheet' href='" + localStorage.getItem("staticDomain") + "/component/layui/css/layui.css?v=" + localStorage.getItem("version") + "'>");
        document.write("<script src='" + localStorage.getItem("staticDomain") + "/component/layui/layui.js?v=" + localStorage.getItem("version") + "'><\/script>");
        document.write("<script src='" + localStorage.getItem("staticDomain") + "/component/laytp/layuiConfig.js?v=" + localStorage.getItem("version") + "'><\/script>");
    } else {
        document.write("<link rel='stylesheet' href='/static/component/layui/css/layui.css?v=" + localStorage.getItem("version") + "'>");
        document.write("<script src='/static/component/layui/layui.js?v=" + localStorage.getItem("version") + "'><\/script>");
        document.write("<script src='/static/component/laytp/layuiConfig.js?v=" + localStorage.getItem("version") + "'><\/script>");
    }
</script>
<script>
    layui.use(['laytp'], function () {
        let form = layui.form;
        let $ = layui.jquery;
        //获取参数ID
        var id = facade.getUrlParam('id');
        if (!id) {
            facade.error('参数ID不能为空');
            return false;
        }

        //获取数据，渲染到对应的节点上
        facade.ajax({
            route: "/admin.single.resource_evaluate/info",
            data: {id: id},
            successAlert: false,
            showLoading: true
        }).done(function (res) {
            if (res.code === 0) {
                if (res.data.is_real === 1) {
                    facade.error('真实评价不能进行修改');
                    return false;
                }
                layui.laytpl($("#form").html()).render(res.data, function (string) {
                    $("form").html(string);
                    layui.laytpForm.render();
                    form.render();
                });
            }
        });

        form.on('submit(laytp-form)', function (data) {
            data = facade.setEditorField(data);
            facade.ajax({
                route: '/admin.single.resource_evaluate/edit',
                data: data.field
            }).done(function (res) {
                if (res.code === 0) {
                    parent.layui.layer.close(parent.layui.layer.getFrameIndex(window.name));//关闭当前页
                    parent.layui.table.reload("laytp-table");
                }
            });
            return false;
        });
    })
</script>
</body>
</html>
