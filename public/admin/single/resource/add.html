<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>新增课程</title>
</head>
<body>
<form class="layui-form" lay-filter="layui-form">

    <div class="mainBox">
        <div style="font-weight: bold;margin-top: 25px;margin-left: 20px;font-size: 16px">基础设置</div>
        <div style="width: 98%;border: 0.1px solid grey;opacity: 0.3;margin: auto;margin-top: 10px;"></div>
        <div class="main-container">
            <div class="main-container">
                <div class="layui-form-item">
                    <label class="layui-form-label">
                        <text title="必填项" style="color:red;">*</text>
                        资源分类</label>
                    <div class="layui-input-block">
                        <input type="radio" name="resource_type" value="1" title="热门">
                        <input type="radio" name="resource_type" value="2" title="推荐" checked>
                    </div>
                </div>
                <div class="" style="line-height: 35px">
                    <div class="layui-input-block" style="color: red; font-weight: bold;">**********  添加商户时，请选择一个站内商户</div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">
                        <text title="必填项" style="color:red;">*</text>
                        所属商户</label>
                    <div class="layui-input-block">
                        <div class="xmSelect"
                             data-name="merchant_ids"
                             data-sourceType="route"
                             data-source="/admin.merchant/index?is_many_organization=4"
                             data-textField="merchant_name_source"
                             data-valueField="id"
                             data-paging="true"
                             data-placeholder="添加商户时，请选择一个站内商户"
                        ></div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">
                        <text title="必填项" style="color:red;">*</text>
                        所属应用</label>
                    <div class="layui-input-block">
                        <div class="xmSelect"
                             data-name="app_ids"
                             data-sourceType="route"
                             data-source="/admin.app/index?is_many_organization=4&is_single_merchant=1"
                             data-textField="app_name"
                             data-valueField="id"
                             data-paging="true"
                             data-placeholder="所属应用"
                        ></div>
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">
                        <text title="必填项" style="color:red;">*</text>
                        资源名称</label>
                    <div class="layui-input-block">
                        <input type="text" name="title" autocomplete="off" placeholder="请输入资源名称" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">
                        <text title="必填项" style="color:red;">*</text>
                        资源地址</label>
                    <div class="layui-input-block">
                        <input type="text" name="downland_links" autocomplete="off" placeholder="请输入资源地址"
                               class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">
                        <text title="必填项" style="color:red;">*</text>
                        下载量</label>
                    <div class="layui-input-block">
                        <input type="number" name="down_nums"  lay-verify="number|down_nums" autocomplete="off"
                               placeholder="请输入下载量" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">
                        <text title="必填项" style="color:red;">*</text>
                        阅读量</label>
                    <div class="layui-input-block">
                        <input type="number" name="read_nums" lay-verify="number|read_nums" autocomplete="off"
                               placeholder="请输入下载量" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">
                        <text title="必填项" style="color:red;">*</text>
                        资源封面</label>
                    <div class="layui-input-block">
                        <div class="laytpUpload"
                             data-name="image"
                             data-accept="image"
                             data-type="ali-oss-url"
                        ></div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label" title="ueditor编辑器">
                        <text title="必填项" style="color:red;">*</text>
                        内容</label>
                    <div class="layui-input-block">
                        <iframe src="/admin/ueditor.html" class="editor" data-type="ueditor" data-id="content"
                                style="width:100%;height:530px;border: 0"></iframe>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">
                        <text title="必填项" style="color:red;">*</text>
                        排序</label>
                    <div class="layui-input-block">
                        <input type="number" name="sort" lay-verify="number" autocomplete="off"
                               placeholder="请输入排序" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">
                        <text title="必填项" style="color:red;">*</text>
                        状态</label>
                    <div class="layui-input-block">
                        <input type="radio" name="status" value="1" title="启用" checked>
                        <input type="radio" name="status" value="0" title="禁用">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">关联资源</label>
                    <div class="layui-input-block">
                        <div class="xmSelect"
                             data-name="resource_ids"
                             data-sourceType="route"
                             data-source="/admin.single.resource/index"
                             data-textField="title"
                             data-valueField="id"
                             data-paging="true"
                             data-placeholder="请选择推荐资源"
                        ></div>
                    </div>
                </div>
                <div style="font-weight: bold;margin-top: 25px;margin-left: 20px;font-size: 16px">其它设置</div>
                <div style="width: 98%;border: 0.1px solid grey;opacity: 0.3;margin: auto;margin-top: 10px;"></div>
                <div style="font-weight: bold;margin-top: 25px;margin-left: 25px;font-size: 14px">按钮文案设置</div>
                <div class="layui-form-item">
                    <label class="layui-form-label">
                        <text title="必填项" style="color:red;">*</text>
                        按钮文案</label>
                    <div class="layui-input-block">
                        <input type="text" name="btn_desc" lay-verify="required" autocomplete="off"
                               placeholder="请输入按钮文案" class="layui-input" value="获取资源内容">
                    </div>
                </div>
                <div style="font-weight: bold;margin-top: 25px;margin-left: 25px;font-size: 14px">二次确认信息设置</div>
                <div class="layui-form-item">
                    <div class="layui-input-block">
                        <table class="layui-table" lay-skin="line">
                            <thead>
                            </thead>
                            <tbody>
                            <tr>
                                <td style="padding: 4px 15px;"><label>
                                    <text title="必填项" style="color:red;">*</text>
                                    文案1</label><input class="layui-input" type="text" name="confirm_copy_desc[desc][]"
                                                      lay-verify="required" value="你确定要报名吗?"/></td>
                            </tr>
                            <tr>
                                <td style="padding: 4px 15px;"><label>
                                    <text title="必填项" style="color:red;">*</text>
                                    文案2</label><input class="layui-input" type="text" name="confirm_copy_desc[desc][]"
                                                      lay-verify="required" value="请主动添加老师微信,获取资料内容"/>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">
                        <text title="必填项" style="color:red;">*</text>
                        流程设置</label>
                    <div class="layui-input-block">
                        <table class="layui-table" lay-skin="line">
                            <thead>
                            </thead>
                            <tbody>
                            <tr>
                                <td style="padding: 4px 15px;"><label>
                                    <text title="必填项" style="color:red;">*</text>
                                    第1步</label><input class="layui-input" type="text" name="flow_desc[desc][]"
                                                      lay-verify="required" value="主动添加老师微信"/></td>
                            </tr>
                            <tr>
                                <td style="padding: 4px 15px;"><label>
                                    <text title="必填项" style="color:red;">*</text>
                                    第2步</label><input class="layui-input" type="text" name="flow_desc[desc][]"
                                                      lay-verify="required" value="与老师确认课程信息"/></td>
                            </tr>
                            <tr>
                                <td style="padding: 4px 15px;"><label>
                                    <text title="必填项" style="color:red;">*</text>
                                    第3步</label><input class="layui-input" type="text" name="flow_desc[desc][]"
                                                      lay-verify="required" value="名额抢占成功开始学习 "/></td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">
                        <text title="必填项" style="color:red;">*</text>
                        确认按钮文案</label>
                    <div class="layui-input-block">
                        <input type="text" name="confirm_btn_desc" lay-verify="required" autocomplete="off"
                               placeholder="请输入按钮文案" class="layui-input" value="前去微信联系老师">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">
                        <text title="必填项" style="color:red;">*</text>
                        未添加二维码文案</label>
                    <div class="layui-input-block">
                        <input type="text" name="not_add_qrcode_desc" lay-verify="required" autocomplete="off"
                               placeholder="请输入未添加二维码文案" class="layui-input" value="请先添加老师微信，获得下载资源">
                    </div>
                </div>


            </div>
        </div>
    </div>
    <div class="bottom">
        <div class="button-container">
            <button type="submit" class="laytp-btn laytp-btn-primary laytp-btn-sm" lay-submit="" lay-filter="add">
                <i class="layui-icon layui-icon-ok"></i>
                提交
            </button>
            <button type="reset" class="laytp-btn laytp-btn-sm">
                <i class="layui-icon layui-icon-refresh"></i>
                重置
            </button>
        </div>
    </div>
</form>
<script>
    if (localStorage.getItem("staticDomain")) {
        document.write("<link rel='stylesheet' href='" + localStorage.getItem("staticDomain") + "/component/layui/css/layui.css?v=" + localStorage.getItem("version") + "'>");
        document.write("<script src='" + localStorage.getItem("staticDomain") + "/component/layui/layui.js?v=" + localStorage.getItem("version") + "'><\/script>");
        document.write("<script src='" + localStorage.getItem("staticDomain") + "/component/laytp/layuiConfig.js?v=" + localStorage.getItem("version") + "'><\/script>");
    } else {
        document.write("<link rel='stylesheet' href='/static/component/layui/css/layui.css?v=" + localStorage.getItem("version") + "'>");
        document.write("<script src='/static/component/layui/layui.js?v=" + localStorage.getItem("version") + "'><\/script>");
        document.write("<script src='/static/component/laytp/layuiConfig.js?v=" + localStorage.getItem("version") + "'><\/script>");
    }
</script>
<script>
    layui.form.verify({
        //value：表单的值、item：表单的DOM对象
        down_nums: function (value, item) {
            if (value < 0 || value > 2147483647) {
                return '下载量超出限制范围';
            }
        },
        read_nums: function (value, item) {
            if (value < 0 || value > 2147483647) {
                return '阅读量超出限制范围';
            }
        },
    });
    layui.use(['laytp'], function () {
        layui.form.on('submit(add)', function (data) {
            data = facade.setEditorField(data);
            facade.ajax({
                route: '/admin.single.resource/add',
                data: data.field
            }).done(function (res) {
                if (res.code === 0) {
                    parent.layui.layer.close(parent.layui.layer.getFrameIndex(window.name));//关闭当前页
                    parent.layui.table.reload("laytp-table");
                }
            });
            return false;
        });
    })
</script>
</body>
</html>
