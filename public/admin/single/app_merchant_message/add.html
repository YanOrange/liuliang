<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>新增商户应用消息</title>
</head>
<body>
<form class="layui-form" lay-filter="layui-form">

    <div class="mainBox">
        <div style="width: 98%;border: 0.1px solid grey;opacity: 0.3;margin: auto;margin-top: 10px;"></div>
        <div class="main-container">
            <div class="main-container">
                <div class="layui-form-item">
                    <label class="layui-form-label"><text title="必填项" style="color:red;">*</text>商户应用主体</label>
                    <div class="layui-input-block">
                        <div class="xmSelect"
                             data-name="app_message_id"
                             data-sourceType="route"
                             data-source="/admin.single.app_merchant_message_config/index"
                             data-textField="id"
                             data-valueField="id"
                             data-paging="true"
                             data-radio="true"
                             data-placeholder="请选择商户应用主体"
                             data-layVerify="required"
                        ></div>
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label"><text title="必填项" style="color:red;">*</text>消息标题</label>
                    <div class="layui-input-block">
                        <input type="text" name="title"  lay-verify="required"  autocomplete="off" placeholder="请输入消息标题" class="layui-input">
                    </div>
                </div>


                <div class="layui-form-item">
                    <label class="layui-form-label"><text title="必填项" style="color:red;">*</text>消息内容</label>
                    <div class="layui-input-block">
                        <textarea type="textarea" name="content"  maxlength="200" lay-verify="required"  class="layui-textarea"></textarea>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label"><text title="必填项" style="color:red;">*</text>显示时长（秒）</label>
                    <div class="layui-input-block">
                        <input type="number" name="times" lay-verify="required" lay-verify="required" autocomplete="off" placeholder="请输入显示时长" class="layui-input">
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="bottom">
        <div class="button-container">
            <button type="submit" class="laytp-btn laytp-btn-primary laytp-btn-sm" lay-submit="" lay-filter="add">
                <i class="layui-icon layui-icon-ok"></i>
                提交
            </button>
            <button type="reset" class="laytp-btn laytp-btn-sm">
                <i class="layui-icon layui-icon-refresh"></i>
                重置
            </button>
        </div>
    </div>
</form>
<script>
    if(localStorage.getItem("staticDomain")){
        document.write("<link rel='stylesheet' href='" + localStorage.getItem("staticDomain") + "/component/layui/css/layui.css?v=" + localStorage.getItem("version") + "'>");
        document.write("<script src='" + localStorage.getItem("staticDomain") + "/component/layui/layui.js?v="+localStorage.getItem("version")+"'><\/script>");
        document.write("<script src='" + localStorage.getItem("staticDomain") + "/component/laytp/layuiConfig.js?v="+localStorage.getItem("version")+"'><\/script>");
    }else{
        document.write("<link rel='stylesheet' href='/static/component/layui/css/layui.css?v=" + localStorage.getItem("version") + "'>");
        document.write("<script src='/static/component/layui/layui.js?v="+localStorage.getItem("version")+"'><\/script>");
        document.write("<script src='/static/component/laytp/layuiConfig.js?v="+localStorage.getItem("version")+"'><\/script>");
    }
</script>
<script>
    layui.use(['laytp'],function(){
        layui.form.on('submit(add)', function(data){
            data = facade.setEditorField(data);
            facade.ajax({
                route:'/admin.single.app_merchant_message/add',
                data : data.field
            }).done(function(res){
                if(res.code === 0){
                    parent.layui.layer.close(parent.layui.layer.getFrameIndex(window.name));//关闭当前页
                    parent.layui.table.reload("laytp-table");
                }
            });
            return false;
        });
    })
</script>
</body>
</html>
