<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>添加视频</title>
</head>
<body>
<form class="layui-form" lay-filter="layui-form">

    <div class="mainBox">
        <div class="main-container">
            <div class="main-container">
                <div class="layui-form-item">
                    <label class="layui-form-label">
                        <text title="必填项" style="color:red;">*</text>内容类型</label>
                    <div class="layui-input-block">
                        <input type="radio" name="type" lay-filter="type" value="1" title="视频" checked>
                        <input type="radio" name="type" lay-filter="type" value="2" title="文章">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">
                        <text title="必填项" style="color:red;">*</text>应用</label>
                    <div class="layui-input-block">
                        <div class="xmSelect"
                             data-name="app_ids"
                             data-sourceType="route"
                             data-source="/admin.app/index?is_many_organization=5"
                             data-textField="app_name"
                             data-valueField="id"
                             data-paging="true"
                             data-placeholder="应用"
                             data-layVerify="required"
                        ></div>
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">
                        <text title="必填项" style="color:red;">*</text>标签分类</label>
                    <div class="layui-input-block">
                        <div class="xmSelect"
                             data-name="class_id"
                             data-sourceType="route"
                             data-source="/admin.single.video_article/classList?class_type=3"
                             data-textField="part_class_name"
                             data-valueField="id"
                             data-paging="true"
                             data-placeholder="标签分类"
                             data-radio="true"
                             data-layVerify="required"
                        ></div>
                    </div>
                </div>

                <div class="layui-form-item" id="title">
                    <label class="layui-form-label">
                        <text title="必填项" style="color:red;">*</text>视频名称</label>
                    <div class="layui-input-block">
                        <input type="text" name="title" maxlength="30" autocomplete="off" placeholder="请输入视频名称" class="layui-input">
                    </div>
                </div>

                <div class="layui-form-item" id="video-url">
                    <label class="layui-form-label">
                        <text title="必填项" style="color:red;">*</text>上传视频</label>
                    <div class="layui-input-block">
                        <div class="laytpUpload"
                             data-name="video_url"
                             data-accept="video"
                             data-type="ali-oss-url"
                        ></div>
                    </div>
                </div>

                <div class="layui-form-item" id="video-image">
                    <label class="layui-form-label">
                        <text title="必填项" style="color:red;">*</text>上传视频封面</label>
                    <div class="layui-input-block">
                        <div class="laytpUpload"
                             data-name="video_image"
                             data-accept="image"
                             data-type="ali-oss-url"
                        ></div>
                    </div>
                </div>

                <div class="layui-form-item" id="course">
                    <label class="layui-form-label">关联课程</label>
                    <div class="layui-input-block">
                        <div class="xmSelect"
                             data-name="course_id"
                             data-sourceType="route"
                             data-source="/admin.single.course/index"
                             data-textField="title"
                             data-valueField="id"
                             data-paging="true"
                             data-placeholder="请选择课程"
                             data-radio="true"
                        ></div>
                    </div>
                </div>

                <div class="layui-form-item" id="article" style="display:none;">
                    <label class="layui-form-label">关联文章</label>
                    <div class="layui-input-block">
                        <div class="xmSelect"
                             data-name="article_id"
                             data-sourceType="route"
                             data-source="/admin.article/index"
                             data-textField="title"
                             data-valueField="id"
                             data-paging="true"
                             data-placeholder="请选择文章"
                             data-radio="true"
                        ></div>
                    </div>
                </div>

                <div class="layui-form-item" id="play_nums">
                    <label class="layui-form-label">
                        <text title="必填项" style="color:red;">*</text>视频播放</label>
                    <div class="layui-input-block">
                        <input type="text" name="play_nums" lay-verify="required" autocomplete="off" placeholder="请输入视频播放次数" class="layui-input">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">课程标签</label>
                    <div class="layui-input-block">
                        <div class="xmSelect"
                             data-name="tag_id"
                             data-sourceType="route"
                             data-source="/admin.part.part_course_tag/index?tag_type=3"
                             data-textField="tag_name"
                             data-valueField="id"
                             data-paging="true"
                             data-placeholder="请选择标签"
                             data-radio="true"
                        ></div>
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">
                        <text title="必填项" style="color:red;">*</text>排序</label>
                    <div class="layui-input-block">
                        <input type="number" name="sort" lay-verify="number" autocomplete="off" placeholder="请输入排序" class="layui-input" value="0">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">
                        <text title="必填项" style="color:red;">*</text>状态</label>
                    <div class="layui-input-block">
                        <input type="radio" name="status" value="1" title="上架">
                        <input type="radio" name="status" value="0" title="下架" checked>
                    </div>
                </div>

            </div>
        </div>
    </div>
    <div class="bottom">
        <div class="button-container">
            <button type="submit" class="laytp-btn laytp-btn-primary laytp-btn-sm" lay-submit="" lay-filter="add">
                <i class="layui-icon layui-icon-ok"></i>
                提交
            </button>
            <button type="reset" class="laytp-btn laytp-btn-sm">
                <i class="layui-icon layui-icon-refresh"></i>
                重置
            </button>
        </div>
    </div>
</form>
<script>
    if (localStorage.getItem("staticDomain")) {
        document.write("<link rel='stylesheet' href='" + localStorage.getItem("staticDomain") + "/component/layui/css/layui.css?v=" + localStorage.getItem("version") + "'>");
        document.write("<script src='" + localStorage.getItem("staticDomain") + "/component/layui/layui.js?v=" + localStorage.getItem("version") + "'><\/script>");
        document.write("<script src='" + localStorage.getItem("staticDomain") + "/component/laytp/layuiConfig.js?v=" + localStorage.getItem("version") + "'><\/script>");
    } else {
        document.write("<link rel='stylesheet' href='/static/component/layui/css/layui.css?v=" + localStorage.getItem("version") + "'>");
        document.write("<script src='/static/component/layui/layui.js?v=" + localStorage.getItem("version") + "'><\/script>");
        document.write("<script src='/static/component/laytp/layuiConfig.js?v=" + localStorage.getItem("version") + "'><\/script>");
    }
</script>
<script>
    layui.form.verify({
        //value：表单的值、item：表单的DOM对象
        title: function (value, item) {
            if (value.length > 30) {
                return '课程名称不能大于30个字';
            }
        },
    });

    layui.use(['form', 'layer', 'jquery'], function () {
        $ = layui.jquery;
        var layer = layui.layer,
            form = layui.form;
        form.on('radio(type)', function (data) {
            var value = data.value;   //  当前选中的value值
            if (value == 1) {
                $("#title").show();
                $("#video-url").show();
                $("#video-image").show();
                $("#course").show();
                $("#play-nums").show();
                $("#article").hide();
            }
            if (value == 2) {
                $("#title").hide();
                $("#video-url").hide();
                $("#video-image").hide();
                $("#course").hide();
                $("#play-nums").hide();
                $("#article").show();
            }

        });
    });

    layui.use(['laytp'], function () {
        layui.form.on('submit(add)', function (data) {
            data = facade.setEditorField(data);
            facade.ajax({
                route: '/admin.single.video_article/add',
                data: data.field
            }).done(function (res) {
                if (res.code === 0) {
                    parent.layui.layer.close(parent.layui.layer.getFrameIndex(window.name));//关闭当前页
                    parent.layui.table.reload("laytp-table");
                }
            });
            return false;
        });
    })
</script>
</body>
</html>
