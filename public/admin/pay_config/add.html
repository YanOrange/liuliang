<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>添加支付配置</title>
</head>
<body>
<form class="layui-form" lay-filter="layui-form">
    <div class="mainBox">
        <div class="main-container">
            <div class="main-container">
                <div class="layui-form-item">
                    <label class="layui-form-label"><text title="必填项" style="color:red;">*</text>关联应用</label>
                    <div class="layui-input-block">
                        <div class="xmSelect"
                             data-name="app_id"
                             data-sourceType="route"
                             data-source="/admin.app/index"
                             data-radio="true"
                             data-textField="app_name"
                             data-valueField="id"
                             data-paging="true"
                        ></div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">安卓包名</label>
                    <div class="layui-input-block">
                        <input type="text" name="android_bundle_id"  autocomplete="off" placeholder="请输入安卓" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">ios包名</label>
                    <div class="layui-input-block">
                        <input type="text" name="ios_bundle_id"  autocomplete="off" placeholder="请输入ios包名" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">微信小程序标识</label>
                    <div class="layui-input-block">
                        <input type="text" name="wxmini_bundle_id"  autocomplete="off" placeholder="请输入微信小程序标识" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">支付宝appid</label>
                    <div class="layui-input-block">
                        <input type="text" name="alipay_app_id"  autocomplete="off" placeholder="请输入支付宝appid" class="layui-input">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">支付宝支付网关地址</label>
                    <div class="layui-input-block">
                        <input type="text" name="alipay_api_domain"  autocomplete="off" placeholder="请输入支付宝支付网关地址" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">支付宝私钥</label>
                    <div class="layui-input-block">
                        <textarea name="alipay_private_key" class="layui-textarea"></textarea>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">支付宝公钥</label>
                    <div class="layui-input-block">
                        <textarea name="alipay_public_key" class="layui-textarea"></textarea>
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">微信appid</label>
                    <div class="layui-input-block">
                        <input type="text" name="wxpay_app_id"  autocomplete="off" placeholder="请输入微信appid" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">微信商户号</label>
                    <div class="layui-input-block">
                        <input type="text" name="wxpay_mch_id"  autocomplete="off" placeholder="请输入微信商户号" class="layui-input">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">微信key</label>
                    <div class="layui-input-block">
                        <input type="text" name="wxpay_key"  autocomplete="off" placeholder="请输入微信商户号" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">微信secret</label>
                    <div class="layui-input-block">
                        <input type="text" name="wxpay_app_secret"  autocomplete="off" placeholder="请输入微信secret" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">微信证书文件</label>
                    <div class="layui-input-block">
                        <div class="laytpUpload"
                             data-name="wxpay_cert_path"
                             data-accept="file"
                             data-type="local-url"
                        ></div>
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">微信私钥文件</label>
                    <div class="layui-input-block">
                        <div class="laytpUpload"
                             data-name="wxpay_key_path"
                             data-accept="file"
                             data-type="local-url"
                        ></div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">微信小程序原始id</label>
                    <div class="layui-input-block">
                        <input type="text" name="wxmini_original_id"  autocomplete="off" placeholder="请输入微信小程序原始id" class="layui-input" >
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">易盾业务id</label>
                    <div class="layui-input-block">
                        <input type="text" name="yd_business_id"  autocomplete="off" placeholder="请输入易盾业务id" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">启动app是否需要登录</label>
                    <div class="layui-input-block">
                        <input type="radio" name="is_login_show" value="1" title="开启" checked>
                        <input type="radio" name="is_login_show" value="0" title="关闭">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">是否开启落地页</label>
                    <div class="layui-input-block">
                        <input type="radio" name="is_landing_page" value="1" title="开启" checked>
                        <input type="radio" name="is_landing_page" value="0" title="关闭">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">是否需要微信授权</label>
                    <div class="layui-input-block">
                        <input type="radio" name="is_wx_auth" value="1" title="是" checked>
                        <input type="radio" name="is_wx_auth" value="0" title="否">
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="bottom">
        <div class="button-container">
            <button type="submit" class="laytp-btn laytp-btn-primary laytp-btn-sm" lay-submit="" lay-filter="add">
                <i class="layui-icon layui-icon-ok"></i>
                提交
            </button>
            <button type="reset" class="laytp-btn laytp-btn-sm">
                <i class="layui-icon layui-icon-refresh"></i>
                重置
            </button>
        </div>
    </div>
</form>
<script>
    if(localStorage.getItem("staticDomain")){
        document.write("<link rel='stylesheet' href='" + localStorage.getItem("staticDomain") + "/component/layui/css/layui.css?v=" + localStorage.getItem("version") + "'>");
        document.write("<script src='" + localStorage.getItem("staticDomain") + "/component/layui/layui.js?v="+localStorage.getItem("version")+"'><\/script>");
        document.write("<script src='" + localStorage.getItem("staticDomain") + "/component/laytp/layuiConfig.js?v="+localStorage.getItem("version")+"'><\/script>");
    }else{
        document.write("<link rel='stylesheet' href='/static/component/layui/css/layui.css?v=" + localStorage.getItem("version") + "'>");
        document.write("<script src='/static/component/layui/layui.js?v="+localStorage.getItem("version")+"'><\/script>");
        document.write("<script src='/static/component/laytp/layuiConfig.js?v="+localStorage.getItem("version")+"'><\/script>");
    }
</script>
<script>
    layui.use(['laytp'],function(){
        layui.form.on('submit(add)', function(data){
            facade.ajax({
                route:'/admin.pay_config/add',
                data : data.field
            }).done(function(res){
                if(res.code === 0){
                    parent.layui.layer.close(parent.layui.layer.getFrameIndex(window.name));//关闭当前页
                    parent.layui.table.reload("laytp-table");
                }
            });
            return false;
        });
    })
</script>
</body>
</html>
