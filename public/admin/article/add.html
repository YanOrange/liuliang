<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>添加推荐阅读</title>
</head>
<body>
<form class="layui-form" lay-filter="layui-form">
    <div class="mainBox">
        <div class="main-container">
            <div class="main-container">
                <div class="layui-form-item">
                    <label class="layui-form-label"><text title="必填项" style="color:red;">*</text>商户</label>
                    <div class="layui-input-block">
                        <div class="xmSelect"
                             data-name="merchant_id"
                             data-sourceType="route"
                             data-source="/admin.common_api/getMerchantList"
                             data-textField="merchant_name"
                             data-valueField="id"
                             data-paging="true"
                             data-placeholder="商户"
                        ></div>
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">关联好课推荐</label>
                    <div class="layui-input-block">
                        <div class="xmSelect"
                             data-name="course_id"
                             data-sourceType="route"
                             data-source="/admin.course/index?course_type=0"
                             data-radio="true"
                             data-textField="title"
                             data-subTextField = "merchant.merchant_name"
                             data-valueField="id"
                             data-paging="true"
                             data-placeholder="请选择好课推荐"
                        ></div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label"><text title="必填项" style="color:red;">*</text>标题</label>
                    <div class="layui-input-block">
                        <input type="text" name="title"  lay-verify="required" autocomplete="off" placeholder="请输入标题" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label"><text title="必填项" style="color:red;">*</text>背景图</label>
                    <div class="layui-input-block">
                        <div class="laytpUpload"
                             data-name="image"
                             data-accept="image"
                             data-type="ali-oss-url"
                        ></div>
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">视频</label>
                    <div class="layui-input-block">
                        <div class="laytpUpload"
                             data-name="article_video_url"
                             data-accept="video"
                             data-type="ali-oss-url"
                             data-viaServer="unVia"
                        ></div>
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">关联应用</label>
                    <div class="layui-input-block" id="app-list1">
                        <div id="gather-channel-list" class="demo-tree1"></div>
                        <input type="hidden" name="channel_ids" id="channel-list"/>
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label" title="ueditor编辑器"><text title="必填项" style="color:red;">*</text>内容</label>
                    <div class="layui-input-block">
                        <iframe src="/admin/ueditor.html" class="editor" data-type="ueditor" data-id="content" style="width:100%;height:530px;border: 0"></iframe>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label"><text title="必填项" style="color:red;">*</text>排序</label>
                    <div class="layui-input-block">
                        <input type="number" name="sort"  lay-verify="number" autocomplete="off" placeholder="请输入排序" class="layui-input" value="0">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label"><text title="必填项" style="color:red;">*</text>虚拟阅读数量</label>
                    <div class="layui-input-block">
                        <input type="number" name="virtual_read_nums"  lay-verify="number" autocomplete="off" placeholder="请输入虚拟阅读数量" class="layui-input" value="999">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label"><text title="必填项" style="color:red;">*</text>虚拟点赞数量</label>
                    <div class="layui-input-block">
                        <input type="number" name="virtual_like_nums"  lay-verify="number" autocomplete="off" placeholder="请输入虚拟点赞数量" class="layui-input" value="999">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label"><text title="必填项" style="color:red;">*</text>状态</label>
                    <div class="layui-input-block">
                        <input type="radio" name="status" value="1" title="上架" >
                        <input type="radio" name="status" value="0" title="下架" checked>
                    </div>
                </div>

            </div>
        </div>
    </div>
    <div class="bottom">
        <div class="button-container">
            <button type="submit" class="laytp-btn laytp-btn-primary laytp-btn-sm" lay-submit="" lay-filter="add">
                <i class="layui-icon layui-icon-ok"></i>
                提交
            </button>
            <button type="reset" class="laytp-btn laytp-btn-sm">
                <i class="layui-icon layui-icon-refresh"></i>
                重置
            </button>
        </div>
    </div>
</form>
<script>
    if(localStorage.getItem("staticDomain")){
        document.write("<link rel='stylesheet' href='" + localStorage.getItem("staticDomain") + "/component/layui/css/layui.css?v=" + localStorage.getItem("version") + "'>");
        document.write("<script src='" + localStorage.getItem("staticDomain") + "/component/layui/layui.js?v="+localStorage.getItem("version")+"'><\/script>");
        document.write("<script src='" + localStorage.getItem("staticDomain") + "/component/laytp/layuiConfig.js?v="+localStorage.getItem("version")+"'><\/script>");
    }else{
        document.write("<link rel='stylesheet' href='/static/component/layui/css/layui.css?v=" + localStorage.getItem("version") + "'>");
        document.write("<script src='/static/component/layui/layui.js?v="+localStorage.getItem("version")+"'><\/script>");
        document.write("<script src='/static/component/laytp/layuiConfig.js?v="+localStorage.getItem("version")+"'><\/script>");
    }
</script>
<script>
    layui.use(['laytp'],function(){
        layui.form.on('submit(add)', function(data){
            data = facade.setEditorField(data);
            facade.ajax({
                route:'/admin.article/add',
                data : data.field
            }).done(function(res){
                if(res.code === 0){
                    parent.layui.layer.close(parent.layui.layer.getFrameIndex(window.name));//关闭当前页
                    parent.layui.table.reload("laytp-table");
                }
            });
            return false;
        });
    })

    // class - channel
    layui.use(['laytp', 'tree', 'util'], function () {
        $("#channel-list").val('')
        let data11 = [];

        //获取数据，渲染到对应的节点上
        $.ajax({
            type: "post",
            url: "/admin.advertising/getChannelTree",
            data: {id: 0, table: 'article'},
            dataType: "json",
            success: function (res) {
                data11 = res.data;
                let tree11 = layui.tree
                    , layer = layui.layer
                    , util = layui.util
                    , list11 = []
                    , str11 = ""
                    , data22 = [];

                //基本演示
                tree11.render({
                    elem: '#gather-channel-list'
                    , data: data11
                    , showCheckbox: true            //是否显示复选框
                    , id: 'demoId22'
                    , isJump: true                  //是否允许点击节点时弹出新窗口跳转
                    , click: function (obj) {
                        var data11 = obj.data22;    //获取当前点击的节点数据
                        layer.msg('状态：' + obj.state + '<br>节点数据：' + JSON.stringify(data));
                    }
                });

                //filter并非必须
                layui.use(['form'], function () {
                    let form11 = layui.form;
                    form11.on('checkbox', function (data) {
                        if (data.value.slice(data.value.length - 1) == "#") {   // 父级应用分类点击：全选
                            data11.forEach(element => {
                                if (data.value == element.id) {
                                    element.children.forEach(ele => {
                                        if ($(this).is(':checked')) {
                                            list11.push(ele.id)
                                        } else {
                                            list11 = list11.filter((x) => x !== ele.id)
                                        }
                                    })
                                }
                            });
                        } else {

                            data11.forEach(element => {
                                element.children.forEach(ele => {
                                    if (data.value == ele.id) {             // 应用点击
                                        if ($(this).is(':checked')) {
                                            list11.push(ele.id)
                                        } else {
                                            list11 = list11.filter((x) => x !== ele.id)
                                        }
                                    } else {
                                        ele.children.forEach(el => {        // 渠道点击
                                            if (data.value == el.id) {
                                                if ($(this).is(':checked')) {
                                                    list11.push(el.id)
                                                } else {
                                                    list11 = list11.filter((x) => x !== el.id)
                                                }
                                            }
                                        })
                                    }
                                })
                            });
                        }

                        str11 = ""
                        list11.forEach(ele => {
                            str11 += "," + ele
                        })
                        str11 = str11.slice(1)

                        $("#channel-list").val(str11);
                    })
                })

                //开启复选框
                tree11.render({
                    elem: '#gather-channel-list'
                    , data: data11
                    , showCheckbox: true
                });
            }
        })
    });
</script>
</body>
</html>
