<!DOCTYPE html>
<html lang="zh-cn">
<head>
  <meta charset="UTF-8">
  <meta name="author" content="Fly">
  <title>文章</title>
  <style>
    * {
      padding: 0;
      margin: 0;
    }
    .main {
      width: 100%;
      height: auto;
    }
    /* 大于667 */
    @media all and (min-width:667px) {
      .text {
        width: 667px;
        height: 300px;
        margin: 0 auto;


      }

      .text section {
        width: 100%;
      }
    }

    /* 小于667 */
    @media all and (max-width:667px) {
      .text {
        width: 100%;
        height: 300px;
        margin: 0 auto;
      }

      .text section {
        width: 100%;
      }
    }
  </style>
</head>
<body>
<div id="app">
  <div class="main">
    <div class="text" v-html="content"></div>
  </div>
</div>
<script src="https://unpkg.com/vue@next"></script>
<script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.6.1/jquery.min.js"></script>
<script>
  const OPTION = {
    data() {
      return {
        content:`...`,
      }
    },
    mounted() {
      this.detail();
    },
    methods: {
      detail: function () {
        var _this = this;
        var param = window.location.search;
        var id = param.substr(param.lastIndexOf("=") + 1);

        if (id > 0) {
          $.ajax({
            type: "post",
            url: "/admin.article/info",
            data: {id: id},
            dataType: "json",
            success: function (res) {
              $("title").text(res.data.title);
              _this.content = res.data.content;
            }
          })
        }
      }
    },
  }
  Vue.createApp(OPTION).mount("#app");
</script>
</body>
</html>
