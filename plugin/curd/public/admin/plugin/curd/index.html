<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>生成CURD</title>
</head>
<body class="laytp-container">
<div class="layui-row layui-col-space10">
    <div class="layui-col-md5">
        <div class="layui-card">
            <div class="layui-card-body">
                <form class="layui-form" action="">
                    <div class="layui-form-item">
                        <label class="layui-form-label">表名</label>
                        <div class="layui-input-inline">
                            <input type="text" name="search_param[table][value]" class="layui-input" autocomplete="off" />
                            <input type="hidden" name="search_param[table][condition]" value="LIKE">
                        </div>
                        <button class="laytp-btn laytp-btn-md laytp-btn-primary" lay-submit lay-filter="laytp-search-form">
                            <i class="layui-icon layui-icon-search"></i>
                            查询
                        </button>
                        <button type="reset" class="laytp-btn laytp-btn-md laytp-search-form-reset">
                            <i class="layui-icon layui-icon-refresh"></i>
                            重置
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <div class="layui-col-md7">
        <div class="layui-card">
            <div class="layui-card-body">
                <form class="layui-form" action="">
                    <div class="layui-form-item">
                        <label class="layui-form-label" style="display:none;">表ID</label>
                        <div class="layui-input-inline" style="display:none;">
                            <input type="text" name="search_param[table_id][value]" id="table_id" class="layui-input" autocomplete="off" />
                            <input type="hidden" name="search_param[table_id][condition]" value="=">
                        </div>
                        <label class="layui-form-label">字段名</label>
                        <div class="layui-input-inline">
                            <input type="text" name="search_param[field][value]" id="field" class="layui-input" autocomplete="off" />
                            <input type="hidden" name="search_param[field][condition]" value="LIKE">
                        </div>
                        <button class="laytp-btn laytp-btn-md laytp-btn-primary" lay-submit lay-filter="laytp-search-field-form" id="search-field-form-submit-btn">
                            <i class="layui-icon layui-icon-search"></i>
                            查询
                        </button>
                        <button type="button" class="laytp-btn laytp-btn-md laytp-search-field-form-reset">
                            <i class="layui-icon layui-icon-refresh"></i>
                            重置
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<div class="layui-row layui-col-space10">
    <div class="layui-col-md5">
        <div class="layui-card">
            <div class="layui-card-body">
                <table id="database-table" lay-filter="database-table"></table>
            </div>
        </div>
    </div>
    <div class="layui-col-md7">
        <div class="layui-card">
            <div class="layui-card-body">
                <svg class="empty" style="margin-top: 50px;margin-left: 220px;margin-bottom: 80px;" width="184" height="152"
                     viewBox="0 0 184 152" xmlns="http://www.w3.org/2000/svg">
                    <g fill="none" fillRule="evenodd">
                        <g transform="translate(24 31.67)">
                            <ellipse fillOpacity=".8" fill="#F5F5F7" cx="67.797" cy="106.89" rx="67.797" ry="12.668"></ellipse>
                            <path d="M122.034 69.674L98.109 40.229c-1.148-1.386-2.826-2.225-4.593-2.225h-51.44c-1.766 0-3.444.839-4.592 2.225L13.56 69.674v15.383h108.475V69.674z"
                                  fill="#AEB8C2"></path>
                            <path d="M101.537 86.214L80.63 61.102c-1.001-1.207-2.507-1.867-4.048-1.867H31.724c-1.54 0-3.047.66-4.048 1.867L6.769 86.214v13.792h94.768V86.214z"
                                  fill="url(#linearGradient-1)" transform="translate(13.56)"></path>
                            <path d="M33.83 0h67.933a4 4 0 0 1 4 4v93.344a4 4 0 0 1-4 4H33.83a4 4 0 0 1-4-4V4a4 4 0 0 1 4-4z" fill="#F5F5F7"></path>
                            <path d="M42.678 9.953h50.237a2 2 0 0 1 2 2V36.91a2 2 0 0 1-2 2H42.678a2 2 0 0 1-2-2V11.953a2 2 0 0 1 2-2zM42.94 49.767h49.713a2.262 2.262 0 1 1 0 4.524H42.94a2.262 2.262 0 0 1 0-4.524zM42.94 61.53h49.713a2.262 2.262 0 1 1 0 4.525H42.94a2.262 2.262 0 0 1 0-4.525zM121.813 105.032c-.775 3.071-3.497 5.36-6.735 5.36H20.515c-3.238 0-5.96-2.29-6.734-5.36a7.309 7.309 0 0 1-.222-1.79V69.675h26.318c2.907 0 5.25 2.448 5.25 5.42v.04c0 2.971 2.37 5.37 5.277 5.37h34.785c2.907 0 5.277-2.421 5.277-5.393V75.1c0-2.972 2.343-5.426 5.25-5.426h26.318v33.569c0 .617-.077 1.216-.221 1.789z"
                                  fill="#DCE0E6"></path>
                        </g>
                        <path d="M149.121 33.292l-6.83 2.65a1 1 0 0 1-1.317-1.23l1.937-6.207c-2.589-2.944-4.109-6.534-4.109-10.408C138.802 8.102 148.92 0 161.402 0 173.881 0 184 8.102 184 18.097c0 9.995-10.118 18.097-22.599 18.097-4.528 0-8.744-1.066-12.28-2.902z"
                              fill="#DCE0E6"></path>
                        <g transform="translate(149.65 15.383)" fill="#FFF">
                            <ellipse cx="20.654" cy="3.167" rx="2.849" ry="2.815"></ellipse>
                            <path d="M5.698 5.63H0L2.898.704zM9.259.704h4.985V5.63H9.259z"></path>
                        </g>
                    </g>
                </svg>
                <table id="field-table" lay-filter="field-table"></table>
            </div>
        </div>
    </div>
</div>
</body>

<script type="text/html" id="database-table-toolbar">
    <button class="laytp-btn laytp-btn-primary laytp-btn-md" lay-event="addTable">
        <i class="layui-icon layui-icon-add-1"></i>
        新增数据表
    </button>
    <button class="laytp-btn laytp-btn-danger laytp-btn-md" lay-event="recycleTable">
        <i class="layui-icon layui-icon-delete"></i>
        数据表回收站
    </button>
</script>

<script type="text/html" id="database-table-bar">
    <button class="laytp-btn laytp-btn-primary laytp-btn-sm" lay-event="editTable">
        <i class="layui-icon layui-icon-edit"></i>
    </button>
    <button class="laytp-btn laytp-btn-warming laytp-btn-sm" lay-event="tableFields">
        <i class="layui-icon layui-icon-transfer"></i>
    </button>
    <button class="laytp-btn laytp-btn-danger laytp-btn-sm" lay-event="delTable">
        <i class="layui-icon layui-icon-delete"></i>
    </button>
</script>

<script type="text/html" id="field-table-toolbar">
    <button class="laytp-btn laytp-btn-primary laytp-btn-md" lay-event="addField">
        <i class="layui-icon layui-icon-add-1"></i>
        新增字段
    </button>
    <button class="laytp-btn laytp-btn-danger laytp-btn-md" lay-event="recycleField">
        <i class="layui-icon layui-icon-delete"></i>
        字段回收站
    </button>
    <button class="laytp-btn laytp-btn-success laytp-btn-md" lay-event="createNormalCurd">
        <i class="layui-icon layui-icon-util"></i>
        生成常规CURD
    </button>
    <button class="laytp-btn laytp-btn-warming laytp-btn-md" lay-event="createCategoryCurd">
        <i class="layui-icon layui-icon-list"></i>
        生成分类CURD
    </button>
</script>

<script type="text/html" id="field-table-bar">
    <button class="laytp-btn laytp-btn-primary laytp-btn-sm" lay-event="editField">
        <i class="layui-icon layui-icon-edit"></i>
    </button>
    <button class="laytp-btn laytp-btn-danger laytp-btn-sm" lay-event="delField">
        <i class="layui-icon layui-icon-delete"></i>
    </button>
</script>

<script>
    if(localStorage.getItem("staticDomain")){
        document.write("<link rel='stylesheet' href='" + localStorage.getItem("staticDomain") + "/component/layui/css/layui.css?v=" + localStorage.getItem("version") + "'>");
        document.write("<script src='" + localStorage.getItem("staticDomain") + "/component/layui/layui.js?v="+localStorage.getItem("version")+"'><\/script>");
        document.write("<script src='" + localStorage.getItem("staticDomain") + "/component/laytp/layuiConfig.js?v="+localStorage.getItem("version")+"'><\/script>");
        document.write("<script src='" + localStorage.getItem("staticDomain") + "/plugin/curd/js/index.js?v="+localStorage.getItem("version")+"'><\/script>");
    }else{
        document.write("<link rel='stylesheet' href='/static/component/layui/css/layui.css?v=" + localStorage.getItem("version") + "'>");
        document.write("<script src='/static/component/layui/layui.js?v="+localStorage.getItem("version")+"'><\/script>");
        document.write("<script src='/static/component/laytp/layuiConfig.js?v="+localStorage.getItem("version")+"'><\/script>");
        document.write("<script src='/static/plugin/curd/js/index.js?v="+localStorage.getItem("version")+"'><\/script>");
    }
</script>
</html>
