<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>生成无限极分类Curd</title>
</head>
<body>
<script type="text/html" id="form">
    <div class="mainBox">
        <div class="main-container">
            <input type="hidden" name="table_id" value="{{d.id}}"/>
            <div class="layui-form-item">
                <label class="layui-form-label" title="使用Migrate">使用Migrate</label>
                <div class="layui-input-block">
                    <input type="checkbox" name="create_table" id="create_table" value="1"
                           {{# if(d.has_create_table=== 0 || typeof d.has_create_table=== "undefined"){ }}checked="checked"
                    {{# } }}
                    title="创建(更新)数据表结构，并清空数据"/>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label" title="是否生成菜单">是否生成菜单</label>
                <div class="layui-input-block">
                    <input type="checkbox" name="create_menu" id="create_menu" value="1"
                           {{# if(d.has_create_menu=== 0 || typeof d.has_create_menu=== "undefined"){ }}checked="checked"
                    {{# } }}
                    title="生成菜单"/>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label" title="所属菜单">所属菜单</label>
                <div class="layui-input-block">
                    <div class="xmSelect"
                         data-name="menu_id"
                         data-sourceType="route"
                         data-source="/admin.menu/index"
                         data-params='{"search_param":{"is_menu":{"value":1,"condition":"="}}}'
                         data-sourceTree="true"
                         data-radio="true"
                         data-textField="name"
                         data-valueField="id"
                    ></div>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label" title="父级字段">父级字段</label>
                <div class="layui-input-block">
                    <div class="xmSelect"
                         data-name="parent_field"
                         data-sourceType="route"
                         data-source="/plugin/curd/curd.field/index"
                         data-params='{"search_param":{"table_id":{"value":"{{d.id}}","condition":"="}},"all_data":1}'
                         data-valueField="field"
                         data-textField="field"
                         data-radio="true"
                         data-selected="{{d.create_addition.parent_field}}"
                    >
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label" title="主键ID排序方式">主键ID排序方式</label>
                <div class="layui-input-block">
                    <select name="id_order_type">
                        <option value="ASC" {{# if(d.create_addition.id_order_type==="ASC"){ }}selected="selected" {{# } }}>
                            ASC
                        </option>
                        <option value="DESC" {{# if(d.create_addition.id_order_type==="DESC"){ }}selected="selected" {{# }
                                }}>DESC
                        </option>
                    </select>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label" title="排序字段">排序字段</label>
                <div class="layui-input-block">
                    <div class="xmSelect"
                         data-name="order_field"
                         data-sourceType="route"
                         data-source="/plugin/curd/curd.field/index"
                         data-params='{"search_param":{"table_id":{"value":"{{d.id}}","condition":"="}},"all_data":1}'
                         data-valueField="field"
                         data-textField="field"
                         data-radio="true"
                         data-selected="{{d.create_addition.order_field}}"
                    >
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label" title="排序字段排序方式">排序字段排序方式</label>
                <div class="layui-input-block">
                    <select name="order_type">
                        <option value="DESC" {{# if(d.create_addition.order_type==="DESC"){ }}selected="selected" {{# } }}>
                            DESC
                        </option>
                        <option value="ASC" {{# if(d.create_addition.order_type==="ASC"){ }}selected="selected" {{# } }}>
                            ASC
                        </option>
                    </select>
                </div>
            </div>
        </div>
    </div>
    <div class="bottom">
        <div class="button-container">
            <button type="submit" class="laytp-btn laytp-btn-primary laytp-btn-sm submitCreateCategoryCurdBtn" lay-submit="" lay-filter="laytp-form">
                <i class="layui-icon layui-icon-ok"></i>
                提交
            </button>
            <button type="reset" class="laytp-btn laytp-btn-sm">
                <i class="layui-icon layui-icon-refresh"></i>
                重置
            </button>
        </div>
    </div>
</script>
<form class="layui-form" lay-filter="layui-form"></form>
</body>
<script>
    if(localStorage.getItem("staticDomain")){
        document.write("<link rel='stylesheet' href='" + localStorage.getItem("staticDomain") + "/component/layui/css/layui.css?v=" + localStorage.getItem("version") + "'>");
        document.write("<script src='" + localStorage.getItem("staticDomain") + "/component/layui/layui.js?v="+localStorage.getItem("version")+"'><\/script>");
        document.write("<script src='" + localStorage.getItem("staticDomain") + "/component/laytp/layuiConfig.js?v="+localStorage.getItem("version")+"'><\/script>");
    }else{
        document.write("<link rel='stylesheet' href='/static/component/layui/css/layui.css?v=" + localStorage.getItem("version") + "'>");
        document.write("<script src='/static/component/layui/layui.js?v="+localStorage.getItem("version")+"'><\/script>");
        document.write("<script src='/static/component/laytp/layuiConfig.js?v="+localStorage.getItem("version")+"'><\/script>");
    }
</script>
<script>
    layui.use(['laytp','button'],function(){
        let form = layui.form;
        let $ = layui.jquery;
        //获取参数ID
        var tableId = facade.getUrlParam('table_id');
        if(!tableId){
            facade.error('参数table_id不能为空');
        }

        //获取数据，渲染到对应的节点上
        facade.ajax({
            route: "/plugin/curd/curd.table/info",
            data: {id: tableId},
            successAlert: false,
            showLoading: true
        }).done(function(res){
            if(res.code === 0){
                var createAddition = JSON.parse(res.data.create_addition);
                res.data.create_addition = createAddition;
                if(!createAddition){
                    res.data.create_addition = {
                        "parent_field" : "",
                        "order_field" : "",
                    };
                }
                layui.laytpl($("#form").html()).render(res.data,function(string){
                    $("form").html(string);
                    layui.laytpForm.render();
                    form.render();
                });
            }
        });

        form.on('submit(laytp-form)', function(data){
            var btnAnim = layui.button.load({elem: '.submitCreateCategoryCurdBtn'});
            facade.ajax({
                route: '/plugin/curd/curd/createCategoryCurd',
                data: data.field
            }).done(function(res){
                if(res.code === 0){
                    parent.layui.layer.close(parent.layui.layer.getFrameIndex(window.name));//关闭当前页
                    parent.parent.renderMenu();//重新渲染菜单
                    parent.facade.success("生成成功");
                }
                btnAnim.stop();
            }).fail(function(){
                btnAnim.stop();
            });
            return false;
        });
    })
</script>
</html>
